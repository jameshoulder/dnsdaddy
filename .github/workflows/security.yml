name: Security

# DNS Daddy sits in the resolution path of every device on a network, and it
# is self-hosted — nobody is going to patch it for the operator. That makes the
# supply chain and the parsers the two things worth checking on every change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly disclosed advisory in a dependency we have not touched
    # still surfaces. Most vulnerabilities arrive without a commit from us.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"

jobs:
  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck reports only advisories that are reachable from our code,
      # so a finding here is a call to action rather than noise to triage.
      # It covers the standard library too, which is how the go directive
      # itself becomes a security control.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -severity medium: the LOW findings are all unchecked Close() on paths
      # that are already returning an error, plus maphash.WriteString, which is
      # documented never to fail. Failing the build on those trains people to
      # ignore the tool, which is worse than not running it.
      #
      # Every suppression in the tree carries a #nosec comment saying why.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence low ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Semgrep is here for one specific reason rather than as a fourth opinion
      # on the same code. This repository already carries `// nosemgrep:`
      # suppressions and a triage write-up in docs/security/ from a hosted scan,
      # and nothing in CI re-ran the tool — so nothing checked that those
      # suppressions still matched anything, or that a change had not
      # reintroduced a finding they were written for. Three of them had in fact
      # stopped working: Semgrep honours the annotation only on the matched line
      # or the one immediately above, and an intervening comment line had
      # silently disabled them. A suppression nobody re-runs is not a decision,
      # it is a note.
      #
      # Installed rather than run through the vendor's action: one fewer
      # third-party action in the supply chain, and it matches how govulncheck,
      # gosec and staticcheck are installed in the jobs above. The rulesets are
      # fetched from the Semgrep registry at run time, which is a deliberate
      # trade — the rules stay current, at the cost of a network dependency
      # this job cannot pin.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      # --error makes a finding fail the build. That is only reasonable because
      # the tree is at zero findings today; every suppression names its exact
      # rule on its exact line and says why, and they are listed in
      # docs/security/semgrep-triage-2026-07-29.md.
      - name: semgrep
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/github-actions \
            --config=p/secrets \
            --metrics=off \
            --error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

  trivy:
    name: Container and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: docker build --build-arg VERSION=security-scan -t dnsdaddy:scan .

      # Both steps pin aquasecurity/trivy-action to the commit behind v0.36.0.
      #
      # Two things make the exact commit worth spelling out. The action was
      # part of the March 2026 Trivy supply-chain compromise (GHSA-69fq-xp46-6x23):
      # a threat actor force-pushed 76 of the 77 tags in this repository —
      # everything from 0.0.1 through 0.34.2 — onto credential-stealing
      # commits, and did the same to all seven tags of aquasecurity/setup-trivy,
      # which this action calls internally. A tag reference offered no
      # protection at all during that window, and the tags that were rewritten
      # then are not the tags that exist now.
      #
      # v0.36.0 (2026-04-22) is the first release cut after remediation
      # concluded, and its own internal pin of setup-trivy is
      # 3fb12ec12f41e471780db15c232d5dd185dcb514 — the v0.2.6 commit the
      # advisory names as clean. The previous pin here, v0.9.2, sat squarely
      # inside the rewritten range.
      #
      # Trivy itself is left at the version the action pins (v0.70.0), rather
      # than pinned again here: a second version number in this file is one
      # Dependabot cannot see, and it would go stale exactly the way v0.9.2
      # did. Bumping the action SHA is what moves the scanner forward, and
      # Dependabot raises that pull request. v0.70.0 is well clear of the
      # malicious v0.69.4-v0.69.6 binaries.
      #
      # v0.9.2 also bundled a Trivy old enough to reject this module outright:
      # it parsed the go.mod directive with a two-component matcher and died on
      # "invalid go version '1.25.12': must match format 1.23" before scanning
      # anything. That is a scanner bug, not a go.mod defect — the directive is
      # valid — so the fix is the scanner, never the Go version.

      # The published image is what most people actually run, so scanning the
      # source alone would miss anything the base image brings in.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dnsdaddy:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # An operator running this on their own network should be able to answer
      # "am I affected?" for a new CVE without waiting for us.
      - name: Generate a CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod app -json -licenses -main ./cmd/dnsdaddy -output sbom.json .

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Domain normalisation is reached by every query from every client before
      # any authentication, which makes it the most exposed parser we have. A
      # short run per PR catches regressions; the corpus in testdata/ keeps
      # anything previously found from coming back.
      - name: Fuzz Normalize
        run: go test ./internal/domainutil -run=Fuzz -fuzz=FuzzNormalize -fuzztime=60s

      - name: Fuzz Suffixes
        run: go test ./internal/domainutil -run=Fuzz -fuzz=FuzzSuffixes -fuzztime=60s

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: internal/domainutil/testdata/fuzz/
          retention-days: 30
