name: Security

# DNS Daddy sits in the resolution path of every device on a network, and it
# is self-hosted — nobody is going to patch it for the operator. That makes the
# supply chain and the parsers the two things worth checking on every change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly disclosed advisory in a dependency we have not touched
    # still surfaces. Most vulnerabilities arrive without a commit from us.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"

jobs:
  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck reports only advisories that are reachable from our code,
      # so a finding here is a call to action rather than noise to triage.
      # It covers the standard library too, which is how the go directive
      # itself becomes a security control.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -severity medium: the LOW findings are all unchecked Close() on paths
      # that are already returning an error, plus maphash.WriteString, which is
      # documented never to fail. Failing the build on those trains people to
      # ignore the tool, which is worse than not running it.
      #
      # Every suppression in the tree carries a #nosec comment saying why.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence low ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

  trivy:
    name: Container and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: docker build --build-arg VERSION=security-scan -t dnsdaddy:scan .

      # The published image is what most people actually run, so scanning the
      # source alone would miss anything the base image brings in.
      - name: Scan the image
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: dnsdaddy:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan the repository
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # An operator running this on their own network should be able to answer
      # "am I affected?" for a new CVE without waiting for us.
      - name: Generate a CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod app -json -licenses -main ./cmd/dnsdaddy -output sbom.json .

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Domain normalisation is reached by every query from every client before
      # any authentication, which makes it the most exposed parser we have. A
      # short run per PR catches regressions; the corpus in testdata/ keeps
      # anything previously found from coming back.
      - name: Fuzz Normalize
        run: go test ./internal/domainutil -run=Fuzz -fuzz=FuzzNormalize -fuzztime=60s

      - name: Fuzz Suffixes
        run: go test ./internal/domainutil -run=Fuzz -fuzz=FuzzSuffixes -fuzztime=60s

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: internal/domainutil/testdata/fuzz/
          retention-days: 30
