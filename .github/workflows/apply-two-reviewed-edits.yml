# Temporary branch-only source transfer. No project code is executed here.
name: Apply two reviewed migration edits
on:
  push:
    branches: [fix/privacy-review-followup-20261003]
    paths: [.github/workflows/apply-two-reviewed-edits.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jameshoulder/dnsdaddy' && github.ref == 'refs/heads/fix/privacy-review-followup-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact hash-checked changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          changes = [
            ('internal/api/network_access_test.go', 'f9a2c992c6377806e96389eeb9fc16a40a015a4b1bd7f6f3d0d4125d1af5e84b', '86a075c92c2453565ded073483675cf1bca572766f5f7fc5196432ea67328490', [(621,622,'// but reading that private state requires a session or API token.\n'),(624,624,'\th.login()\n'),(644,645,'\t// Authenticated: doctor also needs an explicit token for live private state.\n')]),
            ('deploy/production-deploy.sh', 'f0857bc348f50dc785a393aa7acbc63ac0a7a749b6dbd07066f58b1562ac468f', 'ae2229821b126e0202f765500f96c65f1ae11ef9ee0a73453c09683104e7c26d', [(436,441,'  # Unauthenticated health is liveness-only, even inside a container. Older\n  # releases may still supply detail; missing fields remain unknown. Do not\n  # attempt to gain entitlement merely by moving the request to loopback.\n  DETAIL="$BODY"\n'),(443,444,'    warn "live blocklist size is unknown without authenticated detail; use dnsdaddy doctor --api-token-file with an owner-only token file readable by the service"\n')])
          ]
          planned = []
          for name,before,after,edits in changes:
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == before
              lines = old.decode().splitlines(keepends=True)
              for a,b,text in reversed(edits):
                  lines[a:b] = text.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == after
              planned.append((path,new))
          for path,new in planned: path.write_bytes(new)
          subprocess.run(['git','add','internal/api/network_access_test.go','deploy/production-deploy.sh'],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          env = dict(os.environ,GIT_INDEX_FILE=os.path.join(os.environ['RUNNER_TEMP'],'clean-index'))
          subprocess.run(['git','read-tree',tree],env=env,check=True)
          subprocess.run(['git','update-index','--force-remove','.github/workflows/apply-two-reviewed-edits.yml'],env=env,check=True)
          clean = subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert clean == 'b1bee6efb7813ff3582533c18ded7108b1c672dd', clean
          print('Verified complete corrected tree',clean)
          PY
      - name: Commit only to the work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DNS Daddy maintenance bot'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'Finish explicit-auth health migration for integration test and deployment helper'
          git push origin HEAD:refs/heads/fix/privacy-review-followup-20261003
