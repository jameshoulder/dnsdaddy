name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # go.mod shipped with every direct dependency mislabelled `// indirect`,
      # which misleads anyone reading the manifest to understand the dependency
      # surface and skews how Dependabot prioritises updates. Cheap to check,
      # easy to reintroduce.
      - name: go.mod and go.sum must be tidy
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          if ! diff -q /tmp/go.mod.orig go.mod || ! diff -q /tmp/go.sum.orig go.sum; then
            echo "go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            diff -u /tmp/go.mod.orig go.mod || true
            diff -u /tmp/go.sum.orig go.sum || true
            exit 1
          fi

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # The resolver is concurrent by nature: atomic snapshot swaps, a sharded
      # cache, and a batching log writer. A data race here would be a
      # correctness bug in the DNS path, so it is worth the slower run.
      - name: Test with race detector
        run: go test -race ./...

      # The dashboard is hand-written JavaScript with no build step, which is
      # exactly why it needs pinning: a wrong branch in the Threat Observatory
      # card tells an operator they are protected when nothing has downloaded,
      # and no Go test would notice. Node's built-in runner, no packages.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Dashboard tests
        run: node --test internal/web/app.test.js

      # The documentation cross-references itself heavily and is the main way
      # anyone judges what this project does. A dead link is a small thing that
      # makes the whole set look unmaintained.
      - name: Check documentation links
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          broken = []
          files = [p for p in pathlib.Path('.').rglob('*.md') if '.git' not in p.parts]
          for f in files:
              text = f.read_text()
              targets = [m.group(2) for m in re.finditer(r'\[([^\]]*)\]\(([^)\s]+)\)', text)]
              targets += [m.group(2) for m in re.finditer(r'^\[([^\]]+)\]:\s*(\S+)$', text, re.M)]
              for t in targets:
                  if t.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  path = t.partition('#')[0]
                  if path and not (f.parent / path).resolve().exists():
                      broken.append(f"{f}: {t}")
          if broken:
              print("Broken relative links:")
              for b in sorted(set(broken)):
                  print("  ", b)
              sys.exit(1)
          print(f"{len(files)} markdown files checked, all relative links resolve")
          PY

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/dnsdaddy
          # The lab tools ship in their own image but live in this module; if
          # they stop compiling, the lab stops working and nobody notices until
          # somebody tries to run a demo.
          go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/dnsdaddy-lab

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -o dnsdaddy ./cmd/dnsdaddy

      - name: Start the resolver against a local feed
        run: |
          mkdir -p /tmp/dd
          printf '0.0.0.0 blocked-by-ci.example\n' > /tmp/dd/feed.txt
          cat > /tmp/dd/config.yaml <<EOF
          data_dir: /tmp/dd/data
          dns:
            listen_udp: "127.0.0.1:15353"
            listen_tcp: "127.0.0.1:15353"
            upstreams: ["udp://1.1.1.1:53"]
          http:
            listen: "127.0.0.1:18080"
            admin_password: "ci-test-password-longer-than-twelve"
          feeds:
            refresh_on_start: false
            # file:// feeds are confined to this directory and disabled
            # without it; the smoke test loads its fixture from here.
            local_feed_dir: /tmp/dd
          detection:
            enabled: true
            eval_interval: 2s
            # Compressed so a finding appears inside a CI run rather than five
            # minutes into one. Paired with fast traffic below, as the docs
            # require — the volume gates do not scale with the window.
            window_scale: 0.1
            cooldown: 30s
            findings_file: findings.jsonl
          EOF
          ./dnsdaddy -config /tmp/dd/config.yaml &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:18080/api/v1/health && break
            sleep 0.5
          done

      - name: Load the feed and rebuild the index
        run: |
          curl -sf -c /tmp/dd/jar -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-test-password-longer-than-twelve"}' \
            http://127.0.0.1:18080/api/v1/auth/login
          # Disable the built-in remote feeds so CI does not depend on third
          # parties being up.
          for f in urlhaus hagezi-tif-mini phishing-army \
                   blocklistproject-phishing botnet-c2 coinblocker; do
            curl -sf -b /tmp/dd/jar -X PATCH -H 'Content-Type: application/json' \
              -d '{"enabled":false}' "http://127.0.0.1:18080/api/v1/feeds/$f" > /dev/null
          done
          curl -sf -b /tmp/dd/jar -X POST -H 'Content-Type: application/json' \
            -d '{"name":"CI feed","url":"file:///tmp/dd/feed.txt","category":"malware","format":"hosts"}' \
            http://127.0.0.1:18080/api/v1/feeds
          curl -sf -b /tmp/dd/jar -X POST http://127.0.0.1:18080/api/v1/feeds/refresh
          sleep 5

      - name: Assert blocking and resolution
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

          echo "--- a listed domain must be NXDOMAIN ---"
          dig @127.0.0.1 -p 15353 blocked-by-ci.example +short +timeout=5 > /tmp/blocked.txt
          status=$(dig @127.0.0.1 -p 15353 blocked-by-ci.example +timeout=5 | grep -oP 'status: \K\w+')
          echo "status=$status"
          [ "$status" = "NXDOMAIN" ] || { echo "expected NXDOMAIN"; exit 1; }

          echo "--- a subdomain of a listed domain must also be blocked ---"
          status=$(dig @127.0.0.1 -p 15353 sub.blocked-by-ci.example +timeout=5 | grep -oP 'status: \K\w+')
          [ "$status" = "NXDOMAIN" ] || { echo "expected NXDOMAIN for the subdomain"; exit 1; }

          echo "--- a lookalike must NOT be blocked ---"
          # Asserting on the rcode cannot work here: .example is reserved
          # (RFC 2606) so a lookalike gets NXDOMAIN from the upstream anyway,
          # which is indistinguishable from ours. The query log records why,
          # which is the thing actually under test.
          dig @127.0.0.1 -p 15353 notblocked-by-ci.example +timeout=5 > /dev/null
          sleep 2
          action=$(curl -sf -b /tmp/dd/jar 'http://127.0.0.1:18080/api/v1/queries?limit=50' \
            | jq -r '[.queries[] | select(.domain == "notblocked-by-ci.example")][0].action')
          echo "action=$action"
          [ "$action" = "allowed" ] || { echo "suffix confusion: lookalike was $action"; exit 1; }

          echo "--- a clean domain must resolve ---"
          dig @127.0.0.1 -p 15353 example.com +short +timeout=5 | grep -qE '^[0-9]' \
            || { echo "clean domain did not resolve"; exit 1; }

          echo "--- health must report a loaded blocklist ---"
          curl -sf http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"' \
            || { echo "health is not ok"; exit 1; }

          echo "--- the API must reject unauthenticated calls ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/overview)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

          echo "--- ANY must get a minimal RFC 8482 answer, not a forwarded one ---"
          dig @127.0.0.1 -p 15353 example.com ANY +timeout=5 | grep -q 'RFC8482' \
            || { echo "ANY was not answered per RFC 8482"; exit 1; }

          echo "--- the bare DoH path must require a token ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/dns-message' \
            --data-binary @/dev/null http://127.0.0.1:18080/dns-query)
          [ "$code" = "403" ] || { echo "expected 403 on untokenized /dns-query, got $code"; exit 1; }

          echo "--- a cross-origin state change must be refused ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/dd/jar \
            -H 'Origin: https://evil.example' \
            -X POST http://127.0.0.1:18080/api/v1/feeds/refresh)
          [ "$code" = "403" ] || { echo "expected 403 on a cross-origin POST, got $code"; exit 1; }

          echo "--- a file:// feed outside local_feed_dir must be refused ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/dd/jar \
            -H 'Content-Type: application/json' \
            -d '{"name":"escape","url":"file:///etc/passwd","category":"malware","format":"hosts"}' \
            -X POST http://127.0.0.1:18080/api/v1/feeds)
          [ "$code" = "400" ] || { echo "expected 400 for a file:// feed outside local_feed_dir, got $code"; exit 1; }

          echo "--- the detector catalogue must be served and claim no enforcement ---"
          catalogue=$(curl -sf -b /tmp/dd/jar http://127.0.0.1:18080/api/v1/detectors)
          echo "$catalogue" | jq -e '.enabled == true' > /dev/null \
            || { echo "detection is not enabled"; exit 1; }
          echo "$catalogue" | jq -e '.enforcement == "none"' > /dev/null \
            || { echo "the catalogue does not report enforcement: none"; exit 1; }
          # Behavioural detection is alert-only by design. A detector claiming
          # otherwise is a design regression, not a configuration change.
          echo "$catalogue" | jq -e '[.detectors[] | select(.enforces == true)] | length == 0' > /dev/null \
            || { echo "a detector claims to enforce policy"; exit 1; }
          # Every detector must publish its maturity, so nothing is presented
          # with more authority than it has earned.
          echo "$catalogue" | jq -e '[.detectors[] | select(.maturity == null or .maturity == "")] | length == 0' > /dev/null \
            || { echo "a detector publishes no maturity"; exit 1; }

          echo "all smoke assertions passed"

      - name: A tunnel must be detected, and normal traffic must not be
        run: |
          go build -o /tmp/dd/dnsdaddy-lab ./cmd/dnsdaddy-lab

          # The synthetic upstream, so the scenarios resolve realistically and
          # nothing leaves the runner.
          /tmp/dd/dnsdaddy-lab -sink 127.0.0.1:15300 &
          sleep 2

          cat > /tmp/dd/lab.yaml <<EOF
          data_dir: /tmp/dd/labdata
          dns:
            listen_udp: "127.0.0.1:15363"
            listen_tcp: "127.0.0.1:15363"
            upstreams: ["udp://127.0.0.1:15300"]
          http:
            listen: "127.0.0.1:18090"
            admin_password: "ci-test-password-longer-than-twelve"
          feeds:
            refresh_on_start: false
          detection:
            enabled: true
            eval_interval: 2s
            window_scale: 0.1
            cooldown: 30s
            findings_file: findings.jsonl
          EOF
          ./dnsdaddy -config /tmp/dd/lab.yaml &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:18090/api/v1/health && break
            sleep 0.5
          done

          # Window scale 0.1 with traffic at 10x keeps the queries-per-window
          # the same as production, which is what makes this meaningful.
          /tmp/dd/dnsdaddy-lab -server 127.0.0.1:15363 -scenario dns-tunnelling -speed 10 -quiet
          /tmp/dd/dnsdaddy-lab -server 127.0.0.1:15363 -scenario normal-dns -speed 10 -quiet
          /tmp/dd/dnsdaddy-lab -server 127.0.0.1:15363 -scenario high-entropy-subdomains -speed 10 -quiet
          sleep 45

          findings=/tmp/dd/labdata/findings.jsonl
          [ -s "$findings" ] || { echo "no findings were written at all"; exit 1; }
          cat "$findings" | jq -r '"\(.severity)\t\(.eventType)\t\(.client.ip)"'

          echo "--- the tunnelling client must be detected ---"
          jq -e -s '[.[] | select(.eventType == "dns_tunnel_suspected" and .client.ip == "127.0.0.3")] | length > 0' \
            "$findings" > /dev/null \
            || { echo "the tunnel was not detected"; exit 1; }

          echo "--- ordinary browsing must produce nothing ---"
          jq -e -s '[.[] | select(.client.ip == "127.0.0.2")] | length == 0' "$findings" > /dev/null \
            || { echo "normal browsing produced a finding"; exit 1; }

          echo "--- high entropy alone must produce nothing ---"
          # This is the multi-signal gate. Genuinely random labels, and the
          # detector must stay silent because nothing else about the traffic
          # looks like a channel. If this ever fails, the concrete answer to
          # "high entropy means malicious" has stopped being true.
          jq -e -s '[.[] | select(.client.ip == "127.0.0.4" and .eventType == "dns_tunnel_suspected")] | length == 0' \
            "$findings" > /dev/null \
            || { echo "high entropy alone raised a tunnelling finding"; exit 1; }

          echo "--- every finding must be a complete, parseable document ---"
          jq -e -s 'all(.[]; .schemaVersion != null and .signals != null and .maturity != null)' \
            "$findings" > /dev/null \
            || { echo "a finding is missing required fields"; exit 1; }

          echo "detection assertions passed"

      - name: An open resolver configuration must refuse to start
        run: |
          cat > /tmp/dd/open.yaml <<EOF
          data_dir: /tmp/dd/open-data
          dns:
            listen_udp: "0.0.0.0:15453"
            listen_tcp: "0.0.0.0:15453"
            upstreams: ["udp://1.1.1.1:53"]
            allowed_client_cidrs: []
          http:
            listen: "127.0.0.1:18081"
            admin_password: "ci-test-password-longer-than-twelve"
          EOF
          if ./dnsdaddy -config /tmp/dd/open.yaml; then
            echo "an open-resolver configuration started successfully"
            exit 1
          fi
          echo "open-resolver configuration correctly refused to start"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t dnsdaddy:ci .
      - name: The binary must start and report a version
        run: docker run --rm dnsdaddy:ci -version

      # The runtime stage is deliberately last in the Dockerfile so that a
      # plain `docker build .` produces the resolver. Assert that, because
      # reordering the stages would silently change what everyone ships.
      - name: The default build target must be the resolver, not the lab
        run: |
          entrypoint=$(docker inspect -f '{{json .Config.Entrypoint}}' dnsdaddy:ci)
          echo "$entrypoint"
          echo "$entrypoint" | grep -q '/usr/local/bin/dnsdaddy"' \
            || { echo "default image entrypoint is not the resolver"; exit 1; }

      - name: The lab image must build and list its scenarios
        run: |
          docker build --target lab -t dnsdaddy-lab:ci .
          docker run --rm dnsdaddy-lab:ci | tee /tmp/scenarios.txt
          grep -q 'dns-tunnelling' /tmp/scenarios.txt
          grep -q 'normal-dns' /tmp/scenarios.txt
