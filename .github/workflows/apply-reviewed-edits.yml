# Temporary branch-only transfer helper. Removed before the final review PR.
# This job parses hash-checked data and never runs changed project code.
name: Apply reviewed privacy edits
on:
  push:
    branches: [fix/privacy-review-followup-20261003]
    paths: ['.review-transfer/**', '.github/workflows/apply-reviewed-edits.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jameshoulder/dnsdaddy' && github.ref == 'refs/heads/fix/privacy-review-followup-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and apply exact reviewed source bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd().resolve()
          planned = {}
          for number in range(1, 6):
              source = pathlib.Path(f'.review-transfer/edits-{number}.txt')
              lines = source.read_text(encoding='utf-8').splitlines(keepends=True)
              i = 0
              while i < len(lines):
                  assert lines[i].startswith('FILE '), (number, i)
                  meta = json.loads(lines[i][5:]); i += 1
                  path = pathlib.Path(meta['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in {'.git', '.github', '.review-transfer'}
                  assert path.as_posix() not in planned
                  assert not path.is_symlink() and path.resolve().is_relative_to(root)
                  old = path.read_bytes() if path.exists() else b''
                  assert hashlib.sha256(old).hexdigest() == meta['before'], ('base differs', str(path))
                  original = old.decode('utf-8').splitlines(keepends=True)
                  edits = []
                  while lines[i] != 'END\n':
                      verb, a, b, n = lines[i].split(); i += 1
                      a, b, n = int(a), int(b), int(n)
                      assert verb == 'REPLACE' and 0 <= a <= b <= len(original) and 0 <= n <= 10000
                      text = ''.join(lines[i:i+n]); i += n
                      assert len(text.splitlines(keepends=True)) == n
                      edits.append((a,b,text))
                  i += 1
                  for a,b,text in reversed(edits):
                      original[a:b] = text.splitlines(keepends=True)
                  content = ''.join(original)
                  # Correct a transfer-only qualification typo, then require the
                  # exact originally reviewed file hash; no source ambiguity.
                  if str(path) == 'internal/api/metrics_retention_test.go':
                      content = content.replace('func (f fixedRetention) RetentionSnapshot() api.RetentionSnapshot', 'func (f fixedRetention) RetentionSnapshot() RetentionSnapshot')
                  result = content.encode('utf-8')
                  assert hashlib.sha256(result).hexdigest() == meta['after'], ('reviewed output differs', str(path))
                  mode = int(meta['mode'], 8)
                  assert mode in (0o644, 0o755)
                  planned[path.as_posix()] = (result, mode)
          assert len(planned) == 43, len(planned)
          for name,(content,mode) in planned.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content); path.chmod(mode)
          shutil.rmtree('.review-transfer')
          subprocess.run(['git','add','-A'], check=True)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          env = dict(os.environ, GIT_INDEX_FILE=os.path.join(os.environ['RUNNER_TEMP'],'verified-clean-index'))
          subprocess.run(['git','read-tree',tree], env=env, check=True)
          subprocess.run(['git','update-index','--force-remove','.github/workflows/apply-reviewed-edits.yml'], env=env, check=True)
          clean = subprocess.check_output(['git','write-tree'], env=env, text=True).strip()
          assert clean == 'bd04638f788ed62a7e6f83cfae95827239011066', ('clean tree differs', clean)
          print('Verified 43 source files and exact clean tree:', clean)
          PY
      - name: Commit to the requested work branch only
        run: |
          git config user.name 'DNS Daddy maintenance bot'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'Integrate supplied Claude privacy patches and address follow-up concerns' -m 'AI-assisted: explicit health authentication and doctor migration, independent retention deadlines and historic-data warnings, verified fail-closed installer permissions, exact feed disclosure, and regression/rule tests. No production deployment or independent human approval.' -m 'Original four-patch contribution: Claude (for James Houlder), supplied by the maintainer.'
          git push origin HEAD:refs/heads/fix/privacy-review-followup-20261003
