          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: Signing secret removed and delivery disabled
      operationId: deleteIntegrationsWebhookSecret
  /api/v1/dnssec/mode:
    put:
      tags:
      - Detections
      summary: Select Forward, Learn or Live at runtime
      description: Persist and apply the local DNSSEC mode without restarting or changing the selected transport.
        A YAML/environment-pinned mode returns 409. Fresh installations default to Forward (off);
        existing saved and configured selections are preserved. Forward uses the selected upstreams
        with no Daddybound validation or anchor work. Live validates the exact returned records and fails with SERVFAIL
        on failed/indeterminate validation or operational failure, without a weaker fallback. A client CD flag
        bypasses DNSSEC checking only. Enabling Learn or Live while native transport is selected requires
        acknowledgeNativeTransport:true. An already-approved encrypted selection needs no native acknowledgement.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    $ref: '#/components/schemas/DNSSECModeStatus'
                required:
                - mode
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid mode or missing native transport acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Mode is locked by explicit YAML/environment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Runtime transition or persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Native mode controller unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - 'off'
                  - observe
                  - enforce
                acknowledgeNativeTransport:
                  type: boolean
                  description: 'Required true when enabling observe or enforce: these modes send plaintext
                    native UDP/TCP port 53 traffic.'
              required:
              - mode
              additionalProperties: false
      operationId: putDnssecMode
  /api/v1/protection:
    get:
      tags:
      - Administration
      summary: Read effective resolver protections
      description: Read or replace rate limiting and rebinding protection. Defaults enable a 50 QPS/100
        burst per-client token bucket with 4096 tracked clients and a bounded shared overflow bucket,
        plus IPv4/IPv6 and alias-aware rebinding checks. Client attribution uses the verified client address
        and network context. Explicit domain/CIDR exceptions support legitimate internal DNS. Updates
        are durable and take effect without restart.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionStatus'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Protection controller unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getProtection
    put:
      tags:
      - Administration
      summary: Save versioned resolver protections
      description: Read or replace rate limiting and rebinding protection. Defaults enable a 50 QPS/100
        burst per-client token bucket with 4096 tracked clients and a bounded shared overflow bucket,
        plus IPv4/IPv6 and alias-aware rebinding checks. Client attribution uses the verified client address
        and network context. Explicit domain/CIDR exceptions support legitimate internal DNS. Updates
        are durable and take effect without restart. Send the full configuration and current version from
        GET; a stale version returns 409.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionStatus'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid bounds or exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Configuration revision changed; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Protection controller unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectionConfig'
      operationId: putProtection
  /api/v1/learning/status:
    get:
      tags:
      - Detections
      summary: Read fitted local learning status and limitations
      description: Experimental local fitted traffic baseline. This component never blocks DNS. Off, unavailable
        and still-warming are different states; when unavailable, zero counters are not measurements.
        GET does not train or contact external services.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningStatus'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getLearningStatus
  /api/v1/learning/clients:
    get:
      tags:
      - Detections
      summary: Inspect retained local client baselines
      description: Read bounded aggregate models without training or contacting providers. Subject IDs
        are an IP address, network:<id>, or unattributed; IPv4-mapped addresses are normalized. limit
        is applied to list requests only. Models may be evicted and partial windows are discarded at restart.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningClientsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
