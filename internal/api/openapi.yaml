openapi: 3.1.0
info:
  title: DNS Daddy management API
  version: '1.0'
  description: "The management API for a DNS Daddy protective DNS resolver.\n\nEvery self-hosted resolver\
    \ serves this specification from `/openapi.yaml`,\nso a control plane can be generated against the\
    \ exact build it is talking\nto rather than against documentation that may have drifted.\n\n## Authentication\n\
    \nAll `/api/v1/*` endpoints except `health`, `auth/login`, `auth/logout`, and\n`auth/session` require\
    \ one of:\n\n* `Authorization: Bearer dnsd_…` — an API token, for machine access.\n* A `dnsdaddy_session`\
    \ cookie, issued by `POST /api/v1/auth/login`.\n\nCreate API tokens from Settings in the dashboard,\
    \ or via `POST /api/v1/tokens`.\nA token's secret is returned exactly once, at creation.\n\n## Cross-origin\
    \ requests\n\nA request authenticated by **session cookie** that uses a method other than\n`GET`,\
    \ `HEAD`, or `OPTIONS` must carry a same-origin `Origin` or `Referer`\nheader, or it is rejected with\
    \ `403`. This is CSRF protection: the session\ncookie is `SameSite=Lax`, which does not cover every\
    \ cross-site case.\n\nRequests authenticated by **bearer token** are exempt — a browser never\nattaches\
    \ an `Authorization` header cross-site, so CSRF does not apply.\nProgrammatic clients should use an\
    \ API token and can ignore this entirely.\n\n## Resolver endpoints (not part of this API)\n\n* `POST|GET\
    \ /dns-query/{networkToken}` — DoH scoped to a network's policy.\n  The path token is the credential.\n\
    * `POST|GET /dns-query` — RFC 8484 DNS-over-HTTPS with no client\n  authentication. Returns `403`\
    \ unless the operator has set\n  `http.allow_untokenized_doh`, because on an internet-facing deployment\n\
    \  this path would otherwise be an open DoH resolver.\n\nBoth take and return `application/dns-message`.\
    \ An unrecognised network\ntoken is a `404`, never a silent fall back to IP-based attribution.\n\n\
    ## External sharing and live settings\n\nExternal APIs and webhooks are user-configured and disabled\
    \ by default. Read-only status, investigation and policy preview endpoints do not contact providers.\
    \ Explicit tests and investigation enrichment require consent:true. Saved sharing settings take effect\
    \ without restarting. Daddybound transport is selected independently of Forward/Learn/Live. Native iteration uses UDP/TCP\
    \ port 53; encrypted forwarding uses approved DoQ, HTTP/3 or HTTP/2 endpoints with local Live validation.\n"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /
  description: The resolver serving this document
security:
- bearerAuth: []
- sessionCookie: []
tags:
- name: Status
- name: Metrics
- name: Networks
- name: Policies
- name: Feeds
- name: Reports
- name: Detections
- name: Administration
- name: Integrations
- name: Investigations
- name: Decisions
paths:
  /api/v1/server-addresses:
    get:
      operationId: getServerAddresses
      tags:
      - Administration
      summary: Local process IPs and an optional configured client-facing DNS endpoint
      description: Authenticated read-only enumeration of up network interfaces visible to this process. No
        external IP-discovery request, hostname lookup or reachability probe occurs. Request Host, Forwarded
        and X-Forwarded-* headers are not address sources. Address lists are read for at most 256 up interfaces
        and at most 128 addresses per interface are retained for candidate processing; at most 32 usable entries
        are returned in deterministic order. Private LAN addresses with compatible listeners are preferred,
        followed by private/shared overlays and public addresses. Loopback and link-local addresses are never
        preferred. Container/NAT/public host addresses and externally mapped ports cannot be inferred. Listener
        entries describe configuration, not verified socket state or remote reachability. This information
        is not added to public health, login or session responses. If interface enumeration is unavailable,
        the server may return only the literal IP from the accepted connection's http.LocalAddrContextKey with
        source connection_local_address, partial true and unknown empty interface name. The peer/client address
        and HTTP headers are never a fallback source. An absent or unusable local socket address returns 503
        unless a display-only dns.advertised_endpoint was configured, in which case source is configuration_only.
        runtime reports host or container using explicit runtime markers. advertised is optional operator configuration,
        never an automatically discovered public IP, reachability result, listener change or access grant.
      responses:
        '200':
          description: Local interface or accepted local socket evidence with explicit limitations
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerAddressesResponse'
        '401':
          description: Authentication required
        '503':
          description: Local interface enumeration failed and no usable accepted local socket address was available
  /api/v1/dns/transport:
    get:
      operationId: getDnsTransport
      tags:
      - Administration
      summary: Effective outbound DNS transport and bounded operational counters
      description: Read-only. Does not probe endpoints, resolve names, refresh anchors or change settings.
        Endpoint details require management authentication.
      responses:
        '200':
          description: Effective transport selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSTransportState'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Administration
      operationId: putDnsTransport
      summary: Select native or authenticated encrypted DNS transport
      description: Configuration is validated and persisted before publication. Retired native and forwarding
        paths are cancelled/drained before success returns. TLS 1.3 certificate authentication, literal-IP
        bootstrap and encrypted-only failover are mandatory for the encrypted profile. Own endpoints and forwarding
        disclosure acknowledgement are required. This preserves the current Forward/Learn/Live mode and keeps local
        policy/learning independent. YAML/env-pinned selections cannot be overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSTransportSelection'
      responses:
        '200':
          description: Selected transport, after retiring the previous path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSTransportState'
        '400':
          description: Invalid input or missing disclosure acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Same-origin protection rejected this cookie-authenticated write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Selection is pinned by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Activation failed; inspect error and configuration history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Runtime control unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/dns/transport/test:
    post:
      operationId: postDnsTransportTest
      tags:
      - Administration
      summary: Explicitly test approved encrypted endpoints without saving
      description: Sends a fixed root DNSKEY question through the supplied ordered endpoint list. It never
        probes plaintext DNS or chooses a provider. Global API admission permits one test at a time; the test
        is bounded to eight seconds, with two-second exchange budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSTransportTestRequest'
      responses:
        '200':
          description: Transport test outcome, including failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSTransportTestResult'
        '400':
          description: Invalid input or missing disclosure acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Same-origin protection rejected this cookie-authenticated write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Another bounded endpoint test is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/health:
    get:
      tags:
      - Status
      summary: Liveness
      security: []
      description: 'Answers in two tiers.


        **Every caller** gets `{"status":"ok"}` and nothing else. In the HTTPS

        deployment this is the one management path the reverse proxy publishes

        to the internet, so it describes neither the configuration nor the

        protection state of this instance.


        **An entitled caller** additionally gets `version`, `uptimeSeconds`,

        `blocklistSize`, `protecting` and `clientAclStale`. Two things count as

        entitled: an authenticated request (session cookie or bearer token),

        and a request whose peer address is loopback — which is how

        `dnsdaddy doctor` and the container''s own health check read the live

        index without a credential.


        The loopback tier is decided from the address that opened the socket

        and never from a forwarding header, so `X-Forwarded-For: 127.0.0.1`

        does not reach it. Behind a reverse proxy the peer is the proxy, not

        loopback.

        '
      responses:
        '200':
          description: Resolver status
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    description: 'The process is up and serving. Not a protection verdict —

                      see `protecting`, which requires entitlement.

                      '
                  version:
                    type: string
                    description: Entitled callers only.
                  uptimeSeconds:
                    type: integer
                    format: int64
                    description: Entitled callers only.
                  blocklistSize:
                    type: integer
                    description: Entitled callers only.
                  protecting:
                    type: boolean
                    description: 'Whether the threat index has anything in it. False means

                      the resolver answers but filters nothing. Entitled

                      callers only.

                      '
                  clientAclStale:
                    type: boolean
                    description: 'The resolver could not re-read its configuration after a

                      change, so the client access it is enforcing could not be

                      confirmed to match what is stored. It reveals nothing

                      about what the ACL contains. Entitled callers only.

                      '
      operationId: getHealth
  /api/v1/auth/login:
    post:
      tags:
      - Administration
      summary: Exchange the admin password for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: Signed in; a `dnsdaddy_session` cookie is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many failed attempts from this address
      operationId: postAuthLogin
  /api/v1/auth/logout:
    post:
      tags:
      - Administration
      summary: Clear the session cookie
      security: []
      responses:
        '200':
          description: Signed out
      operationId: postAuthLogout
  /api/v1/auth/session:
    get:
      tags:
      - Administration
      summary: Report whether the caller is authenticated
      security: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  principal:
                    type: string
      operationId: getAuthSession
  /api/v1/auth/password:
    post:
      tags:
      - Administration
      summary: Change the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  writeOnly: true
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  writeOnly: true
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: postAuthPassword
  /api/v1/overview:
    get:
      tags:
      - Status
      summary: Dashboard headline figures
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
      operationId: getOverview
  /api/v1/diagnostics:
    get:
      tags:
      - Status
      summary: Why DNS is not working
      description: 'Checks the resolver''s configuration against its live counters and reports, in plain
        English, anything that would stop clients resolving. Chiefly: whether the networks configured
        here are actually permitted to send queries by its resolver-access permission and dns.allowed_client_cidrs,
        which are independent settings that look like one. `dnsdaddy doctor` renders the same checks at
        the command line.

        '
      responses:
        '200':
          description: Every check, worst status first in the `status` field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
      operationId: getDiagnostics
  /api/v1/activity/live:
    get:
      tags:
      - Metrics
      summary: Immediate anonymous DNS traffic
      description: >-
        Reads bounded in-memory DNS handler counters without query-history reads
        or DNS probes. Normal session/token authentication still uses the store.
        Includes malformed, ACL-refused and rate-limited messages reaching the
        handler that never enter the query log; wire parsing and DoH authentication
        rejections before the handler are outside this measurement. Counters work with logging
        disabled and contain no query names or client addresses. Process totals
        reset on restart; startedAt identifies the current counter lifetime.
        The recent window contains the current second and previous 59 seconds.
        Completed means the handler produced a response, not that a remote client
        received it. Status describes observed traffic, not listener readiness or
        an external connectivity test. Responses use Cache-Control: no-store.
      responses:
        '200':
          description: Current handler activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveActivity'
        '503':
          description: This process has no DNS handler to measure
      operationId: getLiveActivity
  /api/v1/activity/queries:
    get:
      tags:
      - Metrics
      summary: Hourly query and block counts
      parameters:
      - name: hours
        in: query
        schema:
          type: integer
          default: 24
          minimum: 1
          maximum: 720
      responses:
        '200':
          description: Hourly buckets, including hours with no traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityBucket'
      operationId: getActivityQueries
  /api/v1/threats/categories:
    get:
      tags:
      - Metrics
      summary: Blocked counts grouped by category
      parameters:
      - name: hours
        in: query
        schema:
          type: integer
          default: 24
      responses:
        '200':
          description: Category breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryCount'
      operationId: getThreatsCategories
  /api/v1/threats/top-domains:
    get:
      tags:
      - Metrics
      summary: Most frequently blocked domains
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 200
      responses:
        '200':
          description: Ranked domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopBlockedDomain'
      operationId: getThreatsTopDomains
  /api/v1/queries:
    get:
      tags:
      - Metrics
      summary: Query log, newest first
      description: 'Cursor-paginated. Pass the returned `nextCursor` to fetch the next page;

        a `nextCursor` of `0` means the result set is exhausted.



        For repeatable continuation use identical absolute since/until bounds. Invalid cursors return
        400 instead of restarting. Export cursors are separate.'
      parameters:
      - name: networkId
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
          enum:
          - allowed
          - blocked
          - error
      - name: category
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
        description: Substring match
      - name: exactDomain
        in: query
        schema:
          type: string
        description: Exact normalised domain; intended for investigation continuation.
      - name: clientIp
        in: query
        schema:
          type: string
        description: Client IP; IPv4-mapped forms normalise to IPv4.
      - name: client
        in: query
        schema:
          type: string
        description: Alias for clientIp; conflicting aliases are rejected.
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 8760
        description: 0 means all retained data; use hours or since, not both.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 lower bound, at stored millisecond precision; replaces the default
          hours.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 upper bound; exports default to capture time.
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Query-log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueryEvent'
                  nextCursor:
                    type: integer
                    format: int64
                  count:
                    type: integer
                  limit:
                    type: integer
        '400':
          description: Invalid cursor, address or time window.
      operationId: getQueries
  /api/v1/categories:
    get:
      tags:
      - Policies
      summary: Available filtering categories and how many domains each holds
      responses:
        '200':
          description: Category catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
      operationId: getCategories
  /api/v1/resolvers:
    get:
      tags:
      - Status
      summary: Connection details and upstream health
      responses:
        '200':
          description: Resolver endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverInfo'
      operationId: getResolvers
  /api/v1/settings:
    get:
      tags:
      - Administration
      summary: Effective runtime configuration
      description: Read process configuration and runtime counters. YAML/environment controls the fields
        shown here; dedicated authenticated routes manage live API sharing, native mode (unless explicitly
        pinned), resolver protections and webhook settings.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
      operationId: getSettings
  /api/v1/networks:
    get:
      tags:
      - Networks
      summary: List networks with 24-hour activity
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkWithActivity'
                  clientAccess:
                    $ref: '#/components/schemas/ClientAccess'
      operationId: getNetworks
    post:
      tags:
      - Networks
      summary: Create a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/PublicAckRequired'
      operationId: postNetworks
  /api/v1/networks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Networks
      summary: Get a network
      responses:
        '200':
          description: Network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getNetworksById
    patch:
      tags:
      - Networks
      summary: Update a network
      description: Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublicAckRequired'
      operationId: patchNetworksById
    delete:
      tags:
      - Networks
      summary: Delete a network
      description: The last remaining network cannot be deleted, and neither can the built-in Default
        network (`n_default`) — it is the policy applied to every unmatched client and the ad-hoc resolver
        access switch at once, and nothing recreates it.
      responses:
        '204':
          description: 'Deleted, and the effective client ACL was republished from what remains. That
            does not necessarily mean the network''s addresses are now refused: the ACL is a union with
            no deny rules, so a range the bootstrap list or another permitted network also covers goes
            on being served. `GET /api/v1/networks` reports what is actually admitted.'
        '200':
          description: Deleted, but the resolver could not re-read its configuration, so whether the network's
            addresses are still being served could not be confirmed. The condition is also reported by
            `GET /api/v1/diagnostics`, by `GET /api/v1/health` as `clientAclStale`, and by `dnsdaddy doctor`
            (which reads it from health, since the state lives in the running daemon's memory) — until
            a reload succeeds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - deleted
                  warning:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Refused permanently: this is the last remaining network, or the built-in Default
            network. The request is well-formed and resending it will not succeed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: deleteNetworksById
  /api/v1/networks/{id}/rotate-token:
    post:
      tags:
      - Networks
      summary: Issue a new DoH token, invalidating the old one
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Network with its new token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
      operationId: postNetworksByIdRotateToken
  /api/v1/policies:
    get:
      tags:
      - Policies
      summary: List policies
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Policy'
      operationId: getPolicies
    post:
      tags:
      - Policies
      summary: Create a policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
      operationId: postPolicies
  /api/v1/policies/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Policies
      summary: Get a policy
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getPoliciesById
    patch:
      tags:
      - Policies
      summary: Update a policy
      description: 'Omitted fields are left unchanged. Supplying `allowDomains` or

        `blockDomains` replaces that list wholesale; use the rules endpoints to

        add or remove a single entry.


        A successful update purges the answer cache so the change takes effect

        on the next query rather than after the current TTL.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
      operationId: patchPoliciesById
    delete:
      tags:
      - Policies
      summary: Delete a policy
      description: The default policy, and any policy still assigned to a network, cannot be deleted.
      responses:
        '204':
          description: Deleted
        '400':
