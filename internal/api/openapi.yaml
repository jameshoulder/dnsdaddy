      operationId: putIntegrationsSettings
  /api/v1/integrations/webhook:
    get:
      tags:
      - Integrations
      summary: Read webhook configuration and durable delivery counters
      description: Optional, disabled-by-default delivery to a user-owned receiver. New finding/review
        events are captured atomically in a bounded SQLite outbox; no historical backlog is sent when
        enabled. One asynchronous worker signs the exact JSON body using HMAC-SHA256 over timestamp +
        "." + body. Headers are X-DNSDaddy-Event-ID, X-DNSDaddy-Timestamp (Unix seconds), and X-DNSDaddy-Signature
        (sha256=<hex>). Receivers should verify the signature and timestamp and deduplicate the stable
        event ID. Delivery is at least once and uses bounded retries/backoff for network errors, 408/425/429
        and 5xx. Verified TLS, no redirects, no environment proxy and per-connection address checks apply.
        Settings changes cancel work where possible and drop the old queue; data already sent cannot be
        recalled.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSettings'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Configuration or counters could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Webhook runtime unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIntegrationsWebhook
    put:
      tags:
      - Integrations
      summary: Save optional signed webhook delivery
      description: Optional, disabled-by-default delivery to a user-owned receiver. New finding/review
        events are captured atomically in a bounded SQLite outbox; no historical backlog is sent when
        enabled. One asynchronous worker signs the exact JSON body using HMAC-SHA256 over timestamp +
        "." + body. Headers are X-DNSDaddy-Event-ID, X-DNSDaddy-Timestamp (Unix seconds), and X-DNSDaddy-Signature
        (sha256=<hex>). Receivers should verify the signature and timestamp and deduplicate the stable
        event ID. Delivery is at least once and uses bounded retries/backoff for network errors, 408/425/429
        and 5xx. Verified TLS, no redirects, no environment proxy and per-connection address checks apply.
        Settings changes cancel work where possible and drop the old queue; data already sent cannot be
        recalled.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSettings'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid settings, signing secret or missing consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Configuration changed or could not be saved; reload before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Configuration could not be read or secret encryption failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Webhook runtime or credential encryption unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSettingsInput'
      operationId: putIntegrationsWebhook
  /api/v1/integrations/webhook/test:
    post:
      tags:
      - Integrations
      summary: Send a consented synthetic webhook test
      description: Use the saved endpoint and signing secret to send a signed webhook.test event with
        synthetic:true. Works while real delivery is disabled. No DNS, client or finding data is included.
        HTTP 200 contains ok:false on delivery failure. Tests do not change durable event counters.
      responses:
