  /api/v1/feeds/refresh:
    post:
      tags:
      - Feeds
      summary: Download every enabled feed and rebuild the index
      description: 'Returns immediately; the refresh runs in the background. Poll

        `GET /api/v1/feeds` and watch `refreshing` to know when it has finished.

        '
      responses:
        '202':
          description: Refresh started
        '409':
          description: A refresh is already running
      operationId: postFeedsRefresh
  /api/v1/feeds/{id}/refresh:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Feeds
      summary: Download one feed and rebuild the index
      description: 'The same download, validation, caching and index-rebuild path as a full

        refresh, scoped to a single feed, so switching a feed on can be verified

        in seconds rather than after a full refresh of every source.


        Returns immediately; the refresh runs in the background. Poll

        `GET /api/v1/feeds` and watch `refreshing` to know when it has finished,

        then read `lastStatus`, `lastError` and `lastSuccessAt` on the row.

        '
      responses:
        '202':
          description: Refresh started
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The feed is disabled, or a refresh is already running
        '410':
          description: The legacy built-in Threat Observatory connector is retired and cannot be enabled
            or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postFeedsByIdRefresh
  /api/v1/integrations/providers:
    get:
      tags:
      - Integrations
      summary: List external intelligence providers
      description: Read saved providers, current engine counters and sharing settings. No outbound request
        occurs. Credentials stay encrypted; only secretSet and a four-character identification hint are
        returned.
      responses:
        '200':
          description: Providers, engine counters, and the reputation mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIProvider'
                  engine:
                    $ref: '#/components/schemas/IntelEngineStats'
                  reputation:
                    $ref: '#/components/schemas/ReputationSetting'
                  settings:
                    $ref: '#/components/schemas/IntegrationSettings'
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIntegrationsProviders
    post:
      tags:
      - Integrations
      summary: Add an external intelligence provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIProviderInput'
      responses:
        '201':
          description: The provider, without its credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIProvider'
        '400':
          description: No adapter for this kind in this build, or invalid input
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The bounded 64-provider limit has been reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Provider or credential persistence failed; a credential failure leaves an inert
            saved draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Save an inert draft without outbound requests. Creating enabled:true requires consent:true.
        At most 64 provider rows can be managed.
      operationId: postIntegrationsProviders
  /api/v1/integrations/providers/test:
    post:
      tags:
      - Integrations
      summary: Test a provider that has not been saved
      description: Explicitly consent to one live request using an unsaved configuration and credential.
        May disclose example.com or use the adapter health request. The candidate and credential are not
        persisted; production HTTPS and resolved-address guards apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - consent
              properties:
                kind:
                  type: string
                  example: virustotal
                  enum:
                  - virustotal
                  - safebrowsing
                  - customhttp
                config:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 4096
                  description: Template-declared, nonsecret settings stored unencrypted. Production endpoints
                    use verified HTTPS, refuse redirects and environment proxies, and check resolved connection
                    addresses. customhttp allow_private=true explicitly permits RFC1918/ULA destinations;
                    loopback, link-local, metadata and special-use destinations stay blocked.
                secret:
                  type: string
                  writeOnly: true
                  description: Write-only credential, at most 16384 UTF-8 bytes and no CR/LF/NUL. Encrypted
                    with AES-256-GCM before storage.
                  maxLength: 16384
                timeoutMs:
                  type: integer
                  minimum: 0
                  maximum: 15000
                  description: Milliseconds; 0 selects the default.
                ratePerMinute:
                  type: integer
                  minimum: 0
                  maximum: 6000
                  description: Per-provider request budget; 0 selects the default.
                consent:
                  type: boolean
                  description: Explicit acknowledgement of the domain or event data sent to the user-configured
                    external service.
                  const: true
              additionalProperties: false
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResult'
        '400':
          description: Invalid adapter/configuration or missing explicit consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postIntegrationsProvidersTest
  /api/v1/integrations/providers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Integrations
      summary: Read one provider
      responses:
        '200':
          description: The provider, without its credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIProvider'
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIntegrationsProvidersById
    patch:
      tags:
      - Integrations
      summary: Change a provider
      description: Partial update. kind and secret are refused; rotate via the secret route. Enabling,
        or changing configuration, capabilities or scope while enabled, requires consent:true. A pure
        disable remains possible even for an invalid legacy configuration. Cached verdicts are invalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIProviderPatch'
      responses:
        '200':
          description: The updated provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIProvider'
        '400':
          description: Invalid configuration, missing sharing consent, or a forbidden kind/secret field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchIntegrationsProvidersById
    delete:
      tags:
      - Integrations
      summary: Remove a provider
      description: Deletes the provider, its sealed credential, and its cached verdicts.
      responses:
        '204':
          description: Removed
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: deleteIntegrationsProvidersById
  /api/v1/integrations/providers/{id}/secret:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Integrations
      summary: Set or rotate a provider's credential
      description: 'The credential is encrypted with AES-256-GCM, bound to this provider''s

        ID as additional authenticated data, and written to a table this API

        cannot read back. There is no endpoint anywhere that returns it.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  writeOnly: true
                  description: Nonempty write-only credential, at most 16384 UTF-8 bytes; no CR/LF/NUL.
                  minLength: 1
                  maxLength: 16384
              additionalProperties: false
      responses:
        '200':
          description: The provider, with secretSet and the new hint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIProvider'
        '400':
          description: An empty secret; use DELETE to remove one
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postIntegrationsProvidersByIdSecret
    delete:
      tags:
      - Integrations
      summary: Remove a provider's credential
      description: Disable the provider immediately, remove its encrypted credential and invalidate cached
        verdicts. Its nonsecret configuration remains available as a disabled draft.
      responses:
        '204':
          description: Removed
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: deleteIntegrationsProvidersByIdSecret
  /api/v1/integrations/providers/{id}/test:
    post:
      tags:
      - Integrations
      summary: Test a saved provider
      description: Explicitly consent to one live test using the stored credential, even while disabled.
        It may disclose example.com or use the adapter health request. Does not warm the reputation cache.
        Saves a timestamped outcome tied to the configuration and credential-rotation fingerprint; changing
        either invalidates lastTest.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResult'
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: A JSON body with consent:true is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Provider configuration could not be loaded, or the completed test result could
            not be saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalRequestConsent'
      operationId: postIntegrationsProvidersByIdTest
  /api/v1/integrations/providers/{id}/health:
    get:
      tags:
      - Integrations
      summary: A provider's live state
      description: 'Safe to poll: it reads counters the resilient client already keeps and

        makes no upstream request. A polled endpoint that called the provider

        would spend an operator''s quota for as long as a dashboard tab is open.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Status and counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  providerId:
                    type: string
                  status:
                    type: string
                    enum:
                    - ok
                    - disabled
                    - error
                  detail:
                    type: string
                  stats:
                    $ref: '#/components/schemas/ProviderStats'
        '404':
          description: No such provider
        '503':
          description: External API runtime unavailable; credential writes also require an available encryption
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIntegrationsProvidersByIdHealth
  /api/v1/integrations/templates:
    get:
      tags:
      - Integrations
      summary: The adapters this build offers
      description: Read the compiled-in adapter registry, form fields, privacy notice and verification
        evidence without contacting providers. Stock VirusTotal, Safe Browsing and custom HTTP adapters
        have fixture tests; their liveVerified flag is false until maintainers record live verification.
        An operator connection test is separate evidence for that saved configuration.
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderTemplate'
                  reputation:
                    $ref: '#/components/schemas/ReputationSetting'
      operationId: getIntegrationsTemplates
  /api/v1/integrations/reputation:
    put:
      tags:
      - Integrations
      summary: Change how much reach providers have over resolution
      description: Compatibility form of the reputation settings write. off disables DNS-path consultation.
        cache_only reads cached verdicts and may enqueue a background miss without waiting; blocking can
        wait within the configured DNS budget. Every non-off write requires consent:true; blocking also
        requires acceptDnsLatency:true. The choice is durable and takes effect without restart. Enrichment
        remains independent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - 'off'
                  - cache_only
                  - blocking
                consent:
                  type: boolean
                  description: Explicit acknowledgement of the domain or event data sent to the user-configured
                    external service.
                acceptDnsLatency:
                  type: boolean
                  description: Required true when setting blocking mode; synchronous reputation may delay
                    DNS within the configured budget.
              required:
              - mode
              additionalProperties: false
      responses:
        '200':
          description: The new mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationSetting'
        '400':
          description: Invalid mode or missing sharing/latency acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: External API runtime unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Settings could not be saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: putIntegrationsReputation
  /api/v1/decisions:
    get:
      tags:
      - Decisions
      summary: Recent enforcement decisions
      description: 'One record per enforced or alerted decision, newest first — not one per

        query. Each carries the policy path that produced it and the

        explanation that was written at the time.


        `recording` reports whether decision records are switched on at all, so

        a caller can tell "nothing has been blocked" from "nothing is being

        recorded". Those look identical in an empty list and mean opposite

        things.



        For repeatable continuation use identical absolute since/until bounds. Invalid cursors return
        400 instead of restarting. Export cursors are separate.'
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        description: Exact normalised domain
      - name: client
        in: query
        schema:
          type: string
        description: Client IP address
      - name: action
        in: query
        schema:
          type: string
          enum:
          - allowed
          - blocked
          - error
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 8760
        description: 0 means all retained data; use hours or since, not both.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 lower bound, at stored millisecond precision; replaces the default
          hours.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 upper bound; exports default to capture time.
      - name: cursor
        in: query
        schema:
          type: string
        description: Exclusive time/ID list cursor; empty starts at newest. Invalid values are rejected.
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Decisions, without their evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  recording:
                    type: boolean
                    description: Whether decision records are enabled on this deployment.
                  stats:
                    $ref: '#/components/schemas/DecisionRecorderStats'
                  count:
                    type: integer
                  limit:
                    type: integer
                  nextCursor:
                    type: string
                    description: Empty on the final page, including a full final page.
        '400':
          description: Invalid cursor, address or time window.
      operationId: getDecisions
  /api/v1/decisions/{id}:
    get:
      tags:
      - Decisions
      summary: One decision, with the evidence it cited
      description: The original decision and the evidence snapshot captured in its recording transaction.
        Feed refresh, deletion or evidence expiry cannot change captured evidence. Decisions predating
        snapshots explicitly return evidenceSource=legacy_current_reference with evidenceNote; surviving
        references may have changed or been removed. contributed identifies evidence that changed the
        original outcome.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The decision and its evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          description: No such decision
      operationId: getDecisionsById
  /api/v1/evidence/domain/{domain}:
    get:
      tags:
      - Decisions
      summary: What is known about a domain now
      description: 'Everything on file about a domain, the assessment it currently

        supports, and the recent decisions about it.


        Deliberately separate from the decision detail: a decision says what

        was true when it was made, and this says what is true now. Merging them

        would let the answer to "why was this blocked" drift as feeds refresh.


        Expired evidence is included, because "this was listed until Tuesday"

        is useful to an investigator — the assessment has already excluded it

        from the verdict.

        '
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Evidence and assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    $ref: '#/components/schemas/EvidenceSubject'
                  assessment:
                    $ref: '#/components/schemas/Assessment'
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evidence'
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
        '400':
          description: A domain is required
      operationId: getEvidenceDomainByDomain
  /api/v1/investigate/domain/{domain}:
    get:
      tags:
      - Investigation
      summary: Everything recorded about one name, in sections that stay apart
      description: 'A read-only investigation of one domain name: what the query log

        recorded, what was decided at the time, what the current

        configuration would decide now, what is on file about it, what the

        experimental detectors inferred, and what Daddybound concluded

        locally. The sections answer different questions and are never

        merged.


        Nothing here writes. No query-log row, decision record, cache entry

        or configuration changes as a result of this request, and no

        external provider is contacted: the policy preview runs on the same

        compiled snapshot and code path as a live query, minus the provider

        step, and reads only what the provider cache already holds.


        The name is normalised the way a browser would send it — IDNA

        lookup rules to A-labels, lower case, no trailing dot — and matched

        **exactly** against recorded names. `www.evil.example` and

        `evil.example` are different names; this is not a substring

        search and not a global domain index.

        '
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
        description: The name to investigate, Unicode or A-label form.
      - name: client
        in: query
        schema:
          type: string
        description: Optional client IP address. Narrows activity, decisions and findings to it and makes
          the preview use its attributed policy.
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 8760
        description: Retained-data window. Defaults to the query-log retention.
      responses:
        '200':
          description: The investigation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainInvestigation'
        '400':
          description: Not a valid domain name, or `client` is not an IP address
      operationId: getInvestigateDomainByDomain
  /api/v1/investigate/domain/{domain}/enrich:
    post:
      tags:
      - Investigation
      summary: Ask the configured external providers about a name, now
      description: Explicit consented provider action. Requires {"consent":true}; authenticated cookie
        requests also require the ordinary same-origin checks. Reputation follows its configured off/cache_only/blocking
        mode and budget. Independently enabled enrichment queues eligible providers within their policy
        scopes even when reputation is off. The actual queued enrichment count is returned. No GET can
        trigger this action.
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      - name: client
        in: query
        schema:
          type: string
        description: Optional client IP, to consult under its attributed policy.
      responses:
        '200':
          description: What was requested and what came back
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  policyId:
                    type: string
                  mode:
                    type: string
                    enum:
                    - 'off'
                    - cache_only
                    - blocking
                  lookup:
                    type: string
                    enum:
                    - not_performed
                    - answered
                    - queued
                    - no_answer
                  verdict:
                    type:
                    - object
                    - 'null'
                  note:
                    type: string
                  enrichmentQueued:
                    type: integer
                    minimum: 0
                  enrichmentEnabled:
                    type: boolean
        '503':
          description: External provider service unavailable.
        '400':
          description: Missing explicit consent or invalid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consent
              properties:
                consent:
                  type: boolean
                  const: true
                  description: Authorises sending this domain to the operator-configured providers.
      operationId: postInvestigateDomainByDomainEnrich
  /api/v1/investigate/client/{ip}:
    get:
      tags:
