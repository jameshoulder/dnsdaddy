              description: Queries that failed to resolve in the period. Zero for hours recorded before
                this build began counting them.
        blockRate:
          type: number
          format: double
        blocklistDomains:
          type: integer
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        topBlockedDomains:
          type: array
          items:
            $ref: '#/components/schemas/TopBlockedDomain'
        networks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              location:
                type: string
              policy:
                type: string
              queries:
                type: integer
                format: int64
              blocked:
                type: integer
                format: int64
        feeds:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              category:
                type: string
              domains:
                type: integer
              lastRefreshedAt:
                type:
                - string
                - 'null'
                format: date-time
    FindingReview:
      type: object
      description: An operator's disposition of a finding, kept beside the finding. An unreviewed finding
        is `new` at version 0.
      properties:
        findingId:
          type: string
        state:
          type: string
          enum:
          - new
          - acknowledged
          - resolved
          - false_positive
        note:
          type: string
        version:
          type: integer
          format: int64
        actor:
          type: string
          description: '`session:admin` or `token:<name>`. Never a secret.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FindingSummaryRow:
      type: object
      description: A finding as the REST API returns it. `detail` is the complete document.
      properties:
        id:
          type: string
        review:
          $ref: '#/components/schemas/FindingReview'
        time:
          type: string
          format: date-time
        eventType:
          type: string
          example: dns_tunnel_suspected
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        clientIp:
          type: string
        clientName:
          type: string
        networkId:
          type: string
        domain:
          type: string
        qtype:
          type: string
        detector:
          type: string
        title:
          type: string
        summary:
          type: string
        detail:
          $ref: '#/components/schemas/Finding'
    Finding:
      type: object
      description: 'The structured security finding. This is the integration contract: the

        same document appears here, in the NDJSON export, and in

        `detection.findings_file`.


        Within a major `schemaVersion`, fields may be added but never removed

        or repurposed.

        '
      properties:
        schemaVersion:
          type: string
          example: '1.0'
        id:
          type: string
        time:
          type: string
          format: date-time
        eventType:
          type: string
          enum:
          - dns_tunnel_suspected
          - dns_beaconing_suspected
          - nxdomain_burst
          - txt_activity_anomaly
          - dga_like_domains
          - resolution_failure_burst
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
        confidence:
          type: number
          format: double
          description: 'How strongly the evidence supports the conclusion, 0..1. Derived

            from the score and then damped by sample size — the same score over

            40 queries is less trustworthy than over 400.

            '
        score:
          type: number
          format: double
          description: Weighted signal total before sample-size damping.
        client:
          type: object
          properties:
            ip:
              type: string
            name:
              type: string
            networkId:
              type: string
        domain:
          type: string
        qtype:
          type: string
        title:
          type: string
        summary:
          type: string
          description: One sentence stating the conclusion and its basis.
        signals:
          type: array
          description: 'The measurements behind the score. Contributions sum to `score`, so

            the arithmetic can be checked by hand.

            '
          items:
            type: object
            properties:
              name:
                type: string
                example: unique_subdomains
              description:
                type: string
              value:
                type: number
                format: double
              floor:
                type: number
                format: double
                description: Value at which this signal starts contributing
              ceiling:
                type: number
                format: double
                description: Value at which it contributes fully
              normalised:
                type: number
                format: double
              weight:
                type: number
                format: double
              contribution:
                type: number
                format: double
        evidence:
          type: object
          additionalProperties: true
          description: Detector-specific measurements, e.g. unique_subdomains, average_entropy.
        window:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            queries:
              type: integer
        mitre:
          type: array
          description: 'ATT&CK mappings. Each carries a rationale; a technique attached

            without one would be decoration. `hypothesis: true` marks a mapping

            that describes what the behaviour *would* be if the finding is a

            true positive, rather than something the evidence establishes.

            '
          items:
            type: object
            properties:
              id:
                type: string
                example: T1071.004
              name:
                type: string
              tactic:
                type: string
              url:
                type: string
                format: uri
              rationale:
                type: string
              hypothesis:
                type: boolean
        falsePositives:
          type: array
          items:
            type: string
          description: Benign traffic known to produce this shape.
        nextSteps:
          type: array
          items:
            type: string
        detector:
          type: string
        maturity:
          type: string
          enum:
          - available
          - experimental
          description: '`experimental` means the logic is tested but its thresholds have

            not been validated against enough real-world traffic to promise a

            false-positive rate. Every detector is currently experimental.

            '
    APIProvider:
      properties:
        cacheTtlSeconds:
          type: integer
        capabilities:
          items:
            type: string
            enum:
            - reputation
            - enrichment
            - feed
          type:
          - array
          - 'null'
        config:
          additionalProperties:
            type: string
          type:
          - object
          - 'null'
          description: Template-declared, nonsecret settings stored unencrypted. Production endpoints
            use verified HTTPS, refuse redirects and environment proxies, and check resolved connection
            addresses. customhttp allow_private=true explicitly permits RFC1918/ULA destinations; loopback,
            link-local, metadata and special-use destinations stay blocked.
        createdAt:
          format: date-time
          type: string
        detail:
          type: string
        displayName:
          type: string
        docsUrl:
          type: string
        enabled:
          type: boolean
          description: Whether this provider may be used when the matching global mode/capability and
            policy scope permit it.
        id:
          type: string
        kind:
          type: string
          description: The compiled-in adapter selected at creation; immutable.
          enum:
          - virustotal
          - safebrowsing
          - customhttp
        lastTest:
          anyOf:
          - $ref: '#/components/schemas/ProviderLastTest'
          - type: 'null'
          description: Most recent saved connection test whose endpoint/configuration and credential fingerprint
            still match. Omitted after an endpoint or credential change. This demonstrates connectivity
            at that time, not detection accuracy.
        liveVerified:
          type: boolean
          description: Whether this adapter has maintainer-recorded live vendor verification. The shipped
            adapters remain fixture-tested; an operator test does not change this flag.
        name:
          type: string
        policyScope:
          items:
            type: string
          type:
          - array
          - 'null'
          description: Policy IDs under which this provider may run; an empty list permits all policies.
          maxItems: 64
        privacyNote:
          type: string
        ratePerMinute:
          type: integer
        rotatedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        secretHint:
          type: string
          description: Last four characters of a stored credential, or empty. This is identification metadata,
            not the credential.
        secretSet:
          type: boolean
          description: Whether an encrypted credential is stored; its plaintext is never returned.
        stats:
          anyOf:
          - $ref: '#/components/schemas/ProviderStats'
          - type: 'null'
        status:
          type: string
          enum:
          - ok
          - disabled
          - error
        timeoutMs:
          type: integer
        updatedAt:
          format: date-time
          type: string
        verification:
          type: string
      required:
      - id
      - name
      - kind
      - enabled
      - capabilities
      - config
      - timeoutMs
      - ratePerMinute
      - cacheTtlSeconds
      - policyScope
      - secretSet
      - secretHint
      - createdAt
      - updatedAt
      - status
      - liveVerified
      type: object
      description: A user-configured external intelligence provider with live operational state. Credentials
        are never returned. GET reads local state only. Adapter-wide fixture verification is separate
        from a lastTest performed against this saved configuration.
    APIProviderInput:
      type: object
      required:
      - name
      - kind
      properties:
        name:
          type: string
          example: VirusTotal
          minLength: 1
          maxLength: 128
          description: Nonblank display name; validated as at most 128 UTF-8 bytes.
        kind:
          type: string
          example: virustotal
          enum:
          - virustotal
          - safebrowsing
          - customhttp
        enabled:
          type: boolean
          default: false
          description: Enabling requires consent:true. A save with credentials enables only after encryption
            succeeds.
        capabilities:
          type: array
          items:
            type: string
            enum:
            - reputation
            - enrichment
            - feed
        config:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
          description: Template-declared, nonsecret settings stored unencrypted. Production endpoints
            use verified HTTPS, refuse redirects and environment proxies, and check resolved connection
            addresses. customhttp allow_private=true explicitly permits RFC1918/ULA destinations; loopback,
            link-local, metadata and special-use destinations stay blocked.
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 15000
          description: Milliseconds; 0 selects the default.
        ratePerMinute:
          type: integer
          minimum: 0
          maximum: 6000
          description: Per-provider request budget; 0 selects the default.
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: Seconds; 0 selects the default; maximum 30 days.
        policyScope:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 64
        secret:
          type: string
          writeOnly: true
          description: Write-only credential, at most 16384 UTF-8 bytes and no CR/LF/NUL. Encrypted with
            AES-256-GCM before storage.
          maxLength: 16384
        consent:
          type: boolean
          description: Explicit acknowledgement of the domain or event data sent to the user-configured
            external service.
      additionalProperties: false
      description: Save an inert draft without outbound requests. Creating enabled:true requires consent:true.
        At most 64 provider rows can be managed.
    APIProviderPatch:
      type: object
      properties:
        name:
          type: string
          example: VirusTotal
          minLength: 1
          maxLength: 128
          description: Nonblank display name; validated as at most 128 UTF-8 bytes.
        enabled:
          type: boolean
          description: Enabling requires consent:true. A save with credentials enables only after encryption
            succeeds.
        capabilities:
          type: array
          items:
            type: string
            enum:
            - reputation
            - enrichment
            - feed
        config:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
          description: Template-declared, nonsecret settings stored unencrypted. Production endpoints
            use verified HTTPS, refuse redirects and environment proxies, and check resolved connection
            addresses. customhttp allow_private=true explicitly permits RFC1918/ULA destinations; loopback,
            link-local, metadata and special-use destinations stay blocked.
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 15000
          description: Milliseconds; 0 selects the default.
        ratePerMinute:
          type: integer
          minimum: 0
          maximum: 6000
          description: Per-provider request budget; 0 selects the default.
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: Seconds; 0 selects the default; maximum 30 days.
        policyScope:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 64
        consent:
          type: boolean
          description: Explicit acknowledgement of the domain or event data sent to the user-configured
            external service.
      additionalProperties: false
      description: Partial update. kind and secret are refused; rotate via the secret route. Enabling,
        or changing configuration, capabilities or scope while enabled, requires consent:true. A pure
        disable remains possible even for an invalid legacy configuration. Cached verdicts are invalidated.
    ProviderStats:
      properties:
        breaker:
          type: string
          enum:
          - closed
          - open
          - half-open
        breakerTrips:
          minimum: 0
          type: integer
        calls:
          minimum: 0
          type: integer
        errorRate:
          format: double
          type: number
          description: Failed logical transport calls divided by calls. Circuit-denied work is counted
            separately in rejected.
          minimum: 0
          maximum: 1
        failures:
          minimum: 0
          type: integer
        lastCallAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastError:
          type: string
        meanLatencyMs:
          type: integer
        rateWaits:
          minimum: 0
          type: integer
        rejected:
          type: integer
          minimum: 0
          description: Requests denied by an open circuit before a transport attempt. Separate from failures
            and its calls denominator.
      required:
      - calls
      - failures
      - rejected
      - meanLatencyMs
      - errorRate
      - breaker
      - breakerTrips
      - rateWaits
      type: object
      description: Operational counters for the current resilient provider client instance, reset when
        instances are rebuilt; not a persisted delivery history.
    ProviderTestResult:
      type: object
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
        error:
          type: string
          description: Why the test failed. Never contains the credential.
        detail:
          type: string
        providerId:
          type: string
        testedAt:
          type: string
          format: date-time
      required:
      - ok
      - latencyMs
      - testedAt
      description: HTTP 200 contains the test outcome, including failures. ok:false includes provider/network
        errors and inconclusive rate limiting. No remote response body or credential is returned.
    ProviderTemplate:
      properties:
        capabilities:
          items:
            type: string
          type:
          - array
          - 'null'
        defaultCacheTtlSeconds:
          type: integer
        defaultRatePerMinute:
          type: integer
        defaultTimeoutMs:
          type: integer
        displayName:
          type: string
        docsUrl:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/ProviderTemplateField'
          type:
          - array
          - 'null'
        kind:
          type: string
        liveVerified:
          type: boolean
          description: Maintainer live-verification flag, independent of an operator test. False for the
            stock adapters in this build.
        privacyNote:
          type: string
        secretLabel:
          type: string
        secretRequired:
          type: boolean
        summary:
          type: string
        verification:
          type: string
      required:
      - kind
      - displayName
      - summary
      - privacyNote
      - capabilities
      - liveVerified
      - verification
      - secretLabel
      - secretRequired
      - fields
      - defaultTimeoutMs
      - defaultRatePerMinute
      - defaultCacheTtlSeconds
      type: object
      description: Compiled adapter form fields, capability limits and honest verification evidence. Read
        without contacting any provider.
    ReputationSetting:
      type: object
      properties:
        mode:
          type: string
          enum:
          - 'off'
          - cache_only
          - blocking
        ceiling:
          type: string
          enum:
          - blocking
          description: Compatibility field. All three modes can be selected through authenticated settings;
            this no longer represents a YAML ceiling.
        selectable:
          type: array
          items:
            type: string
            enum:
            - 'off'
            - cache_only
            - blocking
      required:
      - ceiling
      - selectable
      description: Compatibility response; templates omits mode, while the provider list and mode mutation
        include it.
    IntelEngineStats:
      properties:
        cacheHits:
          minimum: 0
          type: integer
        cacheMisses:
          minimum: 0
          type: integer
        cacheSize:
          type: integer
        completed:
          minimum: 0
          type: integer
        dropped:
          minimum: 0
          type: integer
        enqueued:
          minimum: 0
          type: integer
        enrichment:
          type: boolean
          description: Whether explicit enrichment is enabled independently of reputation mode.
        queueDepth:
          type: integer
        queueSize:
          type: integer
        reputationMode:
          type: string
          enum:
          - 'off'
          - cache_only
          - blocking
        workers:
          type: integer
      required:
      - reputationMode
      - workers
      - queueSize
      - queueDepth
      - enqueued
      - dropped
      - completed
      - cacheHits
      - cacheMisses
      - cacheSize
      - enrichment
      type: object
    EvidenceSubject:
      type: object
      properties:
        type:
          type: string
          enum:
          - domain
          - ip
          - device
        value:
          type: string
          example: evil.example
    Evidence:
      type: object
      description: 'One source''s claim about one subject at one time. The common shape for

        feed matches, provider answers, detector findings, local observations

        and operator decisions.

        '
      properties:
        id:
          type: string
          example: ev_3f9c1a8b2d40
        subject:
          $ref: '#/components/schemas/EvidenceSubject'
        kind:
          type: string
          enum:
          - feed
          - provider
          - detector
          - local
          - operator
          description: 'How much this claim is worth differs by kind in a way it does not

            differ within one. A feed match means a human curated an indicator;

            a detector result means a heuristic inferred intent from traffic.

            '
        source:
          type: string
          description: Feed ID, provider ID, detector name, or "operator".
        sourceName:
          type: string
          description: 'The display name as it was when this was recorded. Denormalised so

            that renaming a feed cannot change the explanation of a block that

            already happened.

            '
        claim:
          type: string
          example: listed as malware
        category:
          type: string
          example: malware
        confidence:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'Three values, not a number, so that claims from sources with no

            common scale cannot be averaged into a figure nobody can reproduce.

            '
        observedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absent when the claim does not expire on its own.
        detail:
          type: object
          additionalProperties: true
          description: The source's own supporting data, in the source's terms. Untrusted input.
    Assessment:
      type: object
      description: 'What the evidence supports. Everything here can be re-derived by hand

        from the evidence list: there is no score and no weighting between

        sources.

        '
      properties:
        subject:
          $ref: '#/components/schemas/EvidenceSubject'
        verdict:
          type: string
          enum:
          - unknown
          - benign
          - suspicious
          - malicious
        confidence:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'The highest confidence among supporting evidence — not an average,

            and not raised by corroboration.

            '
        summary:
          type: string
        categories:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
          description: The distinct sources supporting the verdict, so corroboration can be shown as the
            specific sources that corroborate.
        corroborated:
          type: boolean
          description: Whether more than one independent source supports the verdict.
        inferenceOnly:
          type: boolean
          description: 'True when nothing but behavioural inference supports this, so the

            interface can word it differently. "A heuristic thinks so" and "a

            curator listed it" are not the same claim.

            '
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Decision:
      type: object
      description: One recorded enforcement or alert, and what decided it.
      properties:
        id:
          type: string
          example: dec_7b1e04c9a2f3
        time:
          type: string
          format: date-time
        queryLogId:
          type: integer
          description: The query-log row, when one was kept. Absent when query logging is off.
        subject:
          $ref: '#/components/schemas/EvidenceSubject'
        action:
          type: string
          enum:
          - allowed
          - blocked
          - error
        category:
          type: string
        rule:
          type: string
          enum:
          - allow_list
          - block_list
          - category
          - reputation
          - native_validation
          - dns_rebinding
          description: Which step of the policy evaluation reached the verdict.
        policyPath:
          type: string
          example: network:Office → policy:Standard → category:malware → BLOCK
        policyId:
          type: string
        networkId:
          type: string
        clientIp:
          type: string
        clientName:
          type: string
        qtype:
          type: string
        explanation:
          type: string
          description: 'The sentence written when the decision was made. Stored rather than

            regenerated, so it cannot change after the fact.

            '
          example: Blocked because URLhaus listed as malware.
        explanationVersion:
          type: string
          example: '1.0'
          description: Moves when the wording rules change, so two explanations can be told apart.
        evidence:
          type: array
          description: Captured evidence on detail and export endpoints. Consult evidenceSource for legacy
            references.
          items:
            type: object
            properties:
              evidence:
                $ref: '#/components/schemas/Evidence'
              contributed:
                type: boolean
                description: Whether this changed the outcome, as opposed to being on file at the time.
        evidenceSource:
          type: string
          enum:
          - recorded_snapshot
          - legacy_current_reference
          description: Historical capture or explicitly legacy current references; present on detail/export.
        evidenceNote:
          type: string
          description: Limitation of legacy evidence references; original explanation remains unchanged.
    DecisionRecorderStats:
      type: object
      properties:
        queued:
          type: integer
        dropped:
          type: integer
          description: Events dropped because the queue was full or during bounded shutdown. These counters
            describe missing records, not successful collection.
        written:
          type: integer
        failed:
          type: integer
        queueDepth:
          type: integer
        shutdownDropped:
          type: integer
          description: Events discarded/rejected during shutdown, also included in dropped. Logged when
            the bounded drain cannot retain all accepted records.
    InvestigationWindow:
      type: object
      properties:
        hours:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        retentionDays:
          type: integer
          description: Per-query rows older than this cannot exist, whatever the window.
        queryLog:
          type: boolean
        clientAttribution:
          type: boolean
    InvestigationActivity:
      type: object
      description: What the query log recorded. Outcomes, not verdicts.
      properties:
        source:
          type: string
          enum:
          - query_log
        available:
          type: boolean
          description: False when no per-query rows exist for this subject by configuration.
        unavailable:
          type: string
          description: Why, when not available.
        summary:
          type: object
          properties:
            queries:
              type: integer
              format: int64
            allowed:
              type: integer
              format: int64
            blocked:
              type: integer
              format: int64
            errors:
              type: integer
              format: int64
            firstSeen:
              type:
              - string
              - 'null'
              format: date-time
            lastSeen:
              type:
              - string
              - 'null'
              format: date-time
            qtypes:
              type: object
              additionalProperties:
                type: integer
                format: int64
            cached:
              type: integer
              format: int64
            avgElapsedMs:
              type: number
            maxElapsedMs:
              type: integer
              format: int64
        clients:
          type: array
          description: On a domain investigation, the attributed clients that asked for it, busiest first.
            Absent when addresses are not recorded.
          items:
            type: object
            properties:
              clientIp:
                type: string
              clientName:
                type: string
              networkId:
                type: string
              queries:
                type: integer
                format: int64
              blocked:
                type: integer
                format: int64
              lastSeen:
                type:
                - string
                - 'null'
                format: date-time
        domains:
          type: array
          description: On a client investigation, the names it asked for, most asked first.
          items:
            type: object
            properties:
              domain:
                type: string
              queries:
                type: integer
                format: int64
              blocked:
                type: integer
                format: int64
              category:
                type: string
                description: The most recent recorded block category, if any.
              lastSeen:
                type:
                - string
                - 'null'
                format: date-time
        recent:
          type: array
          items:
            $ref: '#/components/schemas/QueryEvent'
        recentCursor:
          type: integer
          format: int64
          description: Continue through /api/v1/queries with the same filters; 0 when complete.
        recentLimit:
          type: integer
        note:
          type: string
    InvestigationDecisions:
      type: object
      description: Stored decisions, as written when they were made. Never re-derived.
      properties:
        recording:
          type: boolean
          description: Whether decision records are on at all.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        truncated:
          type: boolean
        note:
          type: string
        nextCursor:
          type: string
          description: Continue through /api/v1/decisions using the same domain/client and response window.from/window.to
            as since/until.
    InvestigationPreview:
      type: object
      description: "What the current configuration would decide now. Labelled a\npreview because it is\
        \ one: it is not what happened, and it must not\nbe read as the reason for any recorded decision.\n\
        \ No DNS resolution occurs. Native DNSSEC and answer-dependent rebinding checks are not evaluated;\
        \ an allowed policy preview does not guarantee resolution will succeed."
      properties:
        readOnly:
          type: boolean
          enum:
          - true
        context:
          type: object
          properties:
            client:
              type: string
            attribution:
              type: string
              enum:
              - none
              - catch_all
              - network_prefix
            networkId:
              type: string
            networkName:
              type: string
            policyId:
              type: string
            policyName:
              type: string
        decision:
          type: object
          properties:
            outcome:
              type: string
              enum:
              - blocked
              - allowed
              - not_evaluated
              description: '`not_evaluated` means the live outcome would depend on an

                external provider lookup this preview did not perform. It

                is never rendered as `allowed`.

                '
            rule:
              type: string
            reason:
              type: string
            category:
              type: string
            source:
              type: string
            blockMode:
              type: string
        external:
          type: object
          properties:
            configured:
              type: boolean
            mode:
              type: string
            reached:
              type: boolean
              description: No local rule decided first, so a provider would be asked.
            evaluated:
              type: boolean
              description: A cached verdict answered.
            fromCache:
              type: boolean
            provider:
              type: string
            note:
              type: string
        byPolicy:
          type: array
          description: The same name under every configured policy, so a different assignment can be compared
            without changing anything.
          items:
            type: object
            properties:
              policyId:
                type: string
              policyName:
                type: string
              assignedNetworks:
                type: integer
              decision:
                type: object
        note:
          type: string
    InvestigationEvidence:
      type: object
      properties:
        assessment:
          $ref: '#/components/schemas/Assessment'
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Evidence'
            - type: object
              properties:
                expired:
                  type: boolean
                  description: Past its own expiry and excluded from the assessment; shown because "listed
                    until Tuesday" is useful.
                contributedTo:
                  type: integer
                  format: int64
                  description: Recorded decisions this claim was cited as having decided. Zero means on
                    file, never load-bearing.
        note:
          type: string
    InvestigationFindings:
      type: object
      properties:
        enabled:
          type: boolean
        enforcement:
          type: string
          enum:
          - none
        experimental:
          type: boolean
          enum:
          - true
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingSummaryRow'
        truncated:
          type: boolean
        note:
          type: string
    InvestigationObservations:
      type: object
      properties:
        mode:
          type: string
          enum:
          - 'off'
          - observe
          - enforce
        available:
          type: boolean
          description: Whether a runtime reporting source or retained matching rows are available. This
            can be true while active is false.
        enforcing:
          type: boolean
          description: Current native runtime enforcement, not a retroactive label for historical rows.
        experimental:
          type: boolean
          enum:
          - true
        items:
          type: array
          items:
            $ref: '#/components/schemas/DNSSECObservation'
        truncated:
          type: boolean
        note:
          type: string
        active:
          type: boolean
          description: True only for a currently running Learn observer or Live native serving path; retained
            rows remain available after Off.
    DomainInvestigation:
      type: object
      properties:
        subject:
          type: object
          properties:
            domain:
              type: string
              description: The normalised name that was searched.
            input:
              type: string
              description: The name as supplied.
            client:
              type: string
        window:
          $ref: '#/components/schemas/InvestigationWindow'
        activity:
          $ref: '#/components/schemas/InvestigationActivity'
        decisions:
          $ref: '#/components/schemas/InvestigationDecisions'
        preview:
          $ref: '#/components/schemas/InvestigationPreview'
        evidence:
          $ref: '#/components/schemas/InvestigationEvidence'
        findings:
          $ref: '#/components/schemas/InvestigationFindings'
        observations:
          $ref: '#/components/schemas/InvestigationObservations'
    ClientInvestigation:
      type: object
      properties:
        subject:
          type: object
          properties:
            client:
              type: string
            name:
              type: string
              description: The operator-assigned name, if any.
            attribution:
              type: object
              description: The network and policy the current configuration maps this address to. Current,
                not historical.
        window:
          $ref: '#/components/schemas/InvestigationWindow'
        activity:
          $ref: '#/components/schemas/InvestigationActivity'
        decisions:
          $ref: '#/components/schemas/InvestigationDecisions'
        findings:
          $ref: '#/components/schemas/InvestigationFindings'
        learning:
          $ref: '#/components/schemas/InvestigationLearning'
        observations:
          $ref: '#/components/schemas/InvestigationObservations'
    DNSSECStatus:
      properties:
        anchors:
          $ref: '#/components/schemas/DNSSECAnchorStatus'
        enforcing:
          type: boolean
          description: True while Live and a local validation runtime are available. Supports native iteration
            and encrypted forwarding; behavioral learning remains non-enforcing.
        evidence:
          $ref: '#/components/schemas/DNSSECEvidenceStatus'
        experimental:
          type: boolean
          const: true
        measuredAt:
          format: date-time
          type: string
        mode:
          $ref: '#/components/schemas/DNSSECModeStatus'
        native:
          $ref: '#/components/schemas/DNSSECNativeStatus'
        populations:
          items:
            $ref: '#/components/schemas/DNSSECPopulation'
          type:
          - array
          - 'null'
        resolution:
          $ref: '#/components/schemas/DNSSECResolutionStatus'
        runtime:
          $ref: '#/components/schemas/DNSSECRuntimeStatus'
        stored:
          $ref: '#/components/schemas/DNSSECStoredStatus'
        transport:
          type: string
          enum:
          - native
          - encrypted
      required:
      - mode
      - resolution
      - anchors
      - runtime
      - stored
      - populations
      - evidence
      - experimental
      - enforcing
      - measuredAt
      - native
      - transport
      type: object
      description: Read-only bounded snapshot of local DNSSEC mode, selected transport, anchor state and operational
        evidence. Polling sends no queries or anchor refreshes.
    DNSSECObservation:
      type: object
      description: Stored local DNSSEC result with immutable source provenance. Live records bind to the serving
        answer; Learn records describe independent observations.
      properties:
        id:
          type: string
          description: Correlates with a query-log row's dnssecValidation.
        time:
          type: string
          format: date-time
        domain:
          type: string
        qtype:
          type: string
        cached:
          type: boolean
          description: Whether the associated client answer came from cache. Learn can observe different data;
            native_live and encrypted_live use the actual serving result.
        upstream:
          type: string
          description: 'What the upstream resolver asserted. A separate fact from status,

            never merged with it and never consulted in reaching it.

            '
          enum:
          - ''
          - validated
          - unvalidated
          - servfail
        status:
          type: string
          enum:
          - secure
          - insecure
          - bogus
          - indeterminate
          - timeout
          - resource_limit
          - unreachable
          - unsupported
          - internal_error
          - not_attempted
        reasonCode:
          type: string
        reason:
          type: string
          description: A sentence for a person to read. Nothing branches on it.
        durationMs:
          type: number
          format: double
        disagreement:
          type: string
          description: How the local and upstream views differ, or empty when consistent or not comparable.
          enum:
          - ''
          - local_secure_upstream_unvalidated
          - local_bogus_upstream_validated
          - local_insecure_upstream_validated
          - local_indeterminate_upstream_validated
          - local_bogus_upstream_unvalidated
        resolution:
          type: string
          enum:
          - native
          - native_live
          - encrypted_forwarded
          - encrypted_live
          - forwarded
          - ''
          description: native_live and encrypted_live record local validation of the exact serving result;
            native and encrypted_forwarded record independent Learn observations; forwarded is legacy supporting
            lookup provenance. Historical records keep their source.
        queries:
          type: integer
          minimum: 0
          description: DNS questions used for native or encrypted material acquisition; omitted at zero.
        delegations:
          type: integer
          minimum: 0
          description: Native zone cuts crossed; omitted at zero.
    DNSSECObservationSummary:
      type: object
      properties:
        total:
          type: integer
          format: int64
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        disagreements:
          type: object
          additionalProperties:
            type: integer
            format: int64
        matrix:
          type: array
          description: The upstream assertion cross-tabulated against the local verdict.
          items:
            type: object
            properties:
              upstream:
                type: string
              local:
                type: string
              count:
                type: integer
                format: int64
        avgDurationMs:
          type: number
          format: double
        p95DurationMs:
          type: number
          format: double
    DetectorInfo:
      type: object
      properties:
        name:
          type: string
        eventType:
          type: string
        title:
          type: string
        description:
          type: string
        maturity:
          type: string
          enum:
          - available
          - experimental
        maxSeverity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
        window:
          type: string
          example: 5m0s
        mitre:
          type: array
          items:
            $ref: '#/components/schemas/DetectorTechnique'
        signals:
          type: array
          items:
            type: string
        falsePositives:
          type: array
          items:
            type: string
        enforces:
          type: boolean
          description: Whether the detector can block. False for every behavioural detector.
          const: false
    InvestigationLearning:
      type: object
      properties:
        enabled:
          type: boolean
        found:
          type:
          - boolean
          - 'null'
          description: Null when saved state is unavailable, so an unavailable model is not presented
            as an absent baseline.
        note:
          type: string
        client:
          type: object
          description: Read-only current bounded local baseline when available; no history reconstructed
            and no training triggered.
          properties:
            client:
              type: string
            networkId:
              type: string
