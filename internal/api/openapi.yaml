openapi: 3.1.0

info:
  title: DNS Daddy management API
  version: "1.0"
  description: |
    The management API for a DNS Daddy protective DNS resolver.

    Every self-hosted resolver serves this specification from `/openapi.yaml`,
    so a control plane can be generated against the exact build it is talking
    to rather than against documentation that may have drifted.

    ## Authentication

    All `/api/v1/*` endpoints except `health`, `auth/login`, `auth/logout`, and
    `auth/session` require one of:

    * `Authorization: Bearer dnsd_…` — an API token, for machine access.
    * A `dnsdaddy_session` cookie, issued by `POST /api/v1/auth/login`.

    Create API tokens from Settings in the dashboard, or via `POST /api/v1/tokens`.
    A token's secret is returned exactly once, at creation.

    ## Cross-origin requests

    A request authenticated by **session cookie** that uses a method other than
    `GET`, `HEAD`, or `OPTIONS` must carry a same-origin `Origin` or `Referer`
    header, or it is rejected with `403`. This is CSRF protection: the session
    cookie is `SameSite=Lax`, which does not cover every cross-site case.

    Requests authenticated by **bearer token** are exempt — a browser never
    attaches an `Authorization` header cross-site, so CSRF does not apply.
    Programmatic clients should use an API token and can ignore this entirely.

    ## Resolver endpoints (not part of this API)

    * `POST|GET /dns-query/{networkToken}` — DoH scoped to a network's policy.
      The path token is the credential.
    * `POST|GET /dns-query` — RFC 8484 DNS-over-HTTPS with no client
      authentication. Returns `403` unless the operator has set
      `http.allow_untokenized_doh`, because on an internet-facing deployment
      this path would otherwise be an open DoH resolver.

    Both take and return `application/dns-message`. An unrecognised network
    token is a `404`, never a silent fall back to IP-based attribution.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: The resolver serving this document

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: Status
  - name: Metrics
  - name: Networks
  - name: Policies
  - name: Feeds
  - name: Reports
  - name: Detections
  - name: Administration

paths:
  /api/v1/health:
    get:
      tags: [Status]
      summary: Liveness
      security: []
      description: |
        Answers in two tiers.

        **Every caller** gets `{"status":"ok"}` and nothing else. In the HTTPS
        deployment this is the one management path the reverse proxy publishes
        to the internet, so it describes neither the configuration nor the
        protection state of this instance.

        **An entitled caller** additionally gets `version`, `uptimeSeconds`,
        `blocklistSize`, `protecting` and `clientAclStale`. Two things count as
        entitled: an authenticated request (session cookie or bearer token),
        and a request whose peer address is loopback — which is how
        `dnsdaddy doctor` and the container's own health check read the live
        index without a credential.

        The loopback tier is decided from the address that opened the socket
        and never from a forwarding header, so `X-Forwarded-For: 127.0.0.1`
        does not reach it. Behind a reverse proxy the peer is the proxy, not
        loopback.
      responses:
        "200":
          description: Resolver status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    description: |
                      The process is up and serving. Not a protection verdict —
                      see `protecting`, which requires entitlement.
                  version:
                    type: string
                    description: Entitled callers only.
                  uptimeSeconds:
                    type: integer
                    format: int64
                    description: Entitled callers only.
                  blocklistSize:
                    type: integer
                    description: Entitled callers only.
                  protecting:
                    type: boolean
                    description: |
                      Whether the threat index has anything in it. False means
                      the resolver answers but filters nothing. Entitled
                      callers only.
                  clientAclStale:
                    type: boolean
                    description: |
                      The resolver could not re-read its configuration after a
                      change, so the client access it is enforcing could not be
                      confirmed to match what is stored. It reveals nothing
                      about what the ACL contains. Entitled callers only.

  /api/v1/auth/login:
    post:
      tags: [Administration]
      summary: Exchange the admin password for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true }
      responses:
        "200":
          description: Signed in; a `dnsdaddy_session` cookie is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many failed attempts from this address

  /api/v1/auth/logout:
    post:
      tags: [Administration]
      summary: Clear the session cookie
      security: []
      responses:
        "200": { description: Signed out }

  /api/v1/auth/session:
    get:
      tags: [Administration]
      summary: Report whether the caller is authenticated
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  principal: { type: string }

  /api/v1/auth/password:
    post:
      tags: [Administration]
      summary: Change the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, writeOnly: true }
                newPassword: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        "200": { description: Password updated }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/overview:
    get:
      tags: [Status]
      summary: Dashboard headline figures
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /api/v1/diagnostics:
    get:
      tags: [Status]
      summary: Why DNS is not working
      description: >
        Checks the resolver's configuration against its live counters and
        reports, in plain English, anything that would stop clients resolving.
        Chiefly: whether the networks configured here are actually permitted to
        send queries by its resolver-access permission and dns.allowed_client_cidrs, which are independent
        settings that look like one. `dnsdaddy doctor` renders the same checks
        at the command line.
      responses:
        "200":
          description: Every check, worst status first in the `status` field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }

  /api/v1/activity/queries:
    get:
      tags: [Metrics]
      summary: Hourly query and block counts
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24, minimum: 1, maximum: 720 }
      responses:
        "200":
          description: Hourly buckets, including hours with no traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityBucket" }

  /api/v1/threats/categories:
    get:
      tags: [Metrics]
      summary: Blocked counts grouped by category
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24 }
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryCount" }

  /api/v1/threats/top-domains:
    get:
      tags: [Metrics]
      summary: Most frequently blocked domains
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 200 }
      responses:
        "200":
          description: Ranked domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items: { $ref: "#/components/schemas/TopBlockedDomain" }

  /api/v1/queries:
    get:
      tags: [Metrics]
      summary: Query log, newest first
      description: |
        Cursor-paginated. Pass the returned `nextCursor` to fetch the next page;
        a `nextCursor` of `0` means the result set is exhausted.
      parameters:
        - { name: networkId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, enum: [allowed, blocked, error] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string }, description: Substring match }
        - { name: clientIp, in: query, schema: { type: string } }
        - { name: hours, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: Query-log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items: { $ref: "#/components/schemas/QueryEvent" }
                  nextCursor: { type: integer, format: int64 }

  /api/v1/categories:
    get:
      tags: [Policies]
      summary: Available filtering categories and how many domains each holds
      responses:
        "200":
          description: Category catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

  /api/v1/resolvers:
    get:
      tags: [Status]
      summary: Connection details and upstream health
      responses:
        "200":
          description: Resolver endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolverInfo" }

  /api/v1/settings:
    get:
      tags: [Administration]
      summary: Effective runtime configuration
      description: Read-only. Configuration is owned by the YAML file and environment.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /api/v1/networks:
    get:
      tags: [Networks]
      summary: List networks with 24-hour activity
      responses:
        "200":
          description: Networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items: { $ref: "#/components/schemas/NetworkWithActivity" }
                  clientAccess: { $ref: "#/components/schemas/ClientAccess" }
    post:
      tags: [Networks]
      summary: Create a network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/PublicAckRequired" }

  /api/v1/networks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Networks]
      summary: Get a network
      responses:
        "200":
          description: Network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Networks]
      summary: Update a network
      description: Omitted fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PublicAckRequired" }
    delete:
      tags: [Networks]
      summary: Delete a network
      description: The last remaining network cannot be deleted.
      responses:
        "204":
          description: >-
            Deleted, and the effective client ACL was republished from what
            remains. That does not necessarily mean the network's addresses are
            now refused: the ACL is a union with no deny rules, so a range the
            bootstrap list or another permitted network also covers goes on
            being served. `GET /api/v1/networks` reports what is actually
            admitted.
        "200":
          description: >-
            Deleted, but the resolver could not re-read its configuration, so
            whether the network's addresses are still being served could not be
            confirmed. The condition is also reported by `GET
            /api/v1/diagnostics`, by `GET /api/v1/health` as `clientAclStale`,
            and by `dnsdaddy doctor` (which reads it from health, since the
            state lives in the running daemon's memory) — until a reload
            succeeds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [deleted] }
                  warning: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/networks/{id}/rotate-token:
    post:
      tags: [Networks]
      summary: Issue a new DoH token, invalidating the old one
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Network with its new token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }

  /api/v1/policies:
    get:
      tags: [Policies]
      summary: List policies
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/Policy" }
    post:
      tags: [Policies]
      summary: Create a policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }

  /api/v1/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Policies]
      summary: Get a policy
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Policies]
      summary: Update a policy
      description: |
        Omitted fields are left unchanged. Supplying `allowDomains` or
        `blockDomains` replaces that list wholesale; use the rules endpoints to
        add or remove a single entry.

        A successful update purges the answer cache so the change takes effect
        on the next query rather than after the current TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
    delete:
      tags: [Policies]
      summary: Delete a policy
      description: The default policy, and any policy still assigned to a network, cannot be deleted.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/policies/{id}/rules:
    post:
      tags: [Policies]
      summary: Add one allow or block entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, domain]
              properties:
                kind: { type: string, enum: [allow, block] }
                domain: { type: string, example: supplier.example.com }
                note: { type: string, description: Free text, e.g. a ticket reference }
      responses:
        "200":
          description: The updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }

  /api/v1/policies/{id}/rules/{kind}/{domain}:
    delete:
      tags: [Policies]
      summary: Remove one allow or block entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [allow, block] } }
        - { name: domain, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/feeds:
    get:
      tags: [Feeds]
      summary: List threat-intelligence feeds
      responses:
        "200":
          description: Feeds
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeds:
                    type: array
                    items: { $ref: "#/components/schemas/Feed" }
                  refreshing: { type: boolean }
                  totalIndexedDomains: { type: integer }
                  observatoryFeedId:
                    type: string
                    example: dnsdaddy-observatory
                    description: >-
                      The ID of the built-in DNS Daddy Threat Observatory row, so a
                      client can find it without hardcoding the slug.

    post:
      tags: [Feeds]
      summary: Add a custom feed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }

  /api/v1/feeds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Feeds]
      summary: Update a feed
      description: Built-in feeds may only be enabled or disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
    delete:
      tags: [Feeds]
      summary: Delete a custom feed
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/feeds/refresh:
    post:
      tags: [Feeds]
      summary: Download every enabled feed and rebuild the index
      description: |
        Returns immediately; the refresh runs in the background. Poll
        `GET /api/v1/feeds` and watch `refreshing` to know when it has finished.
      responses:
        "202":
          description: Refresh started
        "409":
          description: A refresh is already running

  /api/v1/feeds/{id}/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Feeds]
      summary: Download one feed and rebuild the index
      description: |
        The same download, validation, caching and index-rebuild path as a full
        refresh, scoped to a single feed, so switching a feed on can be verified
        in seconds rather than after a full refresh of every source.

        Returns immediately; the refresh runs in the background. Poll
        `GET /api/v1/feeds` and watch `refreshing` to know when it has finished,
        then read `lastStatus`, `lastError` and `lastSuccessAt` on the row.
      responses:
        "202":
          description: Refresh started
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The feed is disabled, or a refresh is already running

  /api/v1/integrations/providers:
    get:
      tags: [Integrations]
      summary: List external intelligence providers
      description: |
        Every configured provider with its live state: the resilient client's
        counters, its circuit-breaker position, and why it is not working when
        it is not.

        No credential is returned. `secretSet` says whether one is stored and
        `secretHint` is its last four characters, which is what a vendor
        console shows and far too little to narrow a search for the rest.
      responses:
        "200":
          description: Providers, engine counters, and the reputation mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/APIProvider" }
                  engine: { $ref: "#/components/schemas/IntelEngineStats" }
                  reputation: { $ref: "#/components/schemas/ReputationSetting" }
        "503":
          description: Integrations are switched off in dnsdaddy.yaml
    post:
      tags: [Integrations]
      summary: Add an external intelligence provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIProviderInput" }
      responses:
        "201":
          description: The provider, without its credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIProvider" }
        "400":
          description: No adapter for this kind in this build, or invalid input
        "503":
          description: Integrations are off, or the encryption key is unavailable

  /api/v1/integrations/providers/test:
    post:
      tags: [Integrations]
      summary: Test a provider that has not been saved
      description: |
        One live call to the candidate, so an operator finds out a credential
        is wrong while the wizard is still open. The credential is used for
        that call and is not written to the database, the log, or the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, example: customhttp }
                config:
                  type: object
                  additionalProperties: { type: string }
                secret:
                  type: string
                  writeOnly: true
                  description: Used for this one call and discarded.
                timeoutMs: { type: integer }
                ratePerMinute: { type: integer }
      responses:
        "200":
          description: What happened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "400":
          description: No adapter for this kind in this build
        "503":
          description: Integrations are switched off in dnsdaddy.yaml

  /api/v1/integrations/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Integrations]
      summary: Read one provider
      responses:
        "200":
          description: The provider, without its credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIProvider" }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }
    patch:
      tags: [Integrations]
      summary: Change a provider
      description: |
        `kind` and `secret` are refused here rather than ignored. Changing the
        adapter under a row would reinterpret its settings as a different
        provider's, and an operator who believes they rotated a credential they
        did not is worse off than one who got an error — use
        `POST /api/v1/integrations/providers/{id}/secret`.

        Cached verdicts for this provider are discarded, because they were
        produced under the settings being replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIProviderPatch" }
      responses:
        "200":
          description: The updated provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIProvider" }
        "400": { description: kind or secret was sent, or the input is invalid }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }
    delete:
      tags: [Integrations]
      summary: Remove a provider
      description: Deletes the provider, its sealed credential, and its cached verdicts.
      responses:
        "204": { description: Removed }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }

  /api/v1/integrations/providers/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Integrations]
      summary: Set or rotate a provider's credential
      description: |
        The credential is encrypted with AES-256-GCM, bound to this provider's
        ID as additional authenticated data, and written to a table this API
        cannot read back. There is no endpoint anywhere that returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
                  writeOnly: true
                  description: The credential. Never returned by any endpoint.
      responses:
        "200":
          description: The provider, with secretSet and the new hint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIProvider" }
        "400": { description: An empty secret; use DELETE to remove one }
        "404": { description: No such provider }
        "503": { description: Integrations are off, or the encryption key is unavailable }
    delete:
      tags: [Integrations]
      summary: Remove a provider's credential
      description: The provider stays configured and becomes unauthenticated.
      responses:
        "204": { description: Removed }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }

  /api/v1/integrations/providers/{id}/test:
    post:
      tags: [Integrations]
      summary: Test a saved provider
      description: |
        One live call, using the stored credential. A disabled provider is
        still testable, because an operator configures, tests, and only then
        switches it on.

        The test does not touch the engine's verdict cache. A button meant to
        check a credential must not also be a way to seed a verdict for a name
        of somebody's choosing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What happened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }

  /api/v1/integrations/providers/{id}/health:
    get:
      tags: [Integrations]
      summary: A provider's live state
      description: |
        Safe to poll: it reads counters the resilient client already keeps and
        makes no upstream request. A polled endpoint that called the provider
        would spend an operator's quota for as long as a dashboard tab is open.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status and counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  providerId: { type: string }
                  status: { type: string, enum: [ok, disabled, error] }
                  detail: { type: string }
                  stats: { $ref: "#/components/schemas/ProviderStats" }
        "404": { description: No such provider }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }

  /api/v1/integrations/templates:
    get:
      tags: [Integrations]
      summary: The adapters this build offers
      description: |
        Generated from the compiled-in adapter registry, so what the wizard
        offers is exactly what this binary can talk to.

        Every template states what leaves the network (`privacyNote`) and what
        evidence exists that the adapter works (`verification`,
        `liveVerified`). No adapter shipped so far has been exercised against
        its vendor's live service, and the dashboard says so on the card.

        Answers even when integrations are switched off: it describes the
        build, touches no credential, and is how an operator decides whether
        to switch them on.
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderTemplate" }
                  reputation: { $ref: "#/components/schemas/ReputationSetting" }

  /api/v1/integrations/reputation:
    put:
      tags: [Integrations]
      summary: Change how much reach providers have over resolution
      description: |
        `off` never consults a provider from the resolution path. `cache_only`
        reads the local cache and never waits. `blocking` waits up to the
        configured budget on a cache miss, and is the only mode that puts a
        third party's latency in front of a DNS answer.

        `integrations.reputation_mode` in `dnsdaddy.yaml` is a ceiling, not a
        default. This endpoint can lower the mode but never raise it above the
        file — so a deployment configured for `cache_only` cannot be talked
        into `blocking` by anything reachable over the network, including a
        stolen session. Read `docs/external-apis.md` before raising it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: ["off", cache_only, blocking] }
      responses:
        "200":
          description: The new mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReputationSetting" }
        "400": { description: Not a mode this build understands }
        "403": { description: Above the ceiling set in dnsdaddy.yaml }
        "503": { description: Integrations are switched off in dnsdaddy.yaml }

  /api/v1/decisions:
    get:
      tags: [Decisions]
      summary: Recent enforcement decisions
      description: |
        One record per enforced or alerted decision, newest first — not one per
        query. Each carries the policy path that produced it and the
        explanation that was written at the time.

        `recording` reports whether decision records are switched on at all, so
        a caller can tell "nothing has been blocked" from "nothing is being
        recorded". Those look identical in an empty list and mean opposite
        things.
      parameters:
        - { name: domain, in: query, schema: { type: string } }
        - { name: client, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, enum: [blocked, allowed] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: Decisions, without their evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
                  recording:
                    type: boolean
                    description: Whether decision records are enabled on this deployment.
                  stats: { $ref: "#/components/schemas/DecisionRecorderStats" }

  /api/v1/decisions/{id}:
    get:
      tags: [Decisions]
      summary: One decision, with the evidence it cited
      description: |
        The evidence comes back by the IDs this decision recorded, not by
        re-reading what is currently known about the domain. A feed that has
        since dropped the name cannot change why it was blocked last week.

        `contributed` distinguishes evidence that changed the outcome from
        evidence that was merely on file at the time.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The decision and its evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "404": { description: No such decision }

  /api/v1/evidence/domain/{domain}:
    get:
      tags: [Decisions]
      summary: What is known about a domain now
      description: |
        Everything on file about a domain, the assessment it currently
        supports, and the recent decisions about it.

        Deliberately separate from the decision detail: a decision says what
        was true when it was made, and this says what is true now. Merging them
        would let the answer to "why was this blocked" drift as feeds refresh.

        Expired evidence is included, because "this was listed until Tuesday"
        is useful to an investigator — the assessment has already excluded it
        from the verdict.
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Evidence and assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { $ref: "#/components/schemas/EvidenceSubject" }
                  assessment: { $ref: "#/components/schemas/Assessment" }
                  evidence:
                    type: array
                    items: { $ref: "#/components/schemas/Evidence" }
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
        "400": { description: A domain is required }

  /api/v1/clients:
    get:
      tags: [Administration]
      summary: List device names
      responses:
        "200":
          description: Named devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
    put:
      tags: [Administration]
      summary: Name a device by IP, or clear its name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip, name]
              properties:
                ip: { type: string, example: 10.0.4.23 }
                name: { type: string, example: laptop-07, description: An empty name removes the entry }
      responses:
        "204": { description: Saved }

  /api/v1/tokens:
    get:
      tags: [Administration]
      summary: List API tokens
      responses:
        "200":
          description: Tokens; secrets are never returned here
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/APIToken" }
    post:
      tags: [Administration]
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: The token, including its secret. This is the only time the secret is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenCreated" }

  /api/v1/tokens/{id}:
    delete:
      tags: [Administration]
      summary: Revoke an API token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }

  /api/v1/reports/summary:
    get:
      tags: [Reports]
      summary: Reporting-period summary
      description: |
        With `format=markdown` the response is a `text/markdown` document
        written for a non-technical reader — a director, an insurer, or a
        Cyber Essentials assessor.
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: format
          in: query
          schema: { type: string, enum: [json, markdown], default: json }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
            text/markdown:
              schema: { type: string }

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }

  /api/v1/findings:
    get:
      tags: [Detections]
      summary: Behavioural security findings, newest first
      description: |
        Findings produced by the behavioural detection engine.

        **These do not block anything.** They are heuristics that observe,
        score and explain; enforcement is done by the policy and threat-feed
        engine from curated intelligence. Every response repeats
        `enforcement: none` so a consumer never has to infer it.

        Every detector is currently **experimental**: thresholds are calibrated
        against synthetic traffic rather than a production network.
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [info, low, medium, high] } }
        - { name: type, in: query, schema: { type: string }, description: "Event type, e.g. dns_tunnel_suspected" }
        - { name: client, in: query, schema: { type: string }, description: Exact client IP }
        - { name: domain, in: query, schema: { type: string }, description: Substring match }
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 8760 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - name: detail
          in: query
          schema: { type: string, enum: ["true"] }
          description: Include the full finding document with each row. Off by default; a document is several kilobytes.
      responses:
        "200":
          description: Matching findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/FindingSummaryRow" }
                  count: { type: integer }
                  enforcement: { type: string, enum: [none] }

  /api/v1/findings/summary:
    get:
      tags: [Detections]
      summary: Finding counts by event type and severity
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 7, minimum: 1, maximum: 365 } }
      responses:
        "200":
          description: Grouped counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  total: { type: integer, format: int64 }
                  enabled: { type: boolean }
                  byType:
                    type: array
                    items:
                      type: object
                      properties:
                        eventType: { type: string }
                        severity: { type: string }
                        count: { type: integer, format: int64 }

  /api/v1/findings/export:
    get:
      tags: [Detections]
      summary: Stream findings as newline-delimited JSON
      description: |
        One complete finding document per line, oldest first, so a consumer can
        append to its own store in time order and process a record at a time
        rather than buffering the whole response.

        This is the SIEM integration path. See `docs/siem.md` for shipper
        configurations. The same documents are also written to
        `detection.findings_file` when that is configured, which is usually the
        better option for continuous ingestion.
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [info, low, medium, high] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 8760 } }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 1000 } }
      responses:
        "200":
          description: NDJSON stream
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/Finding" }

  /api/v1/findings/{id}:
    get:
      tags: [Detections]
      summary: One finding, with its full detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingSummaryRow" }
        "404":
          description: No such finding

  /api/v1/detectors:
    get:
      tags: [Detections]
      summary: What the detection engine is looking for
      description: |
        The detector catalogue, generated from the running detectors rather
        than from a document. Each entry states its maturity, the signals it
        measures, the benign traffic known to look like it, its ATT&CK
        mappings, and whether it can enforce anything — which, for every
        behavioural detector, is `false`.
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  enforcement: { type: string, enum: [none] }
                  description: { type: string }
                  schemaVersion: { type: string, example: "1.0" }
                  detectors:
                    type: array
                    items: { $ref: "#/components/schemas/DetectorInfo" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token, which always begins `dnsd_`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: dnsdaddy_session

  responses:
    BadRequest:
      description: The request was rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required or incorrect
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PublicAckRequired:
      description: >-
        The request would permit a publicly routable range to query the
        resolver, which needs an explicit acknowledgement. The request is
        well-formed and may be resent verbatim with publicAck set to true.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              publicAckRequired: { type: boolean, enum: [true] }
              publicCidrs:
                type: array
                items: { type: string, example: 203.0.113.25/32 }
                description: The ranges that need acknowledging.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Diagnostics:
      type: object
      properties:
        status:
          type: string
          enum: [pass, warn, fail]
          description: The worst verdict across every check.
        checks:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticCheck" }

    DiagnosticCheck:
      type: object
      properties:
        section: { type: string, example: CLIENT ACCESS }
        name: { type: string, example: 'Network "Home" can resolve' }
        status: { type: string, enum: [pass, warn, fail] }
        summary:
          type: string
          description: A whole sentence, read by somebody already having a bad time.
          example: Network "Home" exists in the dashboard, but DNS queries from it are REFUSED.
        evidence:
          type: array
          description: The values the verdict was reached from, so the operator can disagree.
          items: { type: string }
        action:
          type: string
          description: The next thing to do.

    Overview:
      type: object
      properties:
        protectionStatus:
          type: string
          enum: [protected, degraded, offline]
          description: |
            `offline` means no blocklist is loaded. `degraded` means a blocklist
            is loaded but no policy is enforcing anything.
        resolverStatus: { type: string, enum: [operational, degraded] }
        queries24h: { type: integer, format: int64 }
        threatsBlocked24h: { type: integer, format: int64 }
        blockRate24h: { type: number, format: double }
        protectedNetworks: { type: integer }
        activePolicies: { type: integer }
        blocklistDomains: { type: integer }
        lastFeedRefresh: { type: [string, "null"], format: date-time }
        uptimeSeconds: { type: integer, format: int64 }
        version: { type: string }
        hasSeenClients:
          type: boolean
          description: |
            Whether a non-loopback client has **ever** used this resolver.

            A latch, not a rolling window: once a device has been seen the fact
            is recorded, so a network that goes quiet for a day does not start
            reporting that nothing has ever used the resolver.

            Loopback is excluded deliberately: health checks, `dnsdaddy doctor`
            and the operator's own `dig` from the server all arrive from
            127.0.0.1, and counting them would report that the network is using
            the resolver when only the server is.

            Always false when `clientAttribution` is false — read the two
            together.
        clientAttribution:
          type: boolean
          description: |
            Whether client addresses are recorded at all (`log.query_log` and
            `log.log_client_ip`). When false, `hasSeenClients` says nothing
            about the network, only about the privacy setting.
        permittedNetworks:
          type: integer
          description: |
            How many enabled networks carry the resolver-access permission.

            Informational, and deliberately **not** what the dashboard's
            first-run card branches on. A stock LAN install has none of these
            and serves every private range perfectly well, so treating zero as
            "every client will be refused" is false on the most common
            deployment there is.
        unrestrictedAccess:
          type: boolean
          description: |
            No client ACL is configured, so no query is refused on its source
            address. Configuration validation only permits this alongside
            loopback-only listeners or `dns.allow_public_resolver`.
        servesOnlyLoopback:
          type: boolean
          description: |
            The effective ACL admits nothing but this machine itself — the one
            state in which "no client can use this resolver" is a measurement
            rather than a guess.
        refusedClients:
          type: integer
          format: int64
          description: |
            Queries turned away by the client ACL since start.

            This is the evidence that separates two states nothing at rest can:
            a deployment whose clients arrive from addresses the ACL does not
            cover looks identical to one nobody has pointed anything at, until
            somebody tries. A climbing count with `hasSeenClients` false means
            the queries are arriving and being refused, which has a different
            fix from no queries at all.

            The refused addresses themselves are deliberately not recorded — an
            unauthorised source could otherwise fill the log.

    ActivityBucket:
      type: object
      properties:
        hour: { type: string, format: date-time }
        label: { type: string, example: "14:00" }
        total: { type: integer, format: int64 }
        blocked: { type: integer, format: int64 }

    CategoryCount:
      type: object
      properties:
        category: { type: string }
        label: { type: string }
        count: { type: integer, format: int64 }

    TopBlockedDomain:
      type: object
      properties:
        domain: { type: string }
        category: { type: string }
        count: { type: integer, format: int64 }
        lastSeen: { type: string, format: date-time }

    QueryEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        clientIp: { type: string }
        clientName: { type: string }
        networkId: { type: string }
        domain: { type: string }
        qtype: { type: string, example: A }
        action: { type: string, enum: [allowed, blocked, error] }
        reason:
          type: string
          description: Plain-English explanation, suitable for reading back to a user.
          example: Domain is on a phishing list
        category: { type: string }
        source: { type: string, description: The feed or list that matched }
        proto: { type: string, enum: [udp, tcp, dot, doh] }
        elapsedMs: { type: integer }
        cached: { type: boolean }
        dnssec:
          type: string
          enum: ["", validated, unvalidated, servfail]
          description: |
            DNSSEC validation status **as reported by the upstream resolver**.
            DNS Daddy forwards rather than validating locally, so this records
            the upstream's conclusion.

            `validated` — the upstream set the AD bit, having authenticated the
            answer against the chain of trust.

            `unvalidated` — no AD bit came back. This covers an unsigned zone
            *and* an upstream that does not validate; a forwarder cannot
            distinguish them, which is why it is not called "insecure".

            `servfail` — the upstream could not answer. Failed DNSSEC
            validation is one cause among several.

            Empty when no upstream was consulted, for example on a blocked
            query.

    Category:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        reason: { type: string }
        defaultOn: { type: boolean }
        indexedDomains: { type: integer }

    Network:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        policyId: { type: string }
        token:
          type: string
          description: The per-network DoH path token. Treat it as a credential.
        enabled: { type: boolean }
        allowResolver:
          type: boolean
          description: >-
            Whether this network's addresses may query the resolver at all — a
            separate decision from policyId, which decides what happens to
            those queries once they are accepted. False, the default, grants
            nothing: the client ACL from configuration still applies on its
            own. Changing this takes effect on the next query, with no restart.
            It governs source addresses only — a DoH or DoT client presenting
            this network's token is identified by the token and resolves either
            way. Disable the network, or rotate its token, to cut one off.
        cidrs:
          type: array
          items: { type: string }
          description: Client ranges attributed to this network. Empty means catch-all.
        acknowledgedPublicCidrs:
          type: array
          items: { type: string }
          description: >-
            The publicly routable ranges an operator has explicitly affirmed.
            Permitting a public range requires one; it is remembered per range,
            so an unrelated later edit does not re-prompt while introducing a
            new public range does.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warning:
          type: string
          description: >-
            Present only on a write that was stored, after which the resolver
            could not re-read its configuration — so the client access being
            enforced could not be confirmed to match what is stored. It does
            not say the change failed to apply; which of the two it is cannot
            be determined without the read that failed. Absent otherwise.

    NetworkWithActivity:
      allOf:
        - $ref: "#/components/schemas/Network"
        - type: object
          properties:
            queries24h: { type: integer, format: int64 }
            blocked24h: { type: integer, format: int64 }
            status: { type: string, enum: [healthy, no-traffic, disabled] }
            publicCidrs:
              type: array
              items: { type: string }
              description: This network's ranges that are reachable from the public internet.
            coverage:
              type: string
              enum: [full, partial, none]
              description: >-
                How much of this network the live effective ACL admits. A
                question about addresses only: whether the row is enabled, and
                whether it carries a permission of its own, decide what it
                contributes to the ACL rather than what the ACL admits, because
                the ACL is a union with no deny rules. So a disabled network
                inside a permitted range reports full, and a permission that
                has not been reloaded reports none despite allowResolver being
                true.

                `partial` is its own answer rather than a rounding of "not
                full": a 10.0.0.0/8 network against a permitted 10.0.0.0/16 has
                65k addresses served and the rest refused, which is the state
                that presents as intermittent breakage.
            resolvesVia:
              type: string
              description: >-
                When coverage is full and allowResolver is false, the wider
                permitted range responsible. Client access has no deny rules,
                so a narrower network without a permission does not carve a
                hole in a broader permitted one.

    ClientAccess:
      type: object
      description: >-
        The effective client ACL: the bootstrap list from configuration unioned
        with the networks the dashboard permits.
      properties:
        unrestricted:
          type: boolean
          description: >-
            True when no client ACL is configured, so no query is refused on
            its source address. Configuration validation only permits this
            alongside loopback-only listeners or allowPublicResolver.
        allowPublicResolver: { type: boolean }
        bootstrapCidrs:
          type: array
          items: { type: string }
          description: dns.allowed_client_cidrs, as configured. Changing it needs a restart.
        effectiveCidrs:
          type: array
          items: { type: string }
          description: >-
            The union actually enforced. Empty when unrestricted is true, which
            means everything is accepted rather than nothing.
        dashboardCidrs:
          type: array
          items: { type: string }
          description: >-
            The distinct ranges permitted by networks, as opposed to by
            configuration. Not the same as effectiveCidrs minus bootstrapCidrs:
            a range that appears in both survives that subtraction as nothing,
            which would report a network the operator had just permitted as
            contributing no ranges.

    NetworkInput:
      type: object
      properties:
        name: { type: string }
        location: { type: string }
        policyId: { type: string }
        cidrs:
          type: array
          items: { type: string, example: 10.0.10.0/24 }
        enabled: { type: boolean }
        allowResolver:
          type: boolean
          description: >-
            Permit this network's addresses to query the resolver. Omitted
            leaves the stored value alone, so a client updating a name cannot
            silently revoke access it never mentioned. A default route
            (0.0.0.0/0 or ::/0) is refused with 400 whatever else is sent:
            dns.allow_public_resolver is the setting for that, and it lives in
            configuration.
        publicAck:
          type: boolean
          description: >-
            Affirms, in this request, that the publicly routable ranges it
            results in may reach the resolver. Without it such a write is
            refused with 409 and a publicCidrs list naming them; resend the
            same request with this set to proceed.

    Policy:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        categories:
          type: array
          items: { type: string }
        blockMode: { type: string, enum: [nxdomain, zeroip, refused] }
        safeSearch:
          type: boolean
          deprecated: true
          description: >-
            Not enforced. The value is stored on the policy and echoed back
            here, but the resolver does not act on it and no search engine is
            rewritten. Setting it true changes nothing about how queries are
            answered. Do not use it as a signal that safe search is in effect.
            Tracked in docs/roadmap.md; this field will start behaving as its
            name suggests only when enforcement lands.
        logQueries:
          type: boolean
          description: When false, statistics are still recorded but no per-query rows are stored.
        isDefault: { type: boolean }
        allowDomains:
          type: array
          items: { type: string }
        blockDomains:
          type: array
          items: { type: string }
        assigned: { type: integer, description: Number of networks using this policy }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PolicyInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        categories:
          type: array
          items: { type: string }
        blockMode: { type: string, enum: [nxdomain, zeroip, refused] }
        safeSearch:
          type: boolean
          deprecated: true
          description: >-
            Accepted and stored, but not enforced — see the note on
            Policy.safeSearch. Sending it has no effect on resolution.
        logQueries: { type: boolean }
        allowDomains:
          type: array
          items: { type: string }
        blockDomains:
          type: array
          items: { type: string }

    Feed:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        category: { type: string }
        format: { type: string, enum: [auto, hosts, domains, adblock, observatory] }
        enabled: { type: boolean }
        builtin: { type: boolean }
        domainCount: { type: integer }
        indexedDomains:
          type: integer
          description: Domains this feed contributes after de-duplication against higher-priority feeds.
        loaded:
          type: boolean
          description: >-
            Whether this feed's cached copy is in the index answering queries right
            now. This, not lastSuccessAt, is what says a feed is protecting anything:
            a feed whose cached file has gone missing or will not parse is skipped at
            every rebuild while its row still shows a healthy refresh.
        loadError:
          type: string
          description: Why the cached copy could not be loaded, when it could not. Empty otherwise.
        lastRefreshedAt:
          type: [string, "null"]
          format: date-time
          description: When this feed was last attempted, successfully or not.
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When this feed last downloaded usable content. Null means it never has.
            While a feed is erroring this is what says how old the intelligence
            still in the index is.
        lastStatus: { type: string }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FeedInput:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        category: { type: string }
        format: { type: string, enum: [auto, hosts, domains, adblock, observatory] }
        enabled: { type: boolean }

    Client:
      type: object
      properties:
        ip: { type: string }
        name: { type: string }
        updatedAt: { type: string, format: date-time }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }

    APITokenCreated:
      description: |
        A newly created token. This is the only schema in this API that carries
        a credential, and the only response that ever returns one: the secret
        is shown once, at creation, and is not recoverable afterwards.
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Shown once. Store it now; it cannot be read back.

    ResolverInfo:
      type: object
      properties:
        listenUdp: { type: string }
        listenTcp: { type: string }
        listenDot: { type: string }
        dohUrl: { type: string }
        upstreams:
          type: array
          items:
            type: object
            properties:
              spec: { type: string }
              protocol: { type: string, enum: [udp, tcp, tls, https] }
              address: { type: string }
              queries: { type: integer, format: int64 }
              errors: { type: integer, format: int64 }
              avgLatencyMs: { type: number, format: double }
        networks:
          type: array
          items:
            type: object
            properties:
              networkId: { type: string }
              name: { type: string }
              dohUrl: { type: string }

    Settings:
      type: object
      properties:
        version: { type: string }
        dataDir: { type: string }
        queryLog: { type: boolean }
        logClientIp: { type: boolean }
        retentionDays: { type: integer }
        rollupDays: { type: integer }
        cacheEnabled: { type: boolean }
        cacheMaxEntries: { type: integer }
        cacheEntries: { type: integer }
        cacheHitRate: { type: number, format: double }
        cacheLookups:
          type: integer
          format: int64
          description: >-
            Hits plus misses since start. The denominator behind cacheHitRate:
            a rate of 0 means either that the cache answered none of the
            lookups it saw or that it has not seen any, and only this field
            separates the two. A client showing the rate should show nothing
            when this is zero.
        feedRefreshInterval: { type: string }
        upstreamMode: { type: string, enum: [failover, race] }
        queryLogRows: { type: integer, format: int64 }
        memoryMb: { type: number, format: double }
        goroutines: { type: integer }
        uptimeSeconds: { type: integer, format: int64 }

    ReportSummary:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        periodDays: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        version: { type: string }
        totals:
          type: object
          properties:
            queries: { type: integer, format: int64 }
            blocked: { type: integer, format: int64 }
        blockRate: { type: number, format: double }
        blocklistDomains: { type: integer }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryCount" }
        topBlockedDomains:
          type: array
          items: { $ref: "#/components/schemas/TopBlockedDomain" }
        networks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              location: { type: string }
              policy: { type: string }
              queries: { type: integer, format: int64 }
              blocked: { type: integer, format: int64 }
        feeds:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              category: { type: string }
              domains: { type: integer }
              lastRefreshedAt: { type: [string, "null"], format: date-time }

    FindingSummaryRow:
      type: object
      description: A finding as the REST API returns it. `detail` is the complete document.
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        eventType: { type: string, example: dns_tunnel_suspected }
        severity: { type: string, enum: [info, low, medium, high] }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        clientIp: { type: string }
        clientName: { type: string }
        networkId: { type: string }
        domain: { type: string }
        qtype: { type: string }
        detector: { type: string }
        title: { type: string }
        summary: { type: string }
        detail: { $ref: "#/components/schemas/Finding" }

    Finding:
      type: object
      description: |
        The structured security finding. This is the integration contract: the
        same document appears here, in the NDJSON export, and in
        `detection.findings_file`.

        Within a major `schemaVersion`, fields may be added but never removed
        or repurposed.
      properties:
        schemaVersion: { type: string, example: "1.0" }
        id: { type: string }
        time: { type: string, format: date-time }
        eventType:
          type: string
          enum:
            - dns_tunnel_suspected
            - dns_beaconing_suspected
            - nxdomain_burst
            - txt_activity_anomaly
            - dga_like_domains
            - resolution_failure_burst
        severity: { type: string, enum: [info, low, medium, high] }
        confidence:
          type: number
          format: double
          description: |
            How strongly the evidence supports the conclusion, 0..1. Derived
            from the score and then damped by sample size — the same score over
            40 queries is less trustworthy than over 400.
        score:
          type: number
          format: double
          description: Weighted signal total before sample-size damping.
        client:
          type: object
          properties:
            ip: { type: string }
            name: { type: string }
            networkId: { type: string }
        domain: { type: string }
        qtype: { type: string }
        title: { type: string }
        summary: { type: string, description: One sentence stating the conclusion and its basis. }
        signals:
          type: array
          description: |
            The measurements behind the score. Contributions sum to `score`, so
            the arithmetic can be checked by hand.
          items:
            type: object
            properties:
              name: { type: string, example: unique_subdomains }
              description: { type: string }
              value: { type: number, format: double }
              floor: { type: number, format: double, description: Value at which this signal starts contributing }
              ceiling: { type: number, format: double, description: Value at which it contributes fully }
              normalised: { type: number, format: double }
              weight: { type: number, format: double }
              contribution: { type: number, format: double }
        evidence:
          type: object
          additionalProperties: true
          description: Detector-specific measurements, e.g. unique_subdomains, average_entropy.
        window:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            queries: { type: integer }
        mitre:
          type: array
          description: |
            ATT&CK mappings. Each carries a rationale; a technique attached
            without one would be decoration. `hypothesis: true` marks a mapping
            that describes what the behaviour *would* be if the finding is a
            true positive, rather than something the evidence establishes.
          items:
            type: object
            properties:
              id: { type: string, example: T1071.004 }
              name: { type: string }
              tactic: { type: string }
              url: { type: string, format: uri }
              rationale: { type: string }
              hypothesis: { type: boolean }
        falsePositives:
          type: array
          items: { type: string }
          description: Benign traffic known to produce this shape.
        nextSteps:
          type: array
          items: { type: string }
        detector: { type: string }
        maturity:
          type: string
          enum: [available, experimental]
          description: |
            `experimental` means the logic is tested but its thresholds have
            not been validated against enough real-world traffic to promise a
            false-positive rate. Every detector is currently experimental.

    APIProvider:
      type: object
      description: |
        A configured external intelligence provider. This schema carries no
        credential and there is no variant of it that does.
      properties:
        id: { type: string, example: apr_3f9c1a8b2d40 }
        name: { type: string, example: VirusTotal }
        kind:
          type: string
          description: Which compiled-in adapter this row uses. Immutable once created.
          example: virustotal
        enabled: { type: boolean }
        capabilities:
          type: array
          items: { type: string, enum: [reputation, enrichment, feed] }
          description: The subset the operator switched on, which may be narrower than the adapter supports.
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Adapter-specific settings. Stored unencrypted and returned here, so
            a credential must never be put in one — every adapter that needs a
            credential has a field for it.
        timeoutMs: { type: integer, example: 2000 }
        ratePerMinute: { type: integer, example: 4 }
        cacheTtlSeconds: { type: integer, example: 21600 }
        policyScope:
          type: array
          items: { type: string }
          description: Policy IDs this provider applies to. Empty means all of them.
        secretSet:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        secretHint:
          type: string
          description: The credential's last four characters, or empty when none is stored.
          example: 0d65
        rotatedAt: { type: string, format: date-time }
        status: { type: string, enum: [ok, disabled, error] }
        detail:
          type: string
          description: Why a non-ok provider is not working, in terms the operator can act on.
        displayName: { type: string }
        privacyNote:
          type: string
          description: What this provider sends to the third party.
        docsUrl: { type: string }
        liveVerified:
          type: boolean
          description: Whether this adapter has been exercised against the vendor's live service.
        verification:
          type: string
          description: The evidence that exists that this adapter works.
        stats: { $ref: "#/components/schemas/ProviderStats" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    APIProviderInput:
      type: object
      required: [kind]
      properties:
        name: { type: string, example: VirusTotal }
        kind: { type: string, example: virustotal }
        enabled: { type: boolean }
        capabilities:
          type: array
          items: { type: string, enum: [reputation, enrichment, feed] }
        config:
          type: object
          additionalProperties: { type: string }
        timeoutMs: { type: integer }
        ratePerMinute: { type: integer }
        cacheTtlSeconds: { type: integer }
        policyScope:
          type: array
          items: { type: string }
        secret:
          type: string
          writeOnly: true
          description: |
            The credential. Encrypted with AES-256-GCM before it reaches disk
            and never returned by any endpoint — not here, not on read, not in
            an error.

    APIProviderPatch:
      type: object
      description: |
        Every field optional. `kind` and `secret` are deliberately absent: both
        are refused by this route, with the error naming what to do instead.
      properties:
        name: { type: string }
        enabled: { type: boolean }
        capabilities:
          type: array
          items: { type: string, enum: [reputation, enrichment, feed] }
        config:
          type: object
          additionalProperties: { type: string }
        timeoutMs: { type: integer }
        ratePerMinute: { type: integer }
        cacheTtlSeconds: { type: integer }
        policyScope:
          type: array
          items: { type: string }

    ProviderStats:
      type: object
      description: The resilient HTTP client's counters for one provider.
      properties:
        calls: { type: integer }
        failures: { type: integer }
        meanLatencyMs: { type: integer }
        errorRate: { type: number, format: double }
        lastError: { type: string }
        lastCallAt: { type: string, format: date-time }
        breaker:
          type: string
          enum: [closed, open, half-open]
          description: Open means the provider is being skipped until its cooldown expires.
        breakerTrips: { type: integer }
        rateWaits: { type: integer }

    ProviderTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        error:
          type: string
          description: Why the test failed. Never contains the credential.
        detail: { type: string }
        providerId: { type: string }

    ProviderTemplate:
      type: object
      description: One adapter, as the add-provider wizard renders it.
      properties:
        kind: { type: string }
        displayName: { type: string }
        summary: { type: string }
        docsUrl: { type: string }
        privacyNote: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [reputation, enrichment, feed] }
        liveVerified: { type: boolean }
        verification: { type: string }
        secretLabel:
          type: string
          description: What this vendor calls its credential, so the form asks for the thing the operator is looking at.
        secretRequired: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              placeholder: { type: string }
              help: { type: string }
              required: { type: boolean }
              default: { type: string }
        defaultTimeoutMs: { type: integer }
        defaultRatePerMinute: { type: integer }
        defaultCacheTtlSeconds: { type: integer }

    ReputationSetting:
      type: object
      properties:
        mode: { type: string, enum: ["off", cache_only, blocking] }
        ceiling:
          type: string
          enum: ["off", cache_only, blocking]
          description: The highest mode dnsdaddy.yaml permits. Cannot be raised over this API.
        selectable:
          type: array
          items: { type: string, enum: ["off", cache_only, blocking] }
          description: The modes this deployment will accept. A dashboard offers exactly these.

    IntelEngineStats:
      type: object
      description: The asynchronous lookup engine's counters.
      properties:
        reputationMode: { type: string, enum: ["off", cache_only, blocking] }
        workers: { type: integer }
        queueSize: { type: integer }
        queueDepth: { type: integer }
        enqueued: { type: integer }
        dropped:
          type: integer
          description: Lookups discarded because the queue was full. Dropping is deliberate — a full queue must never put back-pressure on the DNS path.
        completed: { type: integer }
        cacheHits: { type: integer }
        cacheMisses: { type: integer }
        cacheSize: { type: integer }
        enrichment: { type: boolean }

    EvidenceSubject:
      type: object
      properties:
        type: { type: string, enum: [domain, ip, device] }
        value: { type: string, example: evil.example }

    Evidence:
      type: object
      description: |
        One source's claim about one subject at one time. The common shape for
        feed matches, provider answers, detector findings, local observations
        and operator decisions.
      properties:
        id: { type: string, example: ev_3f9c1a8b2d40 }
        subject: { $ref: "#/components/schemas/EvidenceSubject" }
        kind:
          type: string
          enum: [feed, provider, detector, local, operator]
          description: |
            How much this claim is worth differs by kind in a way it does not
            differ within one. A feed match means a human curated an indicator;
            a detector result means a heuristic inferred intent from traffic.
        source: { type: string, description: Feed ID, provider ID, detector name, or "operator". }
        sourceName:
          type: string
          description: |
            The display name as it was when this was recorded. Denormalised so
            that renaming a feed cannot change the explanation of a block that
            already happened.
        claim: { type: string, example: listed as malware }
        category: { type: string, example: malware }
        confidence:
          type: string
          enum: [low, medium, high]
          description: |
            Three values, not a number, so that claims from sources with no
            common scale cannot be averaged into a figure nobody can reproduce.
        observedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Absent when the claim does not expire on its own.
        detail:
          type: object
          additionalProperties: true
          description: The source's own supporting data, in the source's terms. Untrusted input.

    Assessment:
      type: object
      description: |
        What the evidence supports. Everything here can be re-derived by hand
        from the evidence list: there is no score and no weighting between
        sources.
      properties:
        subject: { $ref: "#/components/schemas/EvidenceSubject" }
        verdict: { type: string, enum: [unknown, benign, suspicious, malicious] }
        confidence:
          type: string
          enum: [low, medium, high]
          description: |
            The highest confidence among supporting evidence — not an average,
            and not raised by corroboration.
        summary: { type: string }
        categories: { type: array, items: { type: string } }
        sources:
          type: array
          items: { type: string }
          description: The distinct sources supporting the verdict, so corroboration can be shown as the specific sources that corroborate.
        corroborated:
          type: boolean
          description: Whether more than one independent source supports the verdict.
        inferenceOnly:
          type: boolean
          description: |
            True when nothing but behavioural inference supports this, so the
            interface can word it differently. "A heuristic thinks so" and "a
            curator listed it" are not the same claim.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }

    Decision:
      type: object
      description: One recorded enforcement or alert, and what decided it.
      properties:
        id: { type: string, example: dec_7b1e04c9a2f3 }
        time: { type: string, format: date-time }
        queryLogId:
          type: integer
          description: The query-log row, when one was kept. Absent when query logging is off.
        subject: { $ref: "#/components/schemas/EvidenceSubject" }
        action: { type: string, enum: [blocked, allowed] }
        category: { type: string }
        rule:
          type: string
          enum: [allow_list, block_list, category, reputation]
          description: Which step of the policy evaluation reached the verdict.
        policyPath:
          type: string
          example: "network:Office → policy:Standard → category:malware → BLOCK"
        policyId: { type: string }
        networkId: { type: string }
        clientIp: { type: string }
        clientName: { type: string }
        qtype: { type: string }
        explanation:
          type: string
          description: |
            The sentence written when the decision was made. Stored rather than
            regenerated, so it cannot change after the fact.
          example: Blocked because URLhaus listed as malware.
        explanationVersion:
          type: string
          example: "1.0"
          description: Moves when the wording rules change, so two explanations can be told apart.
        evidence:
          type: array
          description: Present on the detail endpoint only.
          items:
            type: object
            properties:
              evidence: { $ref: "#/components/schemas/Evidence" }
              contributed:
                type: boolean
                description: Whether this changed the outcome, as opposed to being on file at the time.

    DecisionRecorderStats:
      type: object
      properties:
        queued: { type: integer }
        dropped:
          type: integer
          description: |
            Decisions discarded because the queue was full. Dropping is
            deliberate — recording must never put back-pressure on the DNS
            path — but a rising count means records are incomplete.
        written: { type: integer }
        failed: { type: integer }
        queueDepth: { type: integer }

    DetectorInfo:
      type: object
      properties:
        name: { type: string }
        eventType: { type: string }
        title: { type: string }
        description: { type: string }
        maturity: { type: string, enum: [available, experimental] }
        maxSeverity: { type: string, enum: [info, low, medium, high] }
        window: { type: string, example: 5m0s }
        mitre:
          type: array
          items: { type: object }
        signals:
          type: array
          items: { type: string }
        falsePositives:
          type: array
          items: { type: string }
        enforces:
          type: boolean
          description: Whether the detector can block. False for every behavioural detector.
