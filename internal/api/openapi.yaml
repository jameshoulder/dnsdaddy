      summary: Everything recorded about one client address
      description: 'The client-focused view: the names an address asked for, its

        recorded outcomes, the decisions and findings attributed to it, and

        the network and policy the current configuration maps it to now.


        Read-only. When client addresses are not recorded

        (`log.log_client_ip` off) the activity section is reported as

        unavailable with the reason, and nothing is reconstructed from other

        columns to stand in for it.

        '
      parameters:
