  /api/v1/findings:
    get:
      tags:
      - Detections
      summary: Behavioural security findings, newest first
      description: 'Findings produced by the behavioural detection engine.


        **These do not block anything.** They are heuristics that observe,

        score and explain; enforcement is done by the policy and threat-feed

        engine from curated intelligence. Every response repeats

        `enforcement: none` so a consumer never has to infer it.


        Every detector is currently **experimental**: thresholds are calibrated

        against synthetic traffic rather than a production network.

        '
      parameters:
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - info
          - low
          - medium
          - high
      - name: type
        in: query
        schema:
          type: string
        description: Event type, e.g. dns_tunnel_suspected
      - name: client
        in: query
        schema:
          type: string
        description: Exact client IP
      - name: domain
        in: query
        schema:
          type: string
        description: Substring match
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 8760
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          maximum: 1000
      - name: detail
        in: query
        schema:
          type: string
          enum:
          - 'true'
        description: Include the full finding document with each row. Off by default; a document is several
          kilobytes.
      - name: cursor
        in: query
        schema:
          type: string
        description: 'Continue from a previous page: the `nextCursor` it returned.

          Omit to start from the newest finding. A cursor this server did

          not issue is answered `400` rather than silently restarted.

          '
      - name: state
        in: query
        schema:
          type: string
          enum:
          - new
          - acknowledged
          - resolved
          - false_positive
        description: Keep only findings whose review is in this state. `new` includes findings nobody
          has reviewed.
      responses:
        '200':
          description: One page of matching findings, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingSummaryRow'
                  count:
                    type: integer
                    description: Rows in this page.
                  limit:
                    type: integer
                    description: The page size applied.
                  nextCursor:
                    type: string
                    description: 'Pass back as `cursor` for the following page. Empty

                      when this page was the last. The cursor is a keyset

                      position in `(time, id)` order rather than an offset,

                      so a finding written while a consumer is paging neither

                      repeats nor displaces a row. Stop on an empty cursor,

                      not on a short page: a page is short whenever fewer

                      rows than the limit matched.

                      '
                  enforcement:
                    type: string
                    enum:
                    - none
        '400':
          description: An unrecognised cursor, or an invalid severity
      operationId: getFindings
  /api/v1/findings/summary:
    get:
      tags:
      - Detections
      summary: Finding counts by event type and severity
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
          minimum: 1
          maximum: 365
      responses:
        '200':
          description: Grouped counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
                  total:
                    type: integer
                    format: int64
                  enabled:
                    type: boolean
                  byType:
                    type: array
                    items:
                      type: object
                      properties:
                        eventType:
                          type: string
                        severity:
                          type: string
                        count:
                          type: integer
                          format: int64
                  byState:
                    type: object
                    description: Findings in the same period by review state, every state present at zero.
                      `new` includes findings nobody has reviewed.
                    additionalProperties:
                      type: integer
                      format: int64
      operationId: getFindingsSummary
  /api/v1/findings/export:
    get:
      tags:
      - Detections
      summary: Export retained findings as bounded NDJSON pages
      description: 'Authenticated read-only NDJSON export. Every original record is compacted to one line.
        The first page freezes its time window and insertion boundary; continuation carries both. Follow
        Link until X-Truncated is false, and check X-Export-Skipped on every page. Keep all filters unchanged;
        changing page size is allowed. Records written later belong to a new export. Retention can remove
        rows between pages; review state is evaluated at each page. This is not a transactional backup
        or a durable change-feed checkpoint. For later collections use overlapping windows and deduplicate
        by id. See docs/exports.md.


        Time ascending, then ID. Original detector documents, without rewriting their evidence or appending
        review data.'
      parameters:
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - info
          - low
          - medium
          - high
      - name: type
        in: query
        schema:
          type: string
      - name: client
        in: query
        schema:
          type: string
        description: Client IP address
      - name: domain
        in: query
        schema:
          type: string
        description: Substring match
      - name: state
        in: query
        schema:
          type: string
          enum:
          - new
          - acknowledged
          - resolved
          - false_positive
        description: Current review state; concurrent reviews can change matches during a walk.
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 8760
          default: 24
        description: 0 means all retained data; use hours or since, not both.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 lower bound, at stored millisecond precision; replaces the default
          hours.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 upper bound; exports default to capture time.
      - name: limit
        in: query
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 1000
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque X-Next-Cursor from this dataset with unchanged filters. List cursors are not
          export cursors.
      responses:
        '200':
          description: NDJSON page; consult pagination and skipped-record headers.
          headers:
            X-Export-Count:
              schema:
                type: integer
              description: Valid NDJSON lines actually emitted.
            X-Export-Scanned:
              schema:
                type: integer
              description: Stored records scanned for this page.
            X-Export-Skipped:
              schema:
                type: integer
              description: Corrupt JSON records omitted; must be zero for a complete collection.
            X-Truncated:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              description: Whether a further matching page remains. A full final page is false.
            X-Next-Cursor:
              schema:
                type: string
              description: Opaque frozen-window cursor, absent on the final page. Preserve all filters.
            Link:
              schema:
                type: string
              description: Relative next-page URL with filters preserved; rel="next". Absent on the final
                page.
            X-Export-Since:
              schema:
                type: string
                format: date-time
              description: Frozen lower timestamp; absent for all retained history.
            X-Export-Until:
              schema:
                type: string
                format: date-time
              description: Frozen upper timestamp.
            X-Export-Snapshot:
              schema:
                type: string
              description: Frozen insertion boundary shared by all pages. Not a database backup.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Finding'
        '400':
          description: Malformed cursor, changed filters, invalid address or time window.
        '401':
          description: Authentication required.
      operationId: getFindingsExport
  /api/v1/findings/{id}:
    get:
      tags:
      - Detections
      summary: One finding, with its full detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingSummaryRow'
        '404':
          description: No such finding
      operationId: getFindingsById
  /api/v1/findings/{id}/review:
    put:
      tags:
      - Detections
      summary: Record an operator's disposition of a finding
      description: 'The one write on findings, and it writes beside the finding rather

        than to it: the measurements, severity, confidence and evidence the

        detector produced are never modified by a review.


        States are `new`, `acknowledged`, `resolved` and `false_positive`.

        From `new` any other state may be chosen; `acknowledged` may return

        to `new` or close as either; a closed finding reopens to

        `acknowledged` or is reclassified as the other closed state, and

        never returns straight to `new`. Writing the same state again with a

        different note is allowed and recorded.


        The request carries the `version` the caller read (0 for a finding

        nobody has reviewed). A write naming any other version is answered

        `409` with the current review, so two operators cannot silently

        overwrite each other.


        **A review changes nothing else.** Marking a finding a false

        positive does not disable a detector, relax a policy, delete

        evidence or allow a domain. It records an assessment.


        The actor recorded is the principal as the API knows it —

        `session:admin` or `token:<name>` — because that is the identity

        model this product has. No named user is invented and no session

        secret is stored.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              - version
              properties:
                state:
                  type: string
                  enum:
                  - new
                  - acknowledged
                  - resolved
                  - false_positive
                note:
                  type: string
                  maxLength: 2000
                  description: Plain text. Control characters other than newline and tab are stripped;
                    markup is kept as literal text and escaped by every renderer.
                version:
                  type: integer
                  format: int64
                  description: The version read. 0 for an unreviewed finding.
      responses:
        '200':
          description: The review as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingReview'
        '400':
          description: Unknown state, a transition the workflow does not allow, or an over-long note
        '404':
          description: No such finding
        '409':
          description: The review moved on since the caller read it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  current:
                    $ref: '#/components/schemas/FindingReview'
      operationId: putFindingsByIdReview
  /api/v1/findings/{id}/review/history:
    get:
      tags:
      - Detections
      summary: A finding's review changes, oldest first
      description: 'Application history for explaining what an operator did and when. It

        is written by the same process into the same database file as the

        findings, so it is not tamper-proof evidence against a host

        administrator, and the payload says so.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: object
                properties:
                  findingId:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        findingId:
                          type: string
                        version:
                          type: integer
                          format: int64
                        fromState:
                          type: string
                        toState:
                          type: string
                        note:
                          type: string
                        actor:
                          type: string
                        at:
                          type: string
                          format: date-time
                  note:
                    type: string
        '404':
          description: No such finding
      operationId: getFindingsByIdReviewHistory
  /api/v1/dnssec/observations:
    get:
      tags:
      - Detections
      summary: What local DNSSEC validation concluded about real traffic
      description: Stored Daddybound observations across modes. native_live and encrypted_live are same-answer Live
        validation; native is an independent Learn lookup that could not change the forwarded answer.
        A historical row keeps its provenance even after the current mode changes. The response enforcing
        field describes current runtime capability, not every historical row. secure/insecure/bogus/indeterminate
        are DNSSEC states; timeout/resource_limit/unreachable/unsupported/internal_error/not_attempted
        are distinct operational outcomes. The upstream AD assertion is separate evidence and is never
        merged into the local verdict. This GET sends no DNS or provider requests.
      parameters:
      - name: hours
        in: query
        description: Window to summarise, default 24.
        schema:
          type: integer
          minimum: 1
          maximum: 2160
      - name: status
        in: query
        description: Restrict the recent list to one status.
        schema:
          type: string
      - name: disagreements
        in: query
        description: Set to 1 to list only observations where the local and upstream views differ.
        schema:
          type: string
          enum:
          - '1'
      - name: limit
        in: query
        description: Size of the recent list, default 50. `scope.recentTruncated` reports whether the
          window held more.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - 'off'
                    - observe
                    - enforce
                  enforcing:
                    type: boolean
                    description: Whether the current native runtime is enforcing; inspect each historical
                      observation resolution to interpret that row.
                  experimental:
                    type: boolean
                  windowHours:
                    type: integer
                  summary:
                    $ref: '#/components/schemas/DNSSECObservationSummary'
                  recent:
                    type: array
                    description: Stored observations within the same window as `summary`, newest first,
                      at most `limit` of them.
                    items:
                      $ref: '#/components/schemas/DNSSECObservation'
                  scope:
                    type: object
                    description: 'Names the two populations in this payload so neither is

                      read as the other. `summary` and `recent` are stored

                      rows within the window — and only the rows the query-log

                      settings allowed to be stored. `runtime` is the

                      process''s own counters since it started, covering every

                      observation whether or not a row was kept.

                      '
                    properties:
                      summary:
                        type: string
                      recent:
                        type: string
                      runtime:
                        type: string
                        description: Current or most recent Learn activation, with active and scope identifying
                          whether collection is still running.
                      window:
                        type: object
                        properties:
                          hours:
                            type: integer
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                      recentLimit:
                        type: integer
                      recentTruncated:
                        type: boolean
                        description: The window holds more matching observations than `recent` shows.
                  runtime:
                    type: object
                    description: Independent Learn counters from the current or most recent activation.
                      available can remain true while active is false. Native Live counters are available
                      from /api/v1/dnssec/status native. No complete traffic coverage or detector-accuracy
                      denominator is implied.
                    properties:
                      available:
                        type: boolean
                      scope:
                        type: string
                        enum:
                        - since_current_learn_activation
                        - most_recent_learn_activation
                        - since_start
                      uptimeSeconds:
                        type: integer
                        format: int64
                      observed:
                        type: integer
                        format: int64
                      dropped:
                        type: integer
                        format: int64
                        description: Full-queue, stopped-observer and shutdown-abandoned work, within
                          the stated counter scope.
                      panics:
                        type: integer
                        format: int64
                      lastAt:
                        type: string
                        format: date-time
                      lastStatus:
                        type: string
                      stored:
                        type: integer
                        format: int64
                      unrecorded:
                        type: integer
                        format: int64
                      writeErrors:
                        type: integer
                        format: int64
                      active:
                        type: boolean
                        description: Whether Learn is currently running, independent of retained counter
                          availability.
      operationId: getDnssecObservations
  /api/v1/dnssec/status:
    get:
      tags:
      - Detections
      summary: The Daddybound runtime as a bounded snapshot
      description: A read-only bounded snapshot of local DNSSEC mode, transport, trust anchors, operational
        counters and stored observations. No lookup or anchor refresh is triggered. Native Live enforcement
        and experimental evidence/readiness are separate facts. Includes native live counters, independent
        Learn counters, refresh/persistence failures, observation loss and sample limitations. experimental
        is true; evidence.sufficient remains false because measured deployment-readiness criteria are
        not quantified.
      parameters:
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2160
        description: Window for the stored counts and populations, default 168.
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSSECStatus'
      operationId: getDnssecStatus
  /api/v1/detectors:
    get:
      tags:
      - Detections
      summary: What the detection engine is looking for
      description: 'The detector catalogue, generated from the running detectors rather

        than from a document. Each entry states its maturity, the signals it

        measures, the benign traffic known to look like it, its ATT&CK

        mappings, and whether it can enforce anything — which, for every

        behavioural detector, is `false`.

        '
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: At least one behavioural heuristic or local learner is configured. This
                      does not imply learningAvailable or DNS enforcement.
                  enforcement:
                    type: string
                    enum:
                    - none
                  description:
                    type: string
                  schemaVersion:
                    type: string
                    example: '1.0'
                  detectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectorInfo'
                  heuristicEnabled:
                    type: boolean
                  learningEnabled:
                    type: boolean
                  learningAvailable:
                    type: boolean
                  learningError:
                    type: string
                    description: Present when configured local learning failed to start. Stored findings
                      remain accessible.
      operationId: getDetectors
  /api/v1/queries/export:
    get:
      tags:
      - Metrics
      summary: Export retained queries as bounded NDJSON pages
      description: 'Authenticated read-only NDJSON export. Every original record is compacted to one line.
        The first page freezes its time window and insertion boundary; continuation carries both. Follow
        Link until X-Truncated is false, and check X-Export-Skipped on every page. Keep all filters unchanged;
        changing page size is allowed. Records written later belong to a new export. Retention can remove
        rows between pages; review state is evaluated at each page. This is not a transactional backup
        or a durable change-feed checkpoint. For later collections use overlapping windows and deduplicate
        by id. See docs/exports.md.


        Insertion ID ascending, including backdated events.'
      parameters:
      - name: networkId
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
          enum:
          - allowed
          - blocked
          - error
      - name: category
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
        description: Substring match
      - name: exactDomain
        in: query
        schema:
          type: string
        description: Exact normalised domain; intended for investigation continuation.
      - name: clientIp
        in: query
        schema:
          type: string
        description: Client IP; IPv4-mapped forms normalise to IPv4.
      - name: client
        in: query
        schema:
          type: string
        description: Alias for clientIp; conflicting aliases are rejected.
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 8760
          default: 24
        description: 0 means all retained data; use hours or since, not both.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 lower bound, at stored millisecond precision; replaces the default
          hours.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 upper bound; exports default to capture time.
      - name: limit
        in: query
        schema:
          type: integer
          default: 500
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque X-Next-Cursor from this dataset with unchanged filters. List cursors are not
          export cursors.
      responses:
        '200':
          description: NDJSON page; consult pagination and skipped-record headers.
          headers:
            X-Export-Count:
              schema:
                type: integer
              description: Valid NDJSON lines actually emitted.
            X-Export-Scanned:
              schema:
                type: integer
              description: Stored records scanned for this page.
            X-Export-Skipped:
              schema:
                type: integer
              description: Corrupt JSON records omitted; must be zero for a complete collection.
            X-Truncated:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              description: Whether a further matching page remains. A full final page is false.
            X-Next-Cursor:
              schema:
                type: string
              description: Opaque frozen-window cursor, absent on the final page. Preserve all filters.
            Link:
              schema:
                type: string
              description: Relative next-page URL with filters preserved; rel="next". Absent on the final
                page.
            X-Export-Since:
              schema:
                type: string
                format: date-time
              description: Frozen lower timestamp; absent for all retained history.
            X-Export-Until:
              schema:
                type: string
                format: date-time
              description: Frozen upper timestamp.
            X-Export-Snapshot:
              schema:
                type: string
              description: Frozen insertion boundary shared by all pages. Not a database backup.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/QueryEvent'
        '400':
          description: Malformed cursor, changed filters, invalid address or time window.
        '401':
          description: Authentication required.
      operationId: getQueriesExport
  /api/v1/decisions/export:
    get:
      tags:
      - Decisions
      summary: Export retained decisions as bounded NDJSON pages
      description: 'Authenticated read-only NDJSON export. Every original record is compacted to one line.
        The first page freezes its time window and insertion boundary; continuation carries both. Follow
        Link until X-Truncated is false, and check X-Export-Skipped on every page. Keep all filters unchanged;
        changing page size is allowed. Records written later belong to a new export. Retention can remove
        rows between pages; review state is evaluated at each page. This is not a transactional backup
        or a durable change-feed checkpoint. For later collections use overlapping windows and deduplicate
        by id. See docs/exports.md.


        Time ascending, then ID. Includes captured evidence and provenance.'
      parameters:
      - name: domain
        in: query
        schema:
          type: string
        description: Exact normalised domain
      - name: client
        in: query
        schema:
          type: string
        description: Client IP address
      - name: action
        in: query
        schema:
          type: string
          enum:
          - allowed
          - blocked
          - error
      - name: hours
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 8760
          default: 24
        description: 0 means all retained data; use hours or since, not both.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 lower bound, at stored millisecond precision; replaces the default
          hours.
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive RFC 3339 upper bound; exports default to capture time.
      - name: limit
        in: query
        schema:
          type: integer
          default: 500
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque X-Next-Cursor from this dataset with unchanged filters. List cursors are not
          export cursors.
      responses:
        '200':
          description: NDJSON page; consult pagination and skipped-record headers.
          headers:
            X-Export-Count:
              schema:
                type: integer
              description: Valid NDJSON lines actually emitted.
            X-Export-Scanned:
              schema:
                type: integer
              description: Stored records scanned for this page.
            X-Export-Skipped:
              schema:
                type: integer
              description: Corrupt JSON records omitted; must be zero for a complete collection.
            X-Truncated:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              description: Whether a further matching page remains. A full final page is false.
            X-Next-Cursor:
              schema:
                type: string
              description: Opaque frozen-window cursor, absent on the final page. Preserve all filters.
            Link:
              schema:
                type: string
              description: Relative next-page URL with filters preserved; rel="next". Absent on the final
                page.
            X-Export-Since:
              schema:
                type: string
                format: date-time
              description: Frozen lower timestamp; absent for all retained history.
            X-Export-Until:
              schema:
                type: string
                format: date-time
              description: Frozen upper timestamp.
            X-Export-Snapshot:
              schema:
                type: string
              description: Frozen insertion boundary shared by all pages. Not a database backup.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Malformed cursor, changed filters, invalid address or time window.
        '401':
          description: Authentication required.
      operationId: getDecisionsExport
  /api/v1/integrations/settings:
    get:
      tags:
      - Integrations
      summary: Read external API sharing settings
      description: Authenticated, persistent management of external API use without a YAML edit or restart.
        A fresh installation has reputation off and enrichment disabled. A one-time migration preserves
        the old effective YAML-disabled/ceiling state before new UI choices become authoritative; it cannot
        silently enable sharing on upgrade. New explicit saved choices then override legacy YAML initial
        values. Only configured, enabled providers in the applicable policy scope can receive data. GET
        reads local state only. cache_only may enqueue background requests on a cache miss; blocking may
        wait within the configured DNS budget. Explicit investigation enrichment is independently controlled
        and requires consent for each POST.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSettings'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIntegrationsSettings
    put:
      tags:
      - Integrations
      summary: Save external API sharing settings
      description: Authenticated, persistent management of external API use without a YAML edit or restart.
        A fresh installation has reputation off and enrichment disabled. A one-time migration preserves
        the old effective YAML-disabled/ceiling state before new UI choices become authoritative; it cannot
        silently enable sharing on upgrade. New explicit saved choices then override legacy YAML initial
        values. Only configured, enabled providers in the applicable policy scope can receive data. GET
        reads local state only. cache_only may enqueue background requests on a cache miss; blocking may
        wait within the configured DNS budget. Explicit investigation enrichment is independently controlled
        and requires consent for each POST.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSettings'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid mode or missing sharing/latency acknowledgement
          content:
            application/json:
