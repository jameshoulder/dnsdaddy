          type: boolean
        excluded:
          items:
            type: string
          type:
          - array
          - 'null'
        formatVersion:
          type: integer
        included:
          items:
            type: string
          type:
          - array
          - 'null'
        limitations:
          items:
            type: string
          type:
          - array
          - 'null'
        maxArchiveBytes:
          type: integer
          description: Maximum plaintext archive size before encryption; 1073741824 bytes in this implementation.
          minimum: 0
        restoreMode:
          type: string
        running:
          type: boolean
      required:
      - available
      - formatVersion
      - encrypted
      - restoreMode
      - running
      - included
      - excluded
      - limitations
      - maxArchiveBytes
      type: object
      description: Availability, encryption format, included/excluded state and practical restore limitations
        for the encrypted backup facility. Restore is offline CLI only; no HTTP restore route exists.
    WebhookConfig:
      properties:
        allowPrivate:
          type: boolean
          description: Explicit opt-in for RFC1918/ULA HTTPS destinations. Loopback, link-local, metadata
            and reserved/special-use destinations remain denied.
          default: false
        enabled:
          type: boolean
        eventTypes:
          items:
            type: string
            enum:
            - finding.created
            - finding.reviewed
          type:
          - array
          - 'null'
          description: Selecting review events also shares review notes and actor labels.
          minItems: 1
          maxItems: 2
          uniqueItems: true
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 8
          default: 5
        maxQueue:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        secretHint:
          type: string
          description: Four-character identification hint only. The full signing secret is never returned.
        secretSet:
          type: boolean
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 15000
          default: 5000
        updatedAt:
          format: date-time
          type: string
        url:
          type: string
          description: User-owned verified HTTPS endpoint. Must not include a query string, userinfo,
            fragment or credentials; empty is permitted only while disabled.
        version:
          type: integer
          description: Persisted configuration revision; each update increments it and discards pending
            events. Informational in GET; not accepted in the PUT body.
          minimum: 1
      required:
      - enabled
      - url
      - eventTypes
      - allowPrivate
      - timeoutMs
      - maxAttempts
      - maxQueue
      - secretSet
      - secretHint
      - version
      - updatedAt
      type: object
      description: The single optional receiver. Disabled by default. No plaintext signing secret is returned.
    WebhookStats:
      properties:
        attempted:
          minimum: 0
          type: integer
          description: Persisted attempts, including an attempt claimed before a process interruption.
        delivered:
          minimum: 0
          type: integer
        dropped:
          minimum: 0
          type: integer
          description: Events omitted because the queue was full, plus queued events discarded on configuration/secret
            changes.
        failed:
          minimum: 0
          type: integer
          description: Deliveries with a terminal failure or exhausted retry attempts.
        lastError:
          type: string
        lastFailureAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        lastHttpStatus:
          type: integer
        lastSuccessAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        queueDepth:
          type: integer
          description: Currently persisted pending deliveries; at most configured maxQueue.
          minimum: 0
          maximum: 1000
        queued:
          minimum: 0
          type: integer
        retried:
          minimum: 0
          type: integer
        scope:
          type: string
      required:
      - queueDepth
      - queued
      - attempted
      - delivered
      - failed
      - dropped
      - retried
      - lastSuccessAt
      - lastFailureAt
      - lastError
      - lastHttpStatus
      - scope
      type: object
      description: Durable totals since webhook storage was created, retained across restarts and configuration
        changes. Synthetic tests do not affect these counters.
    WebhookTestResult:
      properties:
        detail:
          type: string
        error:
          type: string
        httpStatus:
          type: integer
        latencyMs:
          type: integer
        ok:
          type: boolean
      required:
      - ok
      - latencyMs
      type: object
    ExternalRequestConsent:
      type: object
      properties:
        consent:
          type: boolean
          description: Explicit acknowledgement of the domain or event data sent to the user-configured
            external service.
          const: true
      required:
      - consent
      additionalProperties: false
    IntegrationSettings:
      type: object
      properties:
        available:
          type: boolean
          description: The idle external API engine and credential source are wired into this process.
        encryptionAvailable:
          type: boolean
          description: The local keyring can encrypt user-provided credentials.
        reputationMode:
          type: string
          enum:
          - 'off'
          - cache_only
          - blocking
        enrichmentEnabled:
          type: boolean
          description: Whether explicit, consented investigation requests may enqueue enrichment.
        selectable:
          type: array
          items:
            type: string
            enum:
            - 'off'
            - cache_only
            - blocking
        privacyNotice:
          type: string
        restartRequired:
          type: boolean
          const: false
        providerLimit:
          type: integer
          const: 64
      required:
      - available
      - encryptionAvailable
      - reputationMode
      - enrichmentEnabled
      - selectable
      - privacyNotice
      - restartRequired
      - providerLimit
    IntegrationSettingsInput:
      type: object
      properties:
        reputationMode:
          type: string
          enum:
          - 'off'
          - cache_only
          - blocking
        enrichmentEnabled:
          type: boolean
        consent:
          type: boolean
          description: Explicit acknowledgement of the domain or event data sent to the user-configured
            external service.
        acceptDnsLatency:
          type: boolean
          description: Required true when setting blocking mode; synchronous reputation may delay DNS
            within the configured budget.
      additionalProperties: false
      description: Partial update. Setting a non-off reputation mode or enabling enrichment requires consent:true.
        A disabled draft and GET requests do not contact providers.
    WebhookSettings:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/WebhookConfig'
        stats:
          $ref: '#/components/schemas/WebhookStats'
        privacyNotice:
          type: string
      required:
      - config
      - stats
      - privacyNotice
    WebhookSettingsInput:
      type: object
      properties:
        allowPrivate:
          type: boolean
          description: Explicit opt-in for RFC1918/ULA HTTPS destinations. Loopback, link-local, metadata
            and reserved/special-use destinations remain denied.
        enabled:
          type: boolean
        eventTypes:
          items:
            type: string
            enum:
            - finding.created
            - finding.reviewed
          type:
          - array
          - 'null'
          description: Selecting review events also shares review notes and actor labels.
          minItems: 1
          maxItems: 2
          uniqueItems: true
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 8
        maxQueue:
          type: integer
          minimum: 1
          maximum: 1000
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 15000
        url:
          type: string
          description: User-owned verified HTTPS endpoint. Must not include a query string, userinfo,
            fragment or credentials; empty is permitted only while disabled.
        secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: Write-only HMAC-SHA256 signing secret, 32..4096 UTF-8 bytes. Encrypted with the
            installation key and webhook-specific associated data. Cannot appear in the receiver URL.
        consent:
          type: boolean
          description: Explicit acknowledgement of the domain or event data sent to the user-configured
            external service.
      additionalProperties: false
      description: Partial update. Any update leaving delivery enabled requires consent:true. Saving any
        configuration or secret change discards pending events and counts them as dropped. Initial enablement
        requires a saved HTTPS URL and signing secret.
