          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: client
        in: query
        schema:
          type: string
        description: Optional exact client subject; selects found/unknown response shape.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Maximum list length; ignored when client is supplied.
      operationId: getLearningClients
  /api/v1/config/history:
    get:
      tags:
      - Administration
      summary: Read redacted configuration change history
      description: Newest durable management changes first. Covers authenticated management writes since
        installation of this feature; excludes provider tests, exports and backup passphrases. Direct
        SQL/YAML changes and historical changes are not reconstructed. Read pending/incomplete events
        as an unresolved outcome.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigHistory'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid paging parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: History could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Maximum events in this page.
      - name: beforeId
        in: query
        schema:
          type: integer
          minimum: 1
          format: int64
        description: Return events older than this event ID.
      operationId: getConfigHistory
  /api/v1/recovery/status:
    get:
      tags:
      - Administration
      summary: Read backup availability and restore limits
      description: Availability, encryption format, included/excluded state and practical restore limitations
        for the encrypted backup facility. Restore is offline CLI only; no HTTP restore route exists.
      responses:
        '200':
          description: Current result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStatus'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getRecoveryStatus
  /api/v1/recovery/backup:
    post:
      tags:
      - Administration
      summary: Download a passphrase-encrypted recovery bundle
      description: Capture database, installation credential key and required runtime/configuration state,
        validate the bundle, then encrypt and return an attachment. No plaintext bundle is returned. Management
        writes and simultaneous backups conflict with 409. Maximum plaintext archive size is 1 GiB and
        the operation deadline is five minutes. Store the passphrase separately. Restore requires the
        stopped offline CLI workflow documented in docs/recovery.md.
      responses:
        '200':
          description: Complete passphrase-encrypted .ddbackup attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="dnsdaddy-<UTC timestamp>.ddbackup"
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie-authenticated writes require a same-origin Origin or Referer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid JSON or passphrase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another management change or backup is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Archive size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Capture, key validation or encryption failed; no backup returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backup manager unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passphrase:
                  type: string
                  writeOnly: true
                  minLength: 1
                  maxLength: 1024
                  description: Valid UTF-8 with 12..1024 bytes. The byte bound is enforced in addition
                    to this character limit. Never logged or returned.
              required:
              - passphrase
              additionalProperties: false
      operationId: postRecoveryBackup
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token, which always begins `dnsd_`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: dnsdaddy_session
  responses:
    BadRequest:
      description: The request was rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or incorrect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PublicAckRequired:
      description: The request would permit a publicly routable range to query the resolver, which needs
        an explicit acknowledgement. The request is well-formed and may be resent verbatim with publicAck
        set to true.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              publicAckRequired:
                type: boolean
                enum:
                - true
              publicCidrs:
                type: array
                items:
                  type: string
                  example: 203.0.113.25/32
                description: The ranges that need acknowledging.
  schemas:
    ServerAddressesResponse:
      type: object
      required:
      - runtime
      - source
      - preferredAddress
      - addresses
      - listeners
      - limit
      - truncated
      - partial
      - notes
      properties:
        source:
          type: string
          enum:
          - local_interfaces
          - connection_local_address
          - configuration_only
          description: local_interfaces is operating-system interface enumeration. connection_local_address
            is only the server-side local IP of the accepted management connection when enumeration was unavailable;
            it always has partial true and an empty interface name.
        runtime:
          type: string
          enum: [host, container]
          description: Runtime marker evidence, not a claim about host port publishing or routing.
        advertised:
          type: object
          description: Optional operator-configured ordinary DNS endpoint, independent of local interfaces.
          required: [address, port, source, verified]
          properties:
            address:
              type: string
              description: Literal IP, never taken from request headers or an external discovery service.
            port:
              type: integer
              minimum: 1
              maximum: 65535
            source:
              type: string
              const: configuration
            verified:
              type: boolean
              const: false
        preferredAddress:
          type:
          - string
          - 'null'
          description: First non-loopback, non-link-local address with at least one compatible configured DNS
            listener. This is a local suggestion, not a guarantee of remote reachability. Null when none qualifies.
        addresses:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ServerAddress'
        listeners:
          type: array
          minItems: 3
          maxItems: 3
          description: UDP, TCP and DNS-over-TLS configuration, including disabled listeners
          items:
            $ref: '#/components/schemas/ServerDNSListener'
        limit:
          type: integer
          const: 32
        truncated:
          type: boolean
          description: An interface, per-interface address or returned-list bound was reached
        partial:
          type: boolean
          description: At least one interface could not be read or represented safely, or only the accepted
            local socket address is available
        notes:
          type: array
          items:
            type: string
          description: Container/NAT, listener, TLS and incompleteness explanations
    ServerAddress:
      type: object
      required:
      - address
      - family
      - type
      - interface
      - dns
      properties:
        address:
          type: string
          description: Canonical literal IP without brackets, prefix length or interface zone
        family:
          type: string
          enum:
          - ipv4
          - ipv6
        type:
          type: string
          enum:
          - private
          - public
          - loopback
          - link_local
          description: Address scope rather than a reachability test. Private includes RFC 1918, IPv6 ULA and
            shared CGNAT/overlay addresses. Loopback is usable only on the resolver host. Link-local has no
            portable endpoint suggestion and IPv6 requires a client-side scope.
        interface:
          type: string
          maxLength: 128
          description: Local operating-system interface name; empty when unknown for the accepted local socket
            fallback
        dns:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ServerDNSEndpoint'
          description: Listener-compatible candidates only. Empty for an unmatched address or link-local scope.
            An IPv6 wildcard is conservatively matched to IPv6 only; dual-stack behavior is not inferred.
    ServerDNSEndpoint:
      type: object
      required:
      - transport
      - port
      - endpoint
      properties:
        transport:
          type: string
          enum:
          - udp
          - tcp
          - dot
        port:
          type: integer
          minimum: 1
          maximum: 65535
        endpoint:
          type: string
          description: Literal IP and configured port, with brackets around IPv6. DNS-over-TLS also requires
            the appropriate certificate-matching server name and any configured network-token hostname.
    ServerDNSListener:
      type: object
      required:
      - transport
      - listen
      - enabled
      - port
      - binding
      properties:
        transport:
          type: string
          enum:
          - udp
          - tcp
          - dot
        listen:
          type: string
          description: Configured bind expression; a wildcard is not a client target
        enabled:
          type: boolean
          description: Whether this transport has a nonempty configured bind expression
        port:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 65535
          description: Numeric configured port; null if disabled or not determinable
        binding:
          type: string
          enum:
          - all
          - ipv4
          - ipv6
          - address
          - hostname
          - disabled
          - invalid
          description: Configured applicability. Hostname binds are reported without resolving them, and produce
            no inferred client endpoints. Invalid includes bind expressions without a fixed supported numeric
            port, such as runtime-assigned port zero.
    EncryptedDNSEndpoint:
      type: object
      additionalProperties: false
      required:
      - protocol
      - address
      properties:
        protocol:
          type: string
          enum: &id001
          - doq
          - doh3
          - doh2
        address:
          type: string
          minLength: 1
          maxLength: 2048
          description: DoQ host[:port] (853 default, port 53 forbidden) or an absolute HTTPS DoH URL with path.
            No URL user information, query or fragment.
        serverName:
          type: string
          maxLength: 253
          description: Certificate identity; defaults to the endpoint host. A named DoH URL must authenticate
            that same name.
        bootstrapIPs:
          type: array
          maxItems: 8
          items:
            type: string
          description: Literal IPv4/IPv6 dial targets without ports or zones; required for named endpoints.
            IP-literal endpoints can bootstrap themselves. Each connection still verifies its configured certificate
            identity.
    DNSTransportSelection:
      type: object
      additionalProperties: false
      required:
      - transport
      properties:
        transport:
          type: string
          enum:
          - native
          - encrypted
        endpoints:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/EncryptedDNSEndpoint'
          description: Approved ordered encrypted-only failover list. At least one endpoint is required for
            encrypted mode.
        acknowledgeForwarding:
          type: boolean
          description: Must be true to activate encrypted forwarding; names and supporting/background DNS questions
            are disclosed to these approved resolvers.
        acknowledgeNativeTransport:
          type: boolean
          description: Must be true when switching from encrypted forwarding to native iteration/legacy forwarding.
    DNSTransportTestRequest:
      type: object
      additionalProperties: false
      required:
      - endpoints
      - acknowledgeForwarding
      properties:
        endpoints:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/EncryptedDNSEndpoint'
        acknowledgeForwarding:
          type: boolean
          const: true
    EncryptedDNSEndpointStats:
      type: object
      required:
      - protocol
      - address
      - serverName
      - attempts
      - successes
      - failures
      - dialFailures
      - connectionsOpened
      - inFlight
      - maxConcurrent
      properties:
        protocol:
          type: string
          enum: *id001
        address:
          type: string
          minLength: 1
          maxLength: 2048
          description: DoQ host[:port] (853 default, port 53 forbidden) or an absolute HTTPS DoH URL with path.
            No URL user information, query or fragment.
        serverName:
          type: string
          maxLength: 253
          description: Certificate identity; defaults to the endpoint host. A named DoH URL must authenticate
            that same name.
        attempts:
          type: integer
          minimum: 0
        successes:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        dialFailures:
          type: integer
          minimum: 0
        connectionsOpened:
          type: integer
          minimum: 0
        inFlight:
          type: integer
          minimum: 0
        maxConcurrent:
          type: integer
          minimum: 0
        lastSuccess:
          type: string
          format: date-time
          description: Last completed measurement; omitted until measured.
        lastFailure:
          type: string
          format: date-time
          description: Last completed measurement; omitted until measured.
        lastError:
          type: string
          description: Redacted bounded failure category, never a DNS query or credential.
        tlsVersion:
          type: string
          description: TLS version of the last authenticated connection; not a liveness assertion.
        remoteAddress:
          type: string
          description: Dial target of the last authenticated connection; not a liveness assertion.
    EncryptedDNSStats:
      type: object
      required:
      - queries
      - successes
      - failures
      - rejected
      - failovers
      - inFlight
      - maxConcurrent
      - endpoints
      properties:
        queries:
          type: integer
          minimum: 0
        successes:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        failovers:
          type: integer
          minimum: 0
        inFlight:
          type: integer
          minimum: 0
        maxConcurrent:
          type: integer
          minimum: 0
        endpoints:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/EncryptedDNSEndpointStats'
      description: Bounded transport counters since activation. Authentication of the connection is separate
        from DNSSEC validation of answer data.
    DNSTransportState:
      type: object
      required:
      - transport
      - locked
      - chosenBy
      - endpoints
      - tlsMinimum
      - encryptedOnly
      - plaintextFallback
      - bootstrap
      - scope
      - daddyboundMode
      - stats
      properties:
        transport:
          type: string
          enum:
          - native
          - encrypted
        locked: &id003
          type: boolean
        chosenBy: &id002
          type: string
        reason: *id002
        endpoints:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/EncryptedDNSEndpoint'
        tlsMinimum:
          type: string
          const: '1.3'
        encryptedOnly: *id003
        plaintextFallback:
          type: boolean
          const: false
        bootstrap:
          type: string
          enum:
          - configured_ips
          - system
        scope: *id002
        daddyboundMode:
          type: string
          enum:
          - 'off'
          - observe
          - enforce
        stats:
          oneOf:
          - $ref: '#/components/schemas/EncryptedDNSStats'
          - type: 'null'
      description: The effective DNS transport selection, independently of Forward/Learn/Live. Reads
        cause no network work. Encrypted-only describes enforcement of transport policy, not endpoint availability.
    DNSTransportTestResult:
      type: object
      required:
      - ok
      - rcode
      - stats
      properties:
        ok: *id003
        rcode: *id002
        error: *id002
        stats:
          $ref: '#/components/schemas/EncryptedDNSStats'
      description: An explicit fixed root DNSKEY connectivity test. It does not save endpoints, activate a
        profile or install trust anchors; successful transport is not independent DNSSEC validation.
    Error:
      type: object
      properties:
        error:
          type: string
    Diagnostics:
      type: object
      properties:
        status:
          type: string
          enum:
          - pass
          - warn
          - fail
          description: The worst verdict across every check.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticCheck'
    DiagnosticCheck:
      type: object
      properties:
        section:
          type: string
          example: CLIENT ACCESS
        name:
          type: string
          example: Network "Home" can resolve
        status:
          type: string
          enum:
          - pass
          - warn
          - fail
        summary:
          type: string
          description: A whole sentence, read by somebody already having a bad time.
          example: Network "Home" exists in the dashboard, but DNS queries from it are REFUSED.
        evidence:
          type: array
          description: The values the verdict was reached from, so the operator can disagree.
          items:
            type: string
        action:
          type: string
          description: The next thing to do.
    DNSActivityCounts:
      type: object
      description: >-
        Arrival and completion counters for the stated scope. completed equals
        answered + blocked + errors + refused + rateLimited + invalid.
        cached is a subset of answered. Arrival and completion are counted
        separately, so a query may cross the recent window boundary.
      required: [received, completed, answered, blocked, cached, errors, refused, rateLimited, invalid]
      properties:
        received:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        answered:
          type: integer
          minimum: 0
          description: Successful NOERROR or NXDOMAIN responses, excluding policy blocks.
        blocked:
          type: integer
          minimum: 0
          description: Policy and local response-protection blocks.
        cached:
          type: integer
          minimum: 0
          description: Successful answers served from the selected resolver's cache.
        errors:
          type: integer
          minimum: 0
          description: Failed forwarding or local validation, including upstream error rcodes.
        refused:
          type: integer
          minimum: 0
          description: Queries refused by the client source ACL before resolution.
        rateLimited:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
          description: Malformed or unsupported DNS messages rejected by the handler.
    LiveActivity:
      type: object
      required: [available, status, startedAt, measuredAt, lastQueryAt, lastResponseAt, lastOutcome, lastRcode, inflight, sinceStart, recent]
      properties:
        available:
          type: boolean
        status:
          type: string
          enum: [waiting, active, idle, degraded, refused, failing, unavailable]
          description: >-
            waiting means no arrivals since handler startup; idle means no recent
            arrivals/completions or pending queries. active means observed traffic
            without recent failures. degraded means mixed successful/blocked and
            failed/refused responses. refused means recent failures are exclusively
            client ACL refusals; failing means other failures without successes.
        startedAt:
          type: string
          format: date-time
          description: Handler startup time; use as the epoch when comparing counters.
        measuredAt:
          type: string
          format: date-time
        lastQueryAt:
          type: [string, 'null']
          format: date-time
        lastResponseAt:
          type: [string, 'null']
          format: date-time
        lastOutcome:
          type: string
          enum: ['', answered, blocked, error, refused, rate_limited, invalid]
        lastRcode:
          type: string
          description: Last response's DNS rcode name (RCODE plus the number when unassigned), or empty before a response.
        inflight:
          type: integer
          minimum: 0
          description: Queries currently inside the DNS handler, across every transport and mode.
        sinceStart:
          $ref: '#/components/schemas/DNSActivityCounts'
        recent:
          allOf:
          - $ref: '#/components/schemas/DNSActivityCounts'
          - type: object
            required: [windowSeconds, queriesPerSecond]
            properties:
              windowSeconds:
                type: integer
                const: 60
              queriesPerSecond:
                type: number
                minimum: 0
                description: Recent arrivals divided by 60, including on a newly started handler.
    Overview:
      type: object
      properties:
        live:
          $ref: '#/components/schemas/LiveActivity'
        protectionStatus:
          type: string
          enum:
          - protected
          - degraded
          - offline
          description: '`offline` means no blocklist is loaded. `degraded` means a blocklist

            is loaded but no policy is enforcing anything.

            '
        resolverStatus:
          type: string
          enum:
          - operational
          - degraded
          description: '`degraded` when more than 5% of the last 24 hours'' queries failed

            to resolve, measured from the same hourly rollups as

            `queries24h`. Reads `operational` when that rate cannot be

            measured — no queries in the window, or an upgraded database

            whose error counting does not yet cover it — and

            `measured.resolver.errorRate` says which.

            '
        queries24h:
          type: integer
          format: int64
        threatsBlocked24h:
          type: integer
          format: int64
        blockRate24h:
          type: number
          format: double
        protectedNetworks:
          type: integer
        activePolicies:
          type: integer
        blocklistDomains:
          type: integer
        lastFeedRefresh:
          type:
          - string
          - 'null'
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        version:
          type: string
        hasSeenClients:
          type: boolean
          description: 'Whether a non-loopback client has **ever** used this resolver.


            A latch, not a rolling window: once a device has been seen the fact

            is recorded, so a network that goes quiet for a day does not start

            reporting that nothing has ever used the resolver.


            Loopback is excluded deliberately: health checks, `dnsdaddy doctor`

            and the operator''s own `dig` from the server all arrive from

            127.0.0.1, and counting them would report that the network is using

            the resolver when only the server is.


            Always false when `clientAttribution` is false — read the two

            together.

            '
        clientAttribution:
          type: boolean
          description: 'Whether client addresses are recorded at all (`log.query_log` and

            `log.log_client_ip`). When false, `hasSeenClients` says nothing

            about the network, only about the privacy setting.

            '
        permittedNetworks:
          type: integer
          description: 'How many enabled networks carry the resolver-access permission.


            Informational, and deliberately **not** what the dashboard''s

            first-run card branches on. A stock LAN install has none of these

            and serves every private range perfectly well, so treating zero as

            "every client will be refused" is false on the most common

            deployment there is.

            '
        unrestrictedAccess:
          type: boolean
          description: 'No client ACL is configured, so no query is refused on its source

            address. Configuration validation only permits this alongside

            loopback-only listeners or `dns.allow_public_resolver`.

            '
        servesOnlyLoopback:
          type: boolean
          description: 'The effective ACL admits nothing but this machine itself — the one

            state in which "no client can use this resolver" is a measurement

            rather than a guess.

            '
        refusedClients:
          type: integer
          format: int64
          description: 'Queries turned away by the client ACL since start.


            This is the evidence that separates two states nothing at rest can:

            a deployment whose clients arrive from addresses the ACL does not

            cover looks identical to one nobody has pointed anything at, until

            somebody tries. A climbing count with `hasSeenClients` false means

            the queries are arriving and being refused, which has a different

            fix from no queries at all.


            The refused addresses themselves are deliberately not recorded — an

            unauthorised source could otherwise fill the log.

            '
        measured:
          $ref: '#/components/schemas/OverviewMeasured'
    OverviewMeasured:
      type: object
      description: 'The overview''s factual companion. Every headline field above keeps

        its name and its meaning; this block states each underlying

        measurement separately, with the window and the scope it was taken

        over, and gives a reason wherever a number cannot be measured

        instead of a zero.


        Nothing here is a verdict about whether anything is protected. A

        configured network is not an observed device, a blocking policy

        nobody is assigned to protects nobody, a feed that downloaded is not

        a feed in the index, and a blocked query is an outcome rather than

        proof the name was malicious. The fields are cut so that none of

        those can be read into another.

        '
      required:
      - window
      - networks
      - clients
      - filtering
      - feeds
      - outcomes
      - resolver
      properties:
        window:
          type: object
          description: The period every windowed count in this block covers.
          properties:
            hours:
              type: integer
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            measuredAt:
              type: string
              format: date-time
            source:
              type: string
              enum:
              - hourly_rollups
              description: Rollups are written whether or not per-query rows are, so disabling the query
                log does not blank these counts.
            rollupRetentionDays:
              type: integer
        networks:
          type: object
          properties:
            configured:
              type: integer
              description: Every network row, the built-in catch-all included.
            enabled:
              type: integer
            resolverPermitted:
              type: integer
              description: Enabled networks carrying their own permission to query. The catch-all is excluded,
                as for `permittedNetworks`.
            adHocAccess:
              type: boolean
              description: Whether unmatched clients inside the configured pool are served.
            withBlockingPolicy:
              type: integer
              description: Enabled networks whose policy has any category or domain blocking configured.
            monitorOnly:
              type: integer
              description: Enabled networks whose policy blocks nothing.
            withTrafficInWindow:
              type: integer
              description: Configured networks that recorded at least one query in the window.
        clients:
          type: object
          properties:
            attribution:
              type: boolean
              description: Whether client addresses are recorded at all.
            observedInWindow:
              type:
              - integer
              - 'null'
              format: int64
              description: Distinct attributed client addresses seen in the window, or null when not measurable.
                Never a zero standing in for "not recorded".
            unavailable:
              type: string
              description: Why `observedInWindow` is null. Absent otherwise.
            everSeen:
              type: boolean
              description: '`hasSeenClients`, restated beside the other client fact.'
        filtering:
          type: object
          description: What is configured, as distinct from what happened.
          properties:
            policies:
              type: integer
            blockingPolicies:
              type: integer
              description: Policies with at least one category or block-list entry.
            blockingPoliciesAssigned:
              type: integer
              description: Blocking policies that some enabled network actually uses.
            monitorOnlyPolicies:
              type: integer
            customBlockingPolicies:
              type: integer
              description: Policies carrying operator block-list entries, which block with or without
                a feed index.
            categoryBlockingAvailable:
              type: boolean
              description: The feed index holds anything. Category selections block nothing while it is
                empty.
            indexedDomains:
              type: integer
        feeds:
          type: object
          properties:
            configured:
              type: integer
            enabled:
              type: integer
            loaded:
              type: integer
              description: Enabled feeds whose cached copy is in the index answering queries now. The
                only feed count that says a feed is contributing.
            failing:
              type: integer
              description: Enabled feeds whose most recent refresh attempt failed. Such a feed may still
                be loaded from an earlier download.
            neverDownloaded:
              type: integer
              description: Enabled feeds with no successful download.
            lastSuccessAt:
              type:
              - string
              - 'null'
              format: date-time
            lastAttemptAt:
              type:
              - string
              - 'null'
              format: date-time
            refreshing:
              type: boolean
        outcomes:
          type: object
          properties:
            queries:
              type: integer
              format: int64
            blocked:
              type: integer
              format: int64
            blockedByClass:
              type: object
              description: '`blocked` split by what kind of decision each block was, from

                the category recorded on the query. Every class is present,

                at zero where nothing happened, and the values sum to

                `blocked`.


                `security`: malware, phishing, C2 and cryptomining listings.

                `precaution`: newly-registered domains — a risk indicator,

                not a verdict. `preference`: ads, adult and gambling content

                the operator chose not to serve. `custom`: the operator''s own

                block-list. `unclassified`: a category this build does not

                recognise (one an external provider named, or one a newer

                build wrote) or no category at all; counted rather than

                dropped, and never counted as security.

                '
              additionalProperties:
                type: integer
                format: int64
            errors:
              type: object
              properties:
                count:
                  type: integer
                  format: int64
                  description: Queries that failed to resolve, from the same rollup rows as `queries`.
                measuredSince:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: When this database began counting errors, on an upgraded installation.
                    Null when every retained hour has been counted.
                complete:
                  type: boolean
                  description: Every hour in the window was counted.
        resolver:
          type: object
          properties:
            errorRate:
              type: object
              description: Failed resolutions over queries, both from the window, or a stated reason it
                could not be computed.
              properties:
                available:
                  type: boolean
                unavailable:
                  type: string
                  description: Why the rate is unavailable. Absent when it is available.
                numerator:
                  type: integer
                  format: int64
                denominator:
                  type: integer
                  format: int64
                ratio:
                  type: number
                  format: double
                  description: 0 to 1. Meaningful only when `available`.
                windowHours:
                  type: integer
            sinceStart:
              type: object
              description: The process's own lifetime counters, scoped to its uptime and nothing else.
                Not comparable with the windowed counts unless `coversWindow`.
              properties:
                uptimeSeconds:
                  type: integer
                  format: int64
                queries:
                  type: integer
                  format: int64
                blocked:
                  type: integer
                  format: int64
                errors:
                  type: integer
                  format: int64
                refused:
                  type: integer
                  format: int64
                coversWindow:
                  type: boolean
    ActivityBucket:
      type: object
      properties:
        hour:
          type: string
          format: date-time
        label:
          type: string
          example: '14:00'
        total:
          type: integer
          format: int64
        blocked:
          type: integer
          format: int64
    CategoryCount:
      type: object
      properties:
        category:
          type: string
        label:
          type: string
        count:
          type: integer
          format: int64
    TopBlockedDomain:
      type: object
      properties:
        domain:
          type: string
        category:
          type: string
        count:
          type: integer
          format: int64
        lastSeen:
          type: string
          format: date-time
    QueryEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        clientIp:
          type: string
        clientName:
          type: string
        networkId:
          type: string
        domain:
          type: string
        qtype:
          type: string
          example: A
        action:
          type: string
          enum:
          - allowed
          - blocked
          - error
        reason:
          type: string
          description: Plain-English explanation, suitable for reading back to a user.
          example: Domain is on a phishing list
        category:
          type: string
        source:
          type: string
          description: The feed or list that matched
        proto:
          type: string
          enum:
          - udp
          - tcp
          - dot
          - doh
        elapsedMs:
          type: integer
        cached:
          type: boolean
        dnssec:
          type: string
          enum:
          - ''
          - validated
          - unvalidated
          - servfail
          description: Serving-path status recorded with dnssecSource. For native, validated means local DNSSEC
            validation was Secure; the reply AD bit also follows client flags. For upstream, validated means
            the upstream asserted AD. Unvalidated means this path did not establish authentication; it does
            not alone prove an unsigned delegation. Servfail means resolution failed; consult reason for its
            cause. Legacy rows with no source do not establish whose validation was recorded.
        dnssecSource:
          type: string
          enum:
          - ''
          - native
          - upstream
          - encrypted_forwarded
          description: 'Recorded provenance: native or encrypted_forwarded for locally checked Live answers,
            upstream for forwarding assertions, empty for unknown legacy rows.'
    Category:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        reason:
          type: string
        defaultOn:
          type: boolean
        indexedDomains:
          type: integer
    Network:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        policyId:
          type: string
        token:
          type: string
          description: The per-network DoH path token. Treat it as a credential.
        enabled:
          type: boolean
        allowResolver:
          type: boolean
          description: 'Whether this network''s addresses may query the resolver at all — a separate decision
            from policyId, which decides what happens to those queries once they are accepted. False,
            the default, grants nothing: the client ACL from configuration still applies on its own. Changing
            this takes effect on the next query, with no restart. It governs source addresses only — a
            DoH or DoT client presenting this network''s token is identified by the token and resolves
            either way. Disable the network, or rotate its token, to cut one off.'
        cidrs:
          type: array
          items:
            type: string
          description: Client ranges attributed to this network. Empty means catch-all.
        acknowledgedPublicCidrs:
          type: array
          items:
            type: string
          description: The publicly routable ranges an operator has explicitly affirmed. Permitting a
            public range requires one; it is remembered per range, so an unrelated later edit does not
            re-prompt while introducing a new public range does.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        warning:
          type: string
          description: Present only on a write that was stored, after which the resolver could not re-read
            its configuration — so the client access being enforced could not be confirmed to match what
            is stored. It does not say the change failed to apply; which of the two it is cannot be determined
            without the read that failed. Absent otherwise.
    NetworkWithActivity:
      allOf:
      - $ref: '#/components/schemas/Network'
      - type: object
        properties:
          queries24h:
            type: integer
            format: int64
          blocked24h:
            type: integer
            format: int64
          status:
            type: string
            enum:
            - healthy
            - no-traffic
            - disabled
          publicCidrs:
            type: array
            items:
              type: string
            description: This network's ranges that are reachable from the public internet.
          coverage:
            type: string
            enum:
            - full
            - partial
            - none
            description: 'How much of this network the live effective ACL admits. A question about addresses
              only: whether the row is enabled, and whether it carries a permission of its own, decide
              what it contributes to the ACL rather than what the ACL admits, because the ACL is a union
              with no deny rules. So a disabled network inside a permitted range reports full, and a permission
              that has not been reloaded reports none despite allowResolver being true.

              `partial` is its own answer rather than a rounding of "not full": a 10.0.0.0/8 network against
              a permitted 10.0.0.0/16 has 65k addresses served and the rest refused, which is the state
              that presents as intermittent breakage.'
          resolvesVia:
            type: string
            description: When coverage is full and allowResolver is false, the wider permitted range responsible.
              Client access has no deny rules, so a narrower network without a permission does not carve
              a hole in a broader permitted one.
    ClientAccess:
      type: object
      description: 'The effective client ACL. Not a plain union: bootstrapCidrs names the addresses eligible
        to be served, and the built-in Default network''s ad-hoc access switch decides whether unmatched
        clients inside them are actually served. A permitted network contributes its own ranges regardless
        of that switch, and the loopback ranges named in bootstrapCidrs stay admitted while it is off.'
      properties:
        unrestricted:
          type: boolean
          description: True when no client ACL is configured, so no query is refused on its source address.
            Configuration validation only permits this alongside loopback-only listeners or allowPublicResolver.
        allowPublicResolver:
          type: boolean
        bootstrapCidrs:
          type: array
          items:
            type: string
          description: dns.allowed_client_cidrs, exactly as configured — which addresses are eligible
            to be served, not necessarily which are being served. Compare adHocAccess. Changing it needs
            a restart.
        adHocAccess:
          type: boolean
          description: Whether unmatched clients inside bootstrapCidrs may resolve. False means those
            ranges are eligible but currently withheld, and only explicitly permitted networks (plus loopback)
            are served. True where no Default network governs the decision, which is the behaviour that
            predates the switch.
        adHocAccessGated:
          type: boolean
          description: Whether a Default network was present to make that decision. It separates "ad-hoc
            access is on" from "nothing is gating this", which are indistinguishable from adHocAccess
            alone.
        effectiveCidrs:
          type: array
          items:
            type: string
          description: What is actually enforced, after the ad-hoc switch is applied. Empty when unrestricted
            is true, which means everything is accepted rather than nothing.
        dashboardCidrs:
          type: array
          items:
            type: string
          description: 'The distinct ranges permitted by networks, as opposed to by configuration. Not
            the same as effectiveCidrs minus bootstrapCidrs: a range that appears in both survives that
            subtraction as nothing, which would report a network the operator had just permitted as contributing
            no ranges.'
    NetworkInput:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        policyId:
          type: string
        cidrs:
          type: array
          items:
            type: string
            example: 10.0.10.0/24
        enabled:
          type: boolean
        allowResolver:
          type: boolean
          description: 'Permit this network''s addresses to query the resolver. Omitted leaves the stored
            value alone, so a client updating a name cannot silently revoke access it never mentioned.
            A default route (0.0.0.0/0 or ::/0) is refused with 400 whatever else is sent: dns.allow_public_resolver
            is the setting for that, and it lives in configuration.'
        publicAck:
          type: boolean
          description: Affirms, in this request, that the publicly routable ranges it results in may reach
            the resolver. Without it such a write is refused with 409 and a publicCidrs list naming them;
            resend the same request with this set to proceed.
    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
        blockMode:
          type: string
          enum:
          - nxdomain
          - zeroip
          - refused
        safeSearch:
          type: boolean
          deprecated: true
          description: Not enforced. The value is stored on the policy and echoed back here, but the resolver
            does not act on it and no search engine is rewritten. Setting it true changes nothing about
            how queries are answered. Do not use it as a signal that safe search is in effect. Tracked
            in docs/roadmap.md; this field will start behaving as its name suggests only when enforcement
            lands.
        logQueries:
          type: boolean
          description: When false, statistics are still recorded but no per-query rows are stored.
        isDefault:
          type: boolean
        allowDomains:
          type: array
          items:
            type: string
        blockDomains:
          type: array
          items:
            type: string
        assigned:
          type: integer
          description: Number of networks using this policy
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
        blockMode:
          type: string
          enum:
          - nxdomain
          - zeroip
          - refused
        safeSearch:
          type: boolean
          deprecated: true
          description: Accepted and stored, but not enforced — see the note on Policy.safeSearch. Sending
            it has no effect on resolution.
        logQueries:
          type: boolean
        allowDomains:
          type: array
          items:
            type: string
        blockDomains:
          type: array
          items:
            type: string
    Feed:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        category:
          type: string
        format:
          type: string
          enum:
          - auto
          - hosts
          - domains
          - adblock
          - observatory
          description: The legacy observatory format name remains a compatible JSON feed parser for user-configured
            feeds; it does not enable a built-in service or credentials.
        enabled:
          type: boolean
        builtin:
          type: boolean
        domainCount:
          type: integer
        indexedDomains:
          type: integer
          description: Domains this feed contributes after de-duplication against higher-priority feeds.
        loaded:
          type: boolean
          description: 'Whether this feed''s cached copy is in the index answering queries right now.
            This, not lastSuccessAt, is what says a feed is protecting anything: a feed whose cached file
            has gone missing or will not parse is skipped at every rebuild while its row still shows a
            healthy refresh.'
        loadError:
          type: string
          description: Why the cached copy could not be loaded, when it could not. Empty otherwise.
        lastRefreshedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When this feed was last attempted, successfully or not.
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When this feed last downloaded usable content. Null means it never has. While a
            feed is erroring this is what says how old the intelligence still in the index is.
        lastStatus:
          type: string
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeedInput:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        category:
          type: string
        format:
          type: string
          enum:
          - auto
          - hosts
          - domains
          - adblock
          - observatory
        enabled:
          type: boolean
    Client:
      type: object
      properties:
        ip:
          type: string
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
    APIToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
    APITokenCreated:
      description: 'A newly created token. This is the only schema in this API that carries

        a credential, and the only response that ever returns one: the secret

        is shown once, at creation, and is not recoverable afterwards.

        '
      allOf:
      - $ref: '#/components/schemas/APIToken'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: Shown once. Store it now; it cannot be read back.
    ResolverInfo:
      type: object
      properties:
        listenUdp:
          type: string
        listenTcp:
          type: string
        listenDot:
          type: string
        dohUrl:
          type: string
        upstreams:
          type: array
          items:
            type: object
            properties:
              spec:
                type: string
              protocol:
                type: string
                enum:
                - udp
                - tcp
                - tls
                - https
              address:
                type: string
              queries:
                type: integer
                format: int64
              errors:
                type: integer
                format: int64
              avgLatencyMs:
                type: number
                format: double
        networks:
          type: array
          items:
            type: object
            properties:
              networkId:
                type: string
              name:
                type: string
              dohUrl:
                type: string
        transport:
          type: string
          enum:
          - native
          - encrypted
    Settings:
      type: object
      properties:
        version:
          type: string
        dataDir:
          type: string
        queryLog:
          type: boolean
        logClientIp:
          type: boolean
        retentionDays:
          type: integer
        rollupDays:
          type: integer
        cacheEnabled:
          type: boolean
        cacheMaxEntries:
          type: integer
        cacheEntries:
          type: integer
        cacheHitRate:
          type: number
          format: double
        cacheLookups:
          type: integer
          format: int64
          description: 'Hits plus misses since start. The denominator behind cacheHitRate: a rate of 0 means
            either that the cache answered none of the lookups it saw or that it has not seen any, and only
            this field separates the two. A client showing the rate should show nothing when this is zero.'
        feedRefreshInterval:
          type: string
        upstreamMode:
          type: string
          enum:
          - failover
          - race
        queryLogRows:
          type: integer
          format: int64
        memoryMb:
          type: number
          format: double
        goroutines:
          type: integer
        uptimeSeconds:
          type: integer
          format: int64
        resolutionTransport:
          type: string
          enum:
          - native
          - encrypted
    ReportSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        periodDays:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        version:
          type: string
        totals:
          type: object
          properties:
            queries:
              type: integer
              format: int64
            blocked:
              type: integer
              format: int64
            errors:
              type: integer
