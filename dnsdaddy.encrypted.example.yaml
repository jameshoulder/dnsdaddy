# Working, opt-in example: Daddybound Live over Cloudflare DNS over HTTPS.
# Running this file explicitly chooses Cloudflare to receive DNS questions.
# No account, API key, domain name or server certificate is needed for this
# OUTBOUND connection. Your devices' connection to DNS Daddy is separate.
# See docs/encrypted-dns.md for Docker, client access and troubleshooting.
#
# Standalone (after `make build`):
#   ./bin/dnsdaddy -config ./dnsdaddy.encrypted.example.yaml
#   dig @127.0.0.1 -p 5353 example.com
#   dig @127.0.0.1 -p 5353 example.com +tcp
# Dashboard: http://127.0.0.1:8080
# Password:  ./tmp/encrypted-example/initial-password.txt
#
# Docker: use deploy/docker-compose.encrypted.yml with the main Compose file.
# That overlay publishes standard DNS port 53 and uses the existing data volume.

data_dir: ./tmp/encrypted-example

dns:
  # High, loopback ports let you try the standalone binary without root or
  # disrupting an existing DNS service. Docker overrides these inside its
  # container. For LAN use, choose an actual LAN address on port 53, then
  # add/permit the clients' network in Networks before changing their DNS.
  listen_udp: "127.0.0.1:5353"
  listen_tcp: "127.0.0.1:5353"
  allowed_client_cidrs: ["127.0.0.0/8", "::1/128"]
  allow_public_resolver: false

  # These explicit selections keep this example managed by configuration.
  # For dashboard-managed choices, use the normal configuration and the
  # dashboard's example instead; removing only a selector leaves an invalid
  # or incomplete configuration rather than migrating it into the database.
  local_dnssec_validation: enforce
  resolution_transport: encrypted
  upstreams: []
  encrypted_upstreams:
    - protocol: doh2
      address: https://cloudflare-dns.com/dns-query
      server_name: cloudflare-dns.com
      bootstrap_ips: ["1.1.1.1", "1.0.0.1"]

  # HTTP/2 over TCP 443 avoids needing outbound QUIC/UDP support. The client
  # requires authenticated TLS 1.3; bootstrap IPs do not bypass certificate
  # checks. Both addresses belong to the same provider, not independent ones.
  # IPv6-only hosts can use 2606:4700:4700::1111 / 2606:4700:4700::1001 instead.
  timeout: 4s
  local_dnssec_timeout: 5s

http:
  listen: "127.0.0.1:8080"
  allow_public_bind: false

# Threat blocking, local protection and advisory learning retain their normal
# defaults. Live independently checks DNSSEC and returns SERVFAIL on bogus or
# indeterminate answers. There is no plaintext or weaker-validation fallback.
# Provider reference: https://developers.cloudflare.com/1.1.1.1/ip-addresses/
