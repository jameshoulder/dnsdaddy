# DNS Daddy — protective DNS on a small VPS.
#
#   cp .env.example .env     # set DNSDADDY_ALLOWED_CLIENT_CIDRS — see below
#   docker compose up -d
#
# The dashboard is published on 127.0.0.1:8080 only. It is NOT reachable from
# another machine by design: put Caddy in front for HTTPS (deploy/Caddyfile.example)
# and browse to your own domain. See docs/deploy.md.
#
# First-run password:  docker compose logs dnsdaddy | grep -i password
# Health:              ./deploy/healthcheck.sh
#
# Sized for a 1 GB / 1 vCPU box (a $5 Linode Nanode, Hetzner CX22, DO basic
# droplet).

services:
  dnsdaddy:
    build:
      context: .
      args:
        VERSION: ${DNSDADDY_VERSION:-dev}
    # Or use a published image instead of building:
    # image: ghcr.io/jameshoulder/dnsdaddy:latest
    container_name: dnsdaddy

    # "always", not "unless-stopped".
    #
    # unless-stopped remembers a manual `docker stop` across a reboot, so a
    # container stopped once during maintenance stays down after the machine
    # comes back — silently, and for a DNS resolver that means the whole
    # network loses name resolution until somebody notices and SSHes in.
    # "always" restores it on every daemon start. Deliberate maintenance is
    # `docker compose down` or `systemctl stop dnsdaddy-compose`, both of which
    # keep it down because the stack itself is no longer deployed.
    restart: always

    # Reap zombies and forward signals properly, so a graceful shutdown really
    # is graceful and the query-log buffer gets flushed.
    init: true
    stop_grace_period: 20s

    ports:
      # The container runs as an unprivileged user and cannot bind port 53
      # itself, so the host's 53 is published to the container's 5353.
      - "53:5353/udp"
      - "53:5353/tcp"
      # Dashboard and API — loopback only, on purpose.
      #
      # Do NOT change this to "8080:8080" to make the dashboard reachable. That
      # publishes an authenticated-but-plaintext management API to the whole
      # internet, and Docker's port publishing bypasses ufw. The supported way
      # to reach it remotely is a reverse proxy terminating TLS on 443.
      - "127.0.0.1:8080:8080"

    environment:
      # ---- Who may use this resolver -------------------------------------
      # REQUIRED on a public VPS. Queries from anything not listed here are
      # REFUSED before any upstream work.
      #
      # The built-in default covers loopback and the private ranges only, which
      # is right for a resolver on a LAN but WRONG for a VPS: your clients
      # arrive from public addresses, so leaving this unset means every real
      # query is refused and DNS appears dead.
      #
      # Set it to the same source addresses your firewall allows on port 53.
      # Include Docker's bridge gateway (172.16.0.0/12) so the published port
      # keeps working, and loopback for health checks.
      DNSDADDY_ALLOWED_CLIENT_CIDRS: "${DNSDADDY_ALLOWED_CLIENT_CIDRS:-127.0.0.0/8,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"

      # Upstreams are DNS-over-TLS by default: queries DNS Daddy forwards are
      # encrypted, so the ISP cannot read or tamper with them.
      DNSDADDY_UPSTREAMS: "tls://9.9.9.9:853#dns.quad9.net,tls://1.1.1.1:853#cloudflare-dns.com"
      DNSDADDY_UPSTREAM_MODE: "failover"

      # ---- Reverse proxy --------------------------------------------------
      # Peers whose X-Forwarded-For / X-Real-IP / X-Forwarded-Proto are
      # believed. Empty means none, which is correct when nothing proxies us.
      #
      # With Caddy on the host, requests reach the container from the Docker
      # bridge gateway, not 127.0.0.1 — so trusting only loopback would not
      # work here. Keep it to the bridge network and nothing wider.
      DNSDADDY_TRUSTED_PROXY_CIDRS: "${DNSDADDY_TRUSTED_PROXY_CIDRS:-}"

      # auto | always | never. Set "always" once TLS is in front, so the
      # session cookie can never travel over plain HTTP.
      DNSDADDY_SECURE_COOKIES: "${DNSDADDY_SECURE_COOKIES:-auto}"

      # Public URL of the dashboard, used to build the DoH URLs shown on the
      # Setup page. Without it they are built from the Host header.
      DNSDADDY_BASE_URL: "${DNSDADDY_BASE_URL:-}"

      # Leave off. The bare /dns-query path has no client authentication, so
      # behind a public proxy it would be an open DoH resolver.
      DNSDADDY_ALLOW_UNTOKENIZED_DOH: "false"

      # Set this to skip the generated first-run password. Leave it unset and
      # DNS Daddy writes one to the data volume and prints it once.
      # DNSDADDY_ADMIN_PASSWORD: "change-me-to-something-long"

      # Query logging. Retention is in days; statistics outlive the raw log so
      # the dashboard keeps its history at a shorter retention.
      DNSDADDY_QUERY_LOG: "true"
      DNSDADDY_LOG_CLIENT_IP: "true"
      DNSDADDY_RETENTION_DAYS: "7"
      DNSDADDY_ROLLUP_DAYS: "90"

      # ---- Threat feeds ---------------------------------------------------
      # Our own DNS Daddy Threat Observatory ships in the catalog DISABLED, so
      # nothing here fetches from a server we run until you turn it on from the
      # Threat feeds page. docs/threat-intel.md says what that exposes.
      #
      # Minimum severity to index from it once enabled: low | medium | high |
      # critical. Unset indexes everything it lists.
      # DNSDADDY_OBSERVATORY_MIN_SEVERITY: "high"

      DNSDADDY_LOG_LEVEL: "info"
      # Set your own IANA timezone (e.g. UTC) so report timestamps
      # render in your local time. Defaults to UTC.
      TZ: "${TZ:-UTC}"

      # Go's heap target. Keeps the resolver well inside a 1 GB box even with
      # a large blocklist, at the cost of slightly more GC work.
      GOMEMLIMIT: "512MiB"

    volumes:
      # Named volume holding the SQLite database, session key, cached feeds and
      # the first-run password. Never `docker compose down -v` in production —
      # that deletes it.
      - dnsdaddy-data:/var/lib/dnsdaddy

    # Liveness, not "is the service fully protecting the network".
    #
    # This deliberately accepts "degraded", because a fresh install is degraded
    # until the first feed download finishes and restarting the container would
    # only make that take longer. Whether filtering is actually in force is a
    # monitoring question, answered by deploy/healthcheck.sh, which requires
    # status=ok and a non-empty blocklist.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q '\"status\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: a cold start rebuilds the blocklist index from cached feeds.
      start_period: 60s

    # Modest caps so a runaway process cannot take the whole VPS with it.
    # mem_limit applies under plain `docker compose`; the deploy block is
    # honoured by Swarm. Both are set so either path is bounded.
    mem_limit: 640m
    deploy:
      resources:
        limits:
          memory: 640M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # DNS Daddy Lab — docker compose --profile lab up
  # ===========================================================================
  #
  # A completely isolated demonstration environment. It runs its own resolver,
  # its own upstream, and its own synthetic clients on a private network, and
  # touches nothing outside it: no query leaves the machine, and no malicious
  # infrastructure is contacted, because there is none to contact.
  #
  #   docker compose --profile lab up --build
  #   open http://127.0.0.1:8081        (password: dnsdaddy-lab-demo-password)
  #
  # Findings start appearing after about a minute. Tear it down with
  # `docker compose --profile lab down -v`, which is safe: the lab keeps its
  # own volume and never touches the production one.
  #
  # Why a second resolver rather than the main one:
  #
  #   The lab compresses detection windows (detection.window_scale) so that a
  #   demonstration produces findings in a minute rather than five. That is a
  #   demo setting, not a tuning knob, and it has no business being applied to
  #   the instance answering a real network's DNS. Keeping them separate means
  #   you can run the lab on the same box as a live deployment.

  lab-sink:
    profiles: [lab]
    build:
      context: .
      target: lab
    container_name: dnsdaddy-lab-sink
    # Serves the synthetic zone the scenarios query. The attacker's domains
    # resolve — a tunnel domain has to, or the tunnel does not work — and
    # everything else answers NXDOMAIN, which is what a DGA's candidate list
    # actually looks like from a resolver's seat.
    command: ["-sink", "0.0.0.0:5300"]
    networks:
      lab:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  lab-resolver:
    profiles: [lab]
    build:
      context: .
    container_name: dnsdaddy-lab-resolver
    depends_on:
      - lab-sink
    environment:
      # The lab's only upstream. Plain UDP to a container on a private
      # network, which would be wrong for a real deployment and is exactly
      # right here: it keeps the lab offline and removes TLS from the picture.
      DNSDADDY_UPSTREAMS: "udp://172.30.0.10:5300"
      DNSDADDY_ALLOWED_CLIENT_CIDRS: "172.30.0.0/16,127.0.0.0/8"
      DNSDADDY_ADMIN_PASSWORD: "dnsdaddy-lab-demo-password"

      # No feed downloads: the lab demonstrates behavioural detection, and
      # pulling half a million domains would only slow the demo down.
      DNSDADDY_FEED_REFRESH_ON_START: "false"

      DNSDADDY_DETECTION_ENABLED: "true"
      DNSDADDY_DETECTION_MIN_SEVERITY: "low"
      DNSDADDY_DETECTION_EVAL_INTERVAL: "5s"
      DNSDADDY_DETECTION_COOLDOWN: "2m"
      DNSDADDY_DETECTION_FINDINGS_FILE: "findings.jsonl"

      # Detection windows at a tenth of production, paired with traffic
      # generated ten times faster below. The two must move together: the
      # detectors' minimum-volume gates do not scale, so compressing the
      # window without compressing the traffic produces silence.
      DNSDADDY_DETECTION_WINDOW_SCALE: "0.1"

      DNSDADDY_LOG_LEVEL: "info"
      TZ: "${TZ:-UTC}"
    ports:
      # Loopback only, like the production service. Different ports so the lab
      # can run alongside a real deployment on the same host.
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:5354:5353/udp"
    volumes:
      - dnsdaddy-lab-data:/var/lib/dnsdaddy
    networks:
      lab:
        ipv4_address: 172.30.0.20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # --- synthetic clients -----------------------------------------------------
  #
  # One container per scenario, each with its own address, because most of the
  # detectors are client-scoped: run every scenario from one IP and they blend
  # into a single host doing everything at once, which is not what any of them
  # is meant to show.
  #
  # Two of these are supposed to produce nothing. That is the point — a
  # detection demo that only ever shows detections teaches you nothing about
  # false positives.

  lab-normal:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "normal-dns", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.31 } }
    restart: on-failure:3

  lab-tunnelling:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "dns-tunnelling", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.32 } }
    restart: on-failure:3

  lab-high-entropy:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "high-entropy-subdomains", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.33 } }
    restart: on-failure:3

  lab-nxdomain:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "nxdomain-anomaly", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.34 } }
    restart: on-failure:3

  lab-txt:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "suspicious-txt", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.35 } }
    restart: on-failure:3

  lab-dga:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "dga-simulation", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.36 } }
    restart: on-failure:3

  lab-beaconing:
    profiles: [lab]
    build: { context: ., target: lab }
    depends_on: [lab-resolver]
    command: ["-server", "172.30.0.20:5353", "-scenario", "beaconing", "-speed", "10", "-no-bind", "-quiet"]
    networks: { lab: { ipv4_address: 172.30.0.37 } }
    restart: on-failure:3

volumes:
  dnsdaddy-data:
  dnsdaddy-lab-data:

networks:
  # Static addressing, so each scenario has a stable identity in the dashboard
  # and in findings rather than whatever address Docker happened to hand out.
  #
  # Not marked `internal`. What keeps the lab offline is that lab-resolver's
  # only upstream is the synthetic responder on this network — no synthetic
  # query has anywhere else to go. Cutting the network off from the host as
  # well would also cut off the published dashboard port, which is the one
  # thing the lab exists to show you.
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
